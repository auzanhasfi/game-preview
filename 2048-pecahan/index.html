<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>2048 Pecahan</title><link rel="stylesheet" href="../_kit/edu.css">
<style>
body{background:#faf8ef;color:#776e65;display:grid;place-items:center}
.wrap{width:min(92vw,calc(100vh - 150px),480px);margin-top:50px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.top h2{margin:0;font-size:clamp(28px,6vw,46px);color:#776e65;line-height:1}
.top p{margin:0;font-size:14px;text-align:right}
#board{position:relative;aspect-ratio:1;background:#bbada0;border-radius:10px;padding:2.5%;touch-action:none}
.cell{position:absolute;width:21.25%;height:21.25%;border-radius:6px;background:rgba(238,228,218,.35)}
.tile{position:absolute;width:21.25%;height:21.25%;border-radius:6px;display:grid;place-items:center;font-weight:700;transition:left .11s ease-in-out,top .11s ease-in-out;z-index:2}
.tile .f{display:flex;flex-direction:column;align-items:center;line-height:1;font:700 clamp(18px,4.6vw,34px) 'Space Mono',monospace}
.tile .f i{font-style:normal;border-top:3px solid currentColor;padding-top:2px;margin-top:2px}
.tile.new{animation:ap .2s}.tile.merged{animation:pop .2s;z-index:3}
@keyframes ap{from{transform:scale(0)}}@keyframes pop{50%{transform:scale(1.18)}}
.v0{background:#eee4da;color:#776e65}.v1{background:#ede0c8;color:#776e65}.v2{background:#f2b179;color:#fff}.v3{background:#f59563;color:#fff}.v4{background:#f67c5f;color:#fff}.v5{background:#f65e3b;color:#fff}
.v6{background:#edcf72;color:#fff;box-shadow:0 0 22px 6px rgba(243,215,116,.55)}.v7{background:#edcc61;color:#fff}.v8{background:#edc850;color:#fff}.v9{background:#3c3a32;color:#fff}
.hint{margin-top:10px;font-size:14px;text-align:center}
</style></head><body>
<div class="wrap"><div class="top"><h2>2048<br><span style="font-size:.5em">Pecahan</span></h2><p>Gabungkan pecahan yang sama.<br><b>Target: 1 utuh</b></p></div><div id="board"></div><p class="hint">Panah / WASD / geser layar</p></div>
<script src="../_kit/edu.js"></script>
<script>
/* 2048 Pecahan: remake 2048 (gabrielecirulli/2048, MIT). Logika ditulis ulang, tampilan meniru warna aslinya. */
var LBL=['1/64','1/32','1/16','1/8','1/4','1/2','1','2','4','8'];
var N=4,grid,score=0,id=0,won=false,run=false,board=EDU.$('#board'),moves=0;
EDU.hud({title:'2048 Pecahan',credit:'Remake 2048 · Gabriele Cirulli (MIT)'});EDU.$('.edu-credit').classList.add('dark');
for(var r=0;r<N;r++)for(var c=0;c<N;c++){var d=document.createElement('div');d.className='cell';d.style.left=(2.5+c*24.375)+'%';d.style.top=(2.5+r*24.375)+'%';board.appendChild(d)}
function lbl(v){var s=LBL[v];if(s.indexOf('/')<0)return '<span class="f">'+s+'</span>';var p=s.split('/');return '<span class="f">'+p[0]+'<i>'+p[1]+'</i></span>'}
function place(t){t.el.style.left=(2.5+t.c*24.375)+'%';t.el.style.top=(2.5+t.r*24.375)+'%'}
function mk(r,c,v,cls){var t={r:r,c:c,v:v,el:document.createElement('div')};t.el.className='tile v'+v+' '+(cls||'');t.el.innerHTML=lbl(v);place(t);board.appendChild(t.el);grid[r][c]=t;return t}
function addRand(){var e=[];for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(!grid[r][c])e.push([r,c]);if(!e.length)return;var p=EDU.pick(e);mk(p[0],p[1],Math.random()<.9?0:1,'new')}
function move(d){
  if(!run)return false;var V=[[-1,0],[0,1],[1,0],[0,-1]][d],rows=[0,1,2,3],cols=[0,1,2,3],moved=false,merged={},msg=null;
  if(V[0]===1)rows.reverse();if(V[1]===1)cols.reverse();
  rows.forEach(function(r){cols.forEach(function(c){var t=grid[r][c];if(!t)return;var nr=r,nc=c;
    while(true){var rr=nr+V[0],cc=nc+V[1];if(rr<0||rr>=N||cc<0||cc>=N)break;var o=grid[rr][cc];
      if(!o){nr=rr;nc=cc;continue}
      if(o.v===t.v&&!merged[rr+','+cc]){grid[r][c]=null;t.r=rr;t.c=cc;place(t);var old=o;setTimeout(function(){t.el.remove();old.el.remove()},110);
        var n=mk(rr,cc,t.v+1,'merged');n.el.style.opacity=0;setTimeout(function(){n.el.style.opacity=1},100);merged[rr+','+cc]=1;score+=Math.pow(2,t.v+1);moved=true;
        msg=LBL[t.v]+' + '+LBL[t.v]+' = '+LBL[t.v+1];if(t.v+1===6&&!won){won=true;setTimeout(function(){EDU.toast('🎉 1 utuh! Lanjutkan sampai 2, 4, 8…',true);EDU.sfx('win')},200)}return}
      break}
    if(nr!==r||nc!==c){grid[r][c]=null;grid[nr][nc]=t;t.r=nr;t.c=nc;place(t);moved=true}})});
  if(moved){moves++;EDU.setScore(score);if(msg){EDU.setQ(msg);EDU.sfx('pop')}setTimeout(function(){addRand();if(!canMove())end()},120)}
  return moved;
}
function canMove(){for(var r=0;r<N;r++)for(var c=0;c<N;c++){var t=grid[r][c];if(!t)return true;if(c<N-1&&grid[r][c+1]&&grid[r][c+1].v===t.v)return true;if(r<N-1&&grid[r+1][c]&&grid[r+1][c].v===t.v)return true}return false}
function end(){run=false;var m=0;grid.forEach(function(row){row.forEach(function(t){if(t&&t.v>m)m=t.v})});EDU.end({key:'2048p',score:score,max:600,head:'Papan penuh',note:'<p>Pecahan terbesar: <b>'+LBL[m]+'</b></p>'},start)}
function start(){board.querySelectorAll('.tile').forEach(function(e){e.remove()});grid=[[],[],[],[]].map(function(){return [null,null,null,null]});score=0;won=false;moves=0;run=true;EDU.setScore(0);EDU.setQ('1/64 + 1/64 = 1/32');addRand();addRand();if(EDU.demo)setTimeout(auto,500)}
document.addEventListener('keydown',function(e){var m={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3}[e.key];if(m!=null){e.preventDefault();move(m)}});
var sx,sy;board.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY});
board.addEventListener('pointerup',function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0))});
/* demo: pilih arah yang paling banyak menggabung, utamakan bawah & kiri */
function sim(d){var V=[[-1,0],[0,1],[1,0],[0,-1]][d],sc=0,mv=false;
  for(var k=0;k<4;k++){var line=[];for(var j=0;j<4;j++){var r,c;if(V[0]){c=k;r=V[0]>0?3-j:j}else{r=k;c=V[1]>0?3-j:j}line.push(grid[r][c]?grid[r][c].v:-1)}
    var f=line.filter(function(x){return x>=0}),out=[];for(var i=0;i<f.length;i++){if(f[i]===f[i+1]){out.push(f[i]+1);sc+=Math.pow(2,f[i]+1);i++}else out.push(f[i])}
    while(out.length<4)out.push(-1);if(out.join()!==line.join())mv=true}
  return mv?sc+(d===2||d===3?3:0):-1}
function auto(){if(!run)return;var best=-1,bd=2;[2,3,1,0].forEach(function(d){var s=sim(d);if(s>best){best=s;bd=d}});move(bd);setTimeout(auto,260)}
EDU.title({key:'2048p',title:'2048 Pecahan',mapel:'Matematika · SD Kelas 4 – SMP',desc:'Gabungkan dua pecahan yang sama: 1/8 + 1/8 = 1/4. Capai 1 utuh!',how:['Geser semua ubin dengan panah (atau geser layar di HP).','Dua ubin yang sama bergabung jadi dua kali lipat.','Capai 1 utuh, lalu lanjutkan ke 2, 4, 8.']},start);
</script></body></html>
