<!DOCTYPE html>
<html lang="id">

<style>
:root{--mint:#C3F0A8;--lime:#B7EE86;--lavender:#DCCBF7;--coral:#FF9270;--kuning:#FFDD57;--langit:#A5DAF7;--pink:#FFB3C9;--kertas:#FAF9F6;--tinta:#131313;--putih:#FFFFFF;--garis:#E6E2DA;--garis2:#F0EDE6;--abu:#EDEAE3;--abu-teks:#8A8494;--abu-teks2:#A8A49B;--teks2:#4A4552;--teks3:#6B6478;--ungu:#8B6FC7;--biru:#4A9FCB;--latar:#EDE8F6;--ink-mint:#3C4A33;--ink-lav:#463C55;--ink-coral:#5A2E1E;--ink-kuning:#5A4A0E;--ink-langit:#1E4457;--ink-pink:#5A2436;--coral-muda:#FFE0D6;--bata:#B5412F;--krem:#FFF1E0;--peta:#F1E8D8;--fig:'Figtree',system-ui,sans-serif;--jak:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--jak);background:var(--krem);color:var(--tinta);overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
.panggung{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.ponsel{position:relative;width:390px;height:844px;border:9px solid var(--tinta);border-radius:52px;background:var(--kertas);box-shadow:0 26px 60px rgba(19,19,19,.20);overflow:hidden;display:flex;flex-direction:column;transition:background .3s}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:118px;height:28px;background:var(--tinta);border-radius:0 0 18px 18px;z-index:6}
.status{display:flex;justify-content:space-between;align-items:center;padding:max(14px,env(safe-area-inset-top)) 26px 4px;font:800 14px var(--fig);flex:none}
.status .ik{font-size:16px}
.screens{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;gap:14px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:8px 22px 24px;background:var(--kertas)}
.screen[data-bg]{background:transparent}
.screen>*{flex-shrink:0}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:flex;animation:masuk .28s cubic-bezier(.22,.9,.3,1)}
@keyframes masuk{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes apung{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes jatuh{to{transform:translateY(900px) rotate(720deg);opacity:0}}
@keyframes scan{from{top:6%}to{top:88%}}
.ik{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:1em;height:1em;overflow:hidden;display:inline-block;font-variation-settings:'FILL' 1,'opsz' 24;letter-spacing:normal;text-transform:none;white-space:nowrap;flex:none}
.kol{display:flex;flex-direction:column}.baris{display:flex;align-items:center}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g20{gap:20px}
.f1{flex:1;min-width:0}.mt-auto{margin-top:auto}.tengah{text-align:center;justify-content:center}.hidden{display:none!important}
.rw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gulung-x{overflow-x:auto;scrollbar-width:none}.gulung-x::-webkit-scrollbar{display:none}
.mini{font:600 13px var(--jak);color:var(--abu-teks)}
.hero{font:900 42px/.98 var(--fig);letter-spacing:-.03em}
.tajuk{font:900 34px/1 var(--fig);letter-spacing:-.02em}
.judul-skrin{font:800 21px var(--fig)}
.sub{font:500 16px/1.45 var(--jak);color:var(--teks2)}
.eyebrow{font:700 13px var(--jak);text-transform:uppercase;letter-spacing:.14em;color:var(--abu-teks)}
.btn{--lip:#4a4a4a;padding:17px 26px;border-radius:100px;background:var(--tinta);color:var(--kertas);font:700 16px var(--jak);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;box-shadow:0 5px 0 var(--lip);transition:transform .12s,box-shadow .12s;margin-bottom:5px}
.btn:active,.bulat:active,.key:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lip,#4a4a4a)}
.btn.lebar{width:100%;padding:19px;font-size:17px}
.btn.kecil{padding:12px 18px;font-size:14px;min-height:44px}
.btn:disabled{background:var(--abu);color:var(--abu-teks2);--lip:var(--garis);cursor:default}
.btn.putih{background:var(--putih);color:var(--tinta);--lip:#D9D4C8}
.btn.coral{background:var(--coral);color:var(--tinta);--lip:var(--bata)}
.btn.lime{background:var(--lime);color:var(--ink-mint);--lip:#7FB84F}
.btn.garis{background:transparent;color:var(--tinta);box-shadow:none;border:2px solid var(--garis)}
.bulat{--lip:var(--bata);width:54px;height:54px;border-radius:50%;background:var(--coral);color:var(--tinta);display:grid;place-items:center;flex:none;box-shadow:0 5px 0 var(--lip);transition:transform .12s,box-shadow .12s;margin-bottom:5px}
.bulat.tinta{background:var(--tinta);color:var(--kertas);--lip:#4a4a4a}.bulat.putih{background:var(--putih);--lip:#D9D4C8}.bulat.besar{width:84px;height:84px}
.ikon-btn{width:44px;height:44px;border-radius:50%;background:var(--putih);display:grid;place-items:center;flex:none;box-shadow:0 3px 0 var(--garis)}
.kartu{background:var(--putih);border-radius:28px;padding:20px;text-align:left;box-shadow:0 4px 0 var(--garis2)}
.cip{padding:10px 18px;border-radius:100px;font:700 14px var(--jak);display:inline-flex;gap:6px;align-items:center;flex:none;min-height:40px}
.cip.mati{background:var(--abu);color:var(--abu-teks)}
.seg{display:flex;background:var(--abu);border-radius:100px;padding:4px}
.seg button{padding:8px 16px;border-radius:100px;font:700 13px var(--jak);min-height:36px}
.seg .on{background:var(--tinta);color:var(--kertas)}
.suis{width:50px;height:30px;border-radius:100px;background:var(--abu);position:relative;transition:background .2s;flex:none}
.suis i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.22,.9,.3,1)}
.suis.on{background:var(--tinta)}.suis.on i{transform:translateX(20px)}
.bar{height:10px;border-radius:99px;background:var(--abu);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tinta);border-radius:99px;transition:width .5s ease}
.bar.tebal{height:14px}
.tab{display:flex;align-items:center;justify-content:space-around;background:var(--tinta);padding:12px 14px calc(16px + env(safe-area-inset-bottom));flex:none}
.tab button{width:54px;height:46px;display:grid;place-items:center;color:rgba(255,255,255,.55);border-radius:99px}
.tab button.on{color:var(--coral)}
.tab .fab{width:62px;height:62px;border-radius:50%;background:var(--coral);color:var(--tinta);margin-top:-36px;border:5px solid var(--kertas);box-shadow:0 5px 0 var(--bata)}
.mas{position:relative;display:flex;align-items:center;justify-content:center;flex:none}
.muka{display:flex;flex-direction:column;align-items:center}
.mata{display:flex}.mata i{background:var(--tinta);display:block}
.lenc{position:absolute;top:-4px;right:-4px;background:var(--kuning);border:3px solid var(--tinta);border-radius:50%;display:grid;place-items:center}
.apung{animation:apung 4.5s ease-in-out infinite}
mark{background:var(--kuning);color:var(--ink-kuning);padding:0 4px;border-radius:6px}
.mb{display:flex;align-items:flex-end;gap:4px;height:34px}.mb i{flex:1;background:rgba(19,19,19,.55);border-radius:4px}
.opsi{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:22px;background:var(--putih);border:2px solid var(--garis);text-align:left;width:100%;font:600 16px var(--jak);min-height:58px;box-shadow:0 4px 0 var(--garis)}
.opsi .huruf{width:36px;height:36px;border-radius:50%;background:var(--abu);display:grid;place-items:center;font:800 15px var(--fig);flex:none}
.opsi .rad{display:none}
.opsi.pilih{border-color:var(--tinta);background:var(--coral-muda);box-shadow:0 4px 0 var(--tinta)}.opsi.pilih .rad{display:block}.opsi.pilih .huruf{background:var(--tinta);color:var(--coral)}
.kecil{font-size:21px!important}
.gel{display:flex;align-items:center;gap:5px;height:84px}
.gel i{flex:1;border-radius:99px;background:var(--ink-langit);opacity:.45;transition:height .12s}
.gel.rek i{opacity:1}.gel i.kuat{background:var(--tinta)}
.mik.rekam{background:var(--kuning)}
.cincin{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;flex:none}
.cincin span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--fig)}
.kf{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:jatuh 1.5s ease-in forwards;z-index:20;pointer-events:none}
.toast{position:absolute;top:62px;left:50%;transform:translate(-50%,-10px);background:var(--tinta);color:var(--kertas);padding:12px 20px;border-radius:100px;font:700 14px var(--jak);opacity:0;pointer-events:none;transition:opacity .28s ease,transform .28s ease;z-index:30;max-width:92%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.grafik{display:flex;align-items:flex-end;gap:8px;height:120px}
.grafik div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font:700 12px var(--jak)}
.grafik i{width:100%;border-radius:10px;background:var(--ungu);display:block}
.grafik .hi i{background:var(--tinta)}
.rank{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:22px;background:var(--putih);box-shadow:0 3px 0 var(--garis2)}
.rank b.n{width:26px;font:900 18px var(--fig);text-align:center}
/* layout baru */
.pola{position:absolute;inset:0;pointer-events:none;overflow:hidden}.pola i{position:absolute;background:rgba(255,255,255,.28)}
.logo{width:150px;height:150px;border-radius:44px;background:var(--putih);display:grid;place-items:center;box-shadow:0 7px 0 var(--bata)}
.scene{position:relative;height:330px;flex:none}.scene>*{position:absolute}
.gelembung{padding:12px 18px;font:800 18px var(--fig);color:var(--tinta)}
.kartu-form{background:var(--putih);border-radius:32px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;position:relative;box-shadow:0 7px 0 var(--bata)}
.lbl-f{font:700 13px var(--jak);color:var(--teks2)}
.fld{display:flex;align-items:center;gap:10px;background:var(--coral-muda);border-radius:100px;padding:0 18px;min-height:52px}
.fld input{flex:1;min-width:0;background:transparent;border:0;outline:0;font:600 15px var(--jak);height:50px}
.fld:focus-within{box-shadow:0 0 0 3px var(--tinta)}
.kls{width:44px;height:44px;border-radius:14px;background:var(--coral-muda);font:800 16px var(--fig)}
.kls.on{background:var(--tinta);color:var(--coral)}
.atau{display:flex;align-items:center;gap:10px;color:var(--abu-teks);font:600 13px var(--jak)}.atau i{flex:1;height:2px;background:var(--garis2)}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{font:800 13px var(--jak);color:var(--bata);text-decoration:underline;min-height:32px;padding:0 2px}
.cek{display:flex;align-items:center;gap:8px;font:600 13px var(--jak);color:var(--teks2)}.cek input{width:20px;height:20px;accent-color:var(--tinta)}
.dots{display:flex;gap:14px;justify-content:center}.dots i{width:20px;height:20px;border-radius:50%;background:var(--coral-muda);border:3px solid var(--tinta);display:block}.dots i.on{background:var(--tinta)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:auto}
.key{min-height:62px;border-radius:20px;background:var(--coral-muda);font:800 24px var(--fig);box-shadow:0 5px 0 var(--coral);--lip:var(--coral);display:grid;place-items:center;margin-bottom:5px}
.modal{background:var(--putih);border-radius:32px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.25);position:relative}
.hero-home{margin:-8px -22px 0;padding:14px 22px 52px;background:var(--coral);border-radius:0 0 36px 36px}
.lbl-h{font:700 12px var(--jak);color:var(--ink-coral)}
.avatar-btn{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center}
.cari{display:flex;align-items:center;gap:10px;background:var(--putih);border-radius:100px;padding:5px 5px 5px 18px;margin-top:-40px;position:relative;box-shadow:0 5px 0 var(--garis)}
.cari input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:600 15px var(--jak);height:44px}
.kat{width:84px;min-height:98px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex:none;font:700 12px var(--jak);padding:8px 4px;box-shadow:0 4px 0 rgba(19,19,19,.12)}
.banner{background:var(--bata);color:var(--putih);border-radius:28px;padding:18px 8px 18px 20px;display:flex;align-items:center;gap:6px;box-shadow:0 5px 0 rgba(19,19,19,.3);overflow:hidden}
.banner .besar{font:900 46px/1 var(--fig);color:var(--kuning)}
.kartu-p{width:150px;flex:none;background:var(--coral-muda);border-radius:26px;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 4px 0 var(--coral)}
.kartu-p .blok,.kartu-g .blok{height:96px;border-radius:20px;display:grid;place-items:center;position:relative}
.kartu-g{background:var(--coral-muda);border-radius:26px;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 4px 0 var(--coral);width:100%}
.kartu-g.kunci{opacity:.6}
.plus{width:34px;height:34px;border-radius:50%;background:var(--coral);display:grid;place-items:center;flex:none;box-shadow:0 3px 0 var(--bata)}.plus.on{background:var(--tinta);color:var(--coral);box-shadow:0 3px 0 #4a4a4a}
.row-k{background:var(--coral-muda);border-radius:26px;padding:12px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 var(--coral)}
.thumb{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font:900 28px var(--fig);flex:none}
.step{display:flex;flex-direction:column;align-items:center;background:var(--coral);border-radius:99px;padding:3px;flex:none}.step button{width:36px;height:32px;font:800 20px var(--fig);display:grid;place-items:center}.step b{font:800 14px var(--fig)}
.tot{display:flex;justify-content:space-between;font:700 16px var(--jak)}
.tot b{font:900 20px var(--fig)}
.chipu{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;font:700 12px var(--jak);width:64px}
.chipu .bl{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(19,19,19,.12)}.chipu.on .bl{outline:3px solid var(--tinta);outline-offset:2px}
.ttl{position:sticky;bottom:0;background:var(--tinta);color:var(--kertas);border-radius:26px;padding:12px 12px 12px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 5px 0 #4a4a4a;margin-top:auto}
.ib{width:40px;height:40px;border-radius:13px;background:var(--coral-muda);display:grid;place-items:center;flex:none}
.menu-r{display:flex;align-items:center;gap:14px;background:var(--putih);border-radius:22px;padding:10px 16px 10px 10px;box-shadow:0 3px 0 var(--garis);width:100%;text-align:left;min-height:58px;font:700 15px var(--jak)}
.jd{display:flex;align-items:center;gap:14px;background:var(--putih);border-radius:24px;padding:14px;box-shadow:0 5px 0 var(--garis)}
.peta{position:absolute;inset:0}.peta svg{width:100%;height:100%;display:block}
.nodo{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:1}
.nodo .bl{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;box-shadow:0 5px 0 rgba(19,19,19,.18);background:var(--abu);color:var(--abu-teks)}
.nodo.selesai .bl{background:var(--lime);color:var(--ink-mint)}
.nodo.kini .bl{background:var(--coral);width:68px;height:68px;border:4px solid #fff;color:var(--tinta)}
.nodo .tg{background:#fff;border-radius:99px;padding:5px 11px;font:700 12px var(--jak);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 0 var(--garis)}
.atas{position:absolute;top:8px;left:22px;right:22px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:2}
.bawah{position:absolute;left:16px;right:16px;bottom:14px;display:flex;flex-direction:column;gap:10px;z-index:2}
.info{background:var(--coral-muda);border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 5px 0 var(--coral)}
.info .baris .ib{background:#fff}
.bar-c{background:var(--coral);border-radius:22px;padding:10px 10px 10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 var(--bata)}
.scanner{position:relative;width:250px;height:250px;margin:0 auto;display:grid;place-items:center;flex:none}
.scanner .sudut{position:absolute;width:44px;height:44px;border:6px solid var(--coral)}
.sudut.a{left:0;top:0;border-right:0;border-bottom:0;border-radius:22px 0 0 0}.sudut.b{right:0;top:0;border-left:0;border-bottom:0;border-radius:0 22px 0 0}.sudut.c{left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 22px}.sudut.d{right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 22px 0}
.qr{display:grid;grid-template-columns:repeat(9,1fr);width:150px;height:150px;gap:2px}.qr i{background:var(--garis2);border-radius:2px}.qr i.on{background:var(--tinta)}
.gs{position:absolute;left:12px;right:12px;height:5px;border-radius:9px;background:var(--coral);animation:scan 2.4s ease-in-out infinite alternate}
.lencana-b{width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.35);display:grid;place-items:center;margin:0 auto}
.lencana-b>div{width:150px;height:150px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--bata)}
.pill-g{position:fixed;top:16px;left:16px;z-index:9;background:var(--tinta);color:var(--kertas);border-radius:100px;padding:11px 16px;font:700 13px var(--jak);display:flex;gap:6px;align-items:center}
#galeri{position:fixed;inset:0;z-index:100;background:var(--krem);overflow:auto;padding:20px 20px 40px}
#galeri .g-top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1300px;margin:0 auto 20px;font:900 24px var(--fig)}
#galeri .g-grid{display:flex;flex-wrap:wrap;gap:24px 22px;justify-content:center;max-width:1300px;margin:0 auto}
#galeri figure{width:234px}
#galeri .g-fr{width:234px;height:506px;overflow:hidden;position:relative}
#galeri iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform:scale(.6);transform-origin:0 0;background:transparent}
#galeri figcaption{font:700 13px var(--jak);color:var(--teks2);margin-top:8px;text-align:center}
html.gal,html.gal body{background:transparent}
.gal .panggung{padding:0;min-height:0;display:block}
.gal .ponsel{width:390px;max-width:none;height:844px;border:9px solid var(--tinta);border-radius:52px;box-shadow:none}

<span class="eyebrow">${T('Kata yang perlu diperbaiki','Words to improve')}</span><div class="baris g8" style="flex-wrap:wrap">${ws.map(w=>{const f=w.toLowerCase().replace(/[^a-z']/g,'')===s[2].toLowerCase();return f?`<span class="cip" style="background:var(--kuning);color:var(--ink-kuning);border:2px solid var(--tinta)">${w.replace(/[!?.,]/g,'')} <span style="font-weight:600">${s[3]}</span></span>`:`<span class="cip" style="background:var(--lime);color:var(--ink-mint)">${w.replace(/[!?.,]/g,'')} ✓</span>`}).join('')}</div>
<div class="kol g14 mt-auto" style="align-items:center"><span class="mini">${T('Tekan dan tahan untuk merekam','Press and hold to record')}</span><button class="bulat besar mik" id="mik" aria-label="${T('Rekam','Record')}">${ik('mic').replace('class="ik"','class="ik" style="font-size:38px"')}</button><div class="baris g10"><button class="btn putih" data-do="pelan">${ik('slow_motion_video')}${T('Pelan','Slow')}</button><button class="btn putih" data-do="lewati">${ik('skip_next')}${T('Lewati','Skip')}</button></div></div>`};
RENDER['s-papan']=()=>{const pr=peringkat(),mu=perPapan?4:1,ip=pr.findIndex(x=>x.saya),col=['lavender','langit','mint'],ink=['ink-lav','ink-langit','ink-mint'];
$('#s-papan').innerHTML=`<div class="baris g12"><h2 class="judul-skrin f1">${T('Papan Peringkat','Leaderboard')}</h2><button class="cip" style="background:var(--putih);border:1.5px solid var(--garis)" data-do="periode">${perPapan?T('Bulanan','Monthly'):T('Mingguan','Weekly')}${ik('expand_more')}</button></div>
<div class="kartu baris g12" style="background:var(--kuning);color:var(--ink-kuning);border:0">${ik('emoji_events').replace('class="ik"','class="ik" style="font-size:36px"')}<span class="kol g6"><b style="font:800 18px var(--fig)">${T('Kelas 5 Melati','Class 5 Melati')}</b><span style="font:500 14px var(--jak)">${T('3 hari lagi sebelum minggu berakhir','3 days left before the week ends')}</span></span></div>
${pr.map((r,i)=>{const top=i<3;return `<div class="rank" style="${top?`background:var(--${col[i]});color:var(--${ink[i]});border-color:transparent`:''}${r.saya?';border:2.5px solid var(--tinta)':''}"><b class="n">${i+1}</b>${r.saya?mh({w:38}):`<span style="width:38px;height:38px;border-radius:50%;background:var(--abu);display:grid;place-items:center;font:800 14px var(--fig);color:var(--teks2);flex:none">${r.n[0]}</span>`}<span class="f1 kol"><b style="font:700 15px var(--jak)">${r.saya?T('Kamu','You'):r.n}</b>${r.saya?`<span style="font:600 12px var(--jak)">${i===0?T('Kamu di puncak!','You are on top!'):T(`${fmt(pr[i-1].xp-r.xp+1)} XP lagi untuk naik`,`${fmt(pr[i-1].xp-r.xp+1)} XP to move up`)}</span>`:''}</span><b style="font:800 16px var(--fig)">${fmt(r.xp*mu)}</b></div>`}).join('')}
<button class="kartu baris g12 mt-auto" style="background:var(--tinta);color:var(--kertas);border:0" data-do="ajak">${ik('group_add')}<span class="f1 kol g6"><b style="font:800 17px var(--fig)">${T('Ajak teman sekelas','Invite classmates')}</b><span style="font:500 13px var(--jak);color:var(--abu-teks2)">${T('Bagikan kode kelas 5MLT-26','Share class code 5MLT-26')}</span></span></button>`};
RENDER['s-kemajuan']=()=>{const hm=S.hariMenit,mx=Math.max(...hm),sum=perKm===0?S.menit:perKm===1?S.menit*4:S.menit*48,hi=hariIdx(),D=['Sen','Sel','Rab','Kam','Jum','Sab','Min'],DE=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],per=[[T('Minggu','Week'),T('minggu ini','this week')],[T('Bulan','Month'),T('bulan ini','this month')],[T('Tahun','Year'),T('tahun ini','this year')]],ak=S.jawab?Math.round(S.benar/S.jawab*100):88;
$('#s-kemajuan').innerHTML=`<div class="baris g12"><h2 class="judul-skrin f1">${T('Kemajuanku','My Progress')}</h2><button class="ikon-btn" data-go="s-papan" aria-label="${T('Papan peringkat','Leaderboard')}">${ik('emoji_events')}</button></div>
<div class="baris g8">${per.map((p,i)=>`<button class="cip" style="${perKm===i?'background:var(--tinta);color:var(--kertas)':'background:var(--putih);border:1.5px solid var(--garis)'}" data-do="perKm" data-arg="${i}">${p[0]}</button>`).join('')}</div>
<div class="kartu kol g12" style="background:var(--lavender);color:var(--ink-lav);border:0"><span class="mini" style="color:inherit">${T('Menit belajar '+per[perKm][1],'Study minutes '+per[perKm][1])}</span><div class="baris g10"><b style="font:900 36px var(--fig)">${sum} ${T('mnt','min')}</b><span class="cip" style="background:var(--lime);color:var(--ink-mint);min-height:28px;padding:4px 12px;font-size:13px">+22%</span></div><div class="grafik">${hm.map((v,i)=>`<div class="${i===hi?'hi':''}"><i style="height:${Math.max(8,v/mx*100)}%"></i>${T(D[i],DE[i])}</div>`).join('')}</div></div>
<div class="grid3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">${[[S.kata,T('Kata dipelajari','Words learned')],[ak+'%',T('Ketepatan kuis','Quiz accuracy')],[S.beruntun,T('Hari berturut','Day streak')]].map(x=>`<div class="kartu kol g6" style="padding:14px"><b style="font:900 24px var(--fig)">${x[0]}</b><span class="mini">${x[1]}</span></div>`).join('')}</div>
<div class="kartu kol g12"><b style="font:800 17px var(--fig)">${T('Kemahiran','Skills')}</b>${[[T('Kosa kata','Vocabulary'),82,'lavender'],[T('Ucapan','Speaking'),64,'langit'],[T('Tata bahasa','Grammar'),71,'pink']].map(x=>`<div class="kol g6"><div class="baris" style="justify-content:space-between;font:700 14px var(--jak)"><span>${x[0]}</span><span>${x[1]}%</span></div><div class="bar tebal"><i style="width:${x[1]}%;background:var(--${x[2]});border:2px solid var(--tinta)"></i></div></div>`).join('')}</div>
<div class="kartu baris g12" style="background:var(--coral);color:var(--ink-coral);border:0">${ik('target')}<span class="f1 kol g6"><b style="font:800 17px var(--fig)">${T('Fokus tata bahasa minggu depan','Grammar focus next week')}</b><span style="font:500 14px var(--jak)">${T('12 kesalahan berulang','12 repeated mistakes')}</span></span></div>`};
/* navigasi */
const TAB={'s-home':'s-home','s-kata':'s-kata','s-pelajaran':'s-pelajaran','s-jalur':'s-pelajaran','s-profil':'s-profil','s-kemajuan':'s-profil','s-papan':'s-profil'};
const ID_LAYAR=[['s-splash','Splash'],['s-onboarding','Onboarding'],['s-daftar','Daftar'],['s-masuk','Masuk'],['s-pin','Buat PIN'],['s-berhasil','Berhasil'],['s-home','Beranda'],['s-kata','Kata Saya'],['s-pelajaran','Pelajaran'],['s-jalur','Jalur Belajar'],['s-jadwal','Jadwal'],['s-profil','Profil'],['s-scan','Gabung Kelas'],['s-selesai','Pelajaran Selesai'],['s-card','Kartu Kosakata'],['s-quiz','Kuis'],['s-betul','Jawaban Benar'],['s-salah','Jawaban Salah'],['s-sebut','Latihan Ucapan'],['s-papan','Papan Peringkat'],['s-kemajuan','Kemajuanku']];
function pergi(id){if(id==='s-jalur'&&cur!=='s-jalur')lihat=null;if(id==='s-pin')pinBuf='';$$('.screen').forEach(s=>s.classList.remove('active'));const e=$('#'+id);e.classList.add('active');e.scrollTop=0;const c=e.dataset.st||e.dataset.bg;$('#ponsel').style.background=c?'var(--'+c+')':'';$('#tab').classList.toggle('hidden',!TAB[id]);$$('#tab button[data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===TAB[id]));cur=id;RENDER[id]&&RENDER[id]();document.documentElement.lang=S.bahasa==='EN'?'en':'id'}
const ulang=()=>RENDER[cur]&&RENDER[cur]();
const baru=o=>ses=Object.assign({les:langkahBerjalan(),kartu:0,soal:0,nyawa:3,betul:0,pilih:-1,solo:false,sx:0},o||{});
function mulai(id){const l=LANGKAH.find(x=>x.id===id);if(terkunci(l)){toast(T('Selesaikan pelajaran sebelumnya dulu ya','Finish the previous lesson first'));return}baru({les:l});pergi('s-card')}
function selesaiPelajaran(){const l=ses.les;S.selesai[l.id]=true;S.menit+=8;S.hariMenit[hariIdx()]+=8;S.xp+=20;S.xpMinggu+=20;simpan();ses.hasil={xp:20+ses.sx,judul:l.en};konfeti();pergi('s-selesai')}
function mulaiRek(){if(rek)return;const g=$('#gel');if(!g)return;g.classList.add('rek');$('#mik').classList.add('rekam');rek={t:Date.now(),iv:setInterval(()=>[...g.children].forEach(b=>{const h=15+Math.random()*70;b.style.height=h+'%';b.classList.toggle('kuat',h>78)}),120),to:setTimeout(hentiRek,5000)}}
function hentiRek(){if(!rek)return;clearInterval(rek.iv);clearTimeout(rek.to);const d=Date.now()-rek.t;rek=null;const g=$('#gel');if(g){g.classList.remove('rek');[...g.children].forEach((b,i)=>{b.style.height=POLA[i]+'%';b.classList.remove('kuat')})}const m=$('#mik');m&&m.classList.remove('rekam');if(d<400){toast(T('Tahan sedikit lebih lama ya','Hold a little longer'));return}
const sk=78+Math.floor(Math.random()*21);S.xp+=10;S.xpMinggu+=10;ses.sx+=10;simpan();toast(T(`Ucapanmu ${sk}%! +10 XP`,`Your speaking: ${sk}%! +10 XP`));setTimeout(()=>ses.solo?pergi('s-home'):selesaiPelajaran(),800)}
function galeri(){if($('#galeri'))return;const o=document.createElement('div');o.id='galeri';o.innerHTML=`<div class="g-top"><span>Cakap — ${ID_LAYAR.length} ${T('layar','screens')}</span><button class="btn kecil" data-do="tutupGaleri">${T('Tutup','Close')}</button></div><div class="g-grid"></div>`;const g=o.querySelector('.g-grid');
ID_LAYAR.forEach((x,i)=>{const f=document.createElement('figure');if(i%2)f.style.marginTop='34px';f.innerHTML=`<div class="g-fr"><iframe title="${x[1]}" loading="lazy"></iframe></div><figcaption>${String(i+1).padStart(2,'0')} · ${x[1]}</figcaption>`;f.querySelector('iframe').srcdoc='<!DOCTYPE html>'+SRC.replace('</head>','<script>window.LAYAR="'+x[0]+'"<\/script></head>');g.appendChild(f)});document.body.appendChild(o)}
const AKSI={
bahasa:a=>{S.bahasa=a;simpan();document.documentElement.lang=a==='EN'?'en':'id';ulang()},
suis:a=>{S.suis[a]=!S.suis[a];simpan();ulang()},
toast:a=>toast(a),
mulaiApp:()=>pergi(S.sudah?'s-home':'s-onboarding'),
kelas:a=>{kelasPil=+a;$$('#kls .kls').forEach(b=>b.classList.toggle('on',b.dataset.arg===a))},
daftar:()=>{const n=($('#in-nama').value||'').trim();if(!n){toast(T('Tulis nama panggilanmu dulu ya','Please type your nickname'));$('#in-nama').focus();return}S.nama=n.slice(0,24);S.kelas=kelasPil;S.level=kelasPil<=2?'A1':kelasPil<=4?'A2':'B1';simpan();pergi('s-pin')},
masukApp:()=>{const n=($('#in-nama2').value||'').trim(),p=$('#in-pin').value;if(!n){toast(T('Tulis nama panggilanmu dulu ya','Please type your nickname'));return}if(p.length<4){toast(T('PIN terdiri dari 4 angka','PIN has 4 digits'));return}S.nama=n.slice(0,24);S.suis.ingat=$('#in-ingat').checked;S.sudah=true;simpan();toast(T('Selamat datang kembali!','Welcome back!'));pergi('s-home')},
tamu:()=>{S.sudah=true;simpan();pergi('s-home')},
tekan:a=>{if(a==='x')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=a;$$('#dots i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));if(pinBuf.length===4){setTimeout(()=>{if(cur==='s-pin'){konfeti();pergi('s-berhasil')}},300)}},
selesaiDaftar:()=>{S.sudah=true;simpan();pergi('s-home')},
cari:()=>{pelQ=($('#cari').value||'').trim();pelUnit=-1;pergi('s-pelajaran')},
hapusCari:()=>{pelQ='';ulang()},
menulis:()=>toast(T('Menulis akan hadir di pembaruan berikutnya','Writing is coming in the next update')),
unit:a=>{pelUnit=+a;ulang()},
pilihPel:a=>{pelPilih.has(a)?pelPilih.delete(a):pelPilih.add(a);ulang()},
mulaiPilih:()=>{const x=LANGKAH.find(y=>pelPilih.has(y.id)&&!terkunci(y));if(!x){toast(T('Pelajaran terpilih masih terkunci','Selected lessons are locked'));return}pelPilih.delete(x.id);mulai(x.id)},
step:a=>{const [i,d]=a.split('|'),k=langkahBerjalan().k[+i][0];tgt[k]=Math.max(1,Math.min(5,(tgt[k]||2)+ +d));ulang()},
ucapSemua:()=>ucap(langkahBerjalan().k.map(k=>k[0]).join('. ')),
gabung:()=>{const v=($('#kode').value||'').trim().toUpperCase();if(v==='5MLT-26'){S.sudah=true;simpan();konfeti();pergi('s-berhasil')}else toast(T('Kode kelas tidak ditemukan','Class code not found'))},
galeri:()=>galeri(),tutupGaleri:()=>{const g=$('#galeri');g&&g.remove()},
mulai:a=>mulai(a),
mulaiKosa:()=>mulai(langkahBerjalan().id),
mulaiUcap:()=>{baru({solo:true});pergi('s-sebut')},
mulaiTata:()=>{baru({solo:true});pergi('s-quiz')},
ganti:()=>{const cl=langkahBerjalan();lihat=((lihat==null?cl.u:lihat)+1)%KURIKULUM.length;ulang()},
ucap:a=>ucap(a),
pelan:()=>{if(!ses.les)ses.les=langkahBerjalan();ucap(ses.les.s[0],true)},
kartu:a=>{const l=ses.les;if(a==='1'){S.hafal[l.k[ses.kartu][0]]=true;S.kata=412+Object.keys(S.hafal).length;simpan()}ses.kartu++;if(ses.kartu>=l.k.length){ses.soal=0;ses.pilih=-1;pergi('s-quiz')}else ulang()},
pilih:a=>{ses.pilih=+a;ulang()},
periksa:()=>{const q=ses.les.q[ses.soal];S.jawab++;if(ses.pilih===q.a){S.benar++;ses.betul++;S.xp+=15;S.xpMinggu+=15;simpan();konfeti();pergi('s-betul')}else{ses.nyawa--;simpan();pergi('s-salah')}},
lanjut:()=>{ses.soal++;ses.pilih=-1;if(ses.soal>=ses.les.q.length){ses.soal=0;ses.solo?pergi('s-home'):pergi('s-sebut')}else pergi('s-quiz')},
bookmark:()=>{const q=ses.les.q[ses.soal];if(!S.simpan.includes(q.prompt))S.simpan.push(q.prompt);simpan();toast(T('Disimpan ke ulangan','Saved for review'))},
coba:()=>{if(ses.nyawa<=0){ses.nyawa=3;ses.soal=0;toast(T('Nyawa habis — ulang dari soal 1','Out of lives — back to question 1'))}ses.pilih=-1;pergi('s-quiz')},
simpanUlang:()=>{const q=ses.les.q[ses.soal];if(!S.simpan.includes(q.prompt))S.simpan.push(q.prompt);simpan();toast(T('Disimpan ke ulangan','Saved for review'));AKSI.coba()},
lewati:()=>{if(ses.solo||!ses.les)pergi('s-home');else selesaiPelajaran()},
periode:()=>{perPapan=perPapan?0:1;ulang()},
perKm:a=>{perKm=+a;ulang()},
ajak:()=>{try{navigator.clipboard.writeText('5MLT-26')}catch(e){}toast(T('Kode kelas 5MLT-26 disalin','Class code 5MLT-26 copied'))},
nama:()=>{const n=prompt(T('Nama kamu:','Your name:'),S.nama);if(n&&n.trim()){S.nama=n.trim().slice(0,24);simpan();ulang()}},
reset:()=>{if(confirm(T('Mulai ulang semua kemajuan?','Reset all progress?'))){S=JSON.parse(JSON.stringify(AWAL));simpan();baru();tgt={};pelPilih.clear();pelQ='';pelUnit=-1;pergi('s-splash')}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-do]');if(!el)return;if(el.dataset.go){const t=el.dataset.go;if($('#galeri')&&!LAYAR)AKSI.tutupGaleri();pergi(t)}else{const f=AKSI[el.dataset.do];f&&f(el.dataset.arg,el)}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#mik')){e.preventDefault();mulaiRek()}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,hentiRek));
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cari')AKSI.cari();if(e.key==='Escape')AKSI.tutupGaleri()});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.id==='mik'&&!rek){e.preventDefault();mulaiRek()}});
window.addEventListener('keyup',e=>{if(e.code==='Space'&&e.target.id==='mik')hentiRek()});
jam();setInterval(jam,20000);
try{speechSynthesis.getVoices()}catch(e){}
if(LAYAR){document.documentElement.classList.add('gal');const l=LANGKAH[0];baru({les:l});const D={'s-card':{kartu:1},'s-quiz':{pilih:1},'s-betul':{pilih:1},'s-salah':{pilih:0,nyawa:2},'s-selesai':{hasil:{xp:20,judul:l.en}}};Object.assign(ses,D[LAYAR]||{});pergi(LAYAR)}else pergi('s-splash');
</script>
