const RAD={bulat:k=>'50%',kotak:k=>26*k+'px',tetes:k=>`50% 50% ${26*k}px 50%`,tag:k=>`${22*k}px ${22*k}px ${22*k}px ${6*k}px`,daun:k=>`50% 50% 50% ${14*k}px`,kartu:k=>`${36*k}px ${36*k}px ${8*k}px ${36*k}px`,ekor:k=>`${30*k}px ${30*k}px ${30*k}px ${8*k}px`};
function maskot(n,o){const w=o.w||64,k=w/64,m=o.m||{};
n.className='mas';n.style.width=n.style.height=w+'px';n.style.background='var(--'+(o.bg||'mint')+')';n.style.borderRadius=RAD[o.bentuk||'bulat'](k);

const bw=m.bw||3*k,uw=m.uw||24*k,uh=m.uh||12*k,t='var(--tinta)';let mu;
switch(o.mulut||'senyum'){
case 'sedih':mu=`<i style="width:${uw}px;height:${uh}px;border:${bw}px solid ${t};border-bottom:0;border-radius:${uw}px ${uw}px 0 0"></i>`;break;
case 'garis':mu=`<i style="width:${uw}px;height:${bw*1.3}px;background:${t};border-radius:99px"></i>`;break;
case 'bulat':mu=`<i style="width:${uh*1.1}px;height:${uh*1.1}px;border:${bw}px solid ${t};border-radius:50%"></i>`;break;
default:mu=`<i style="width:${uw}px;height:${uh}px;border:${bw}px solid ${t};border-top:0;border-radius:0 0 ${uw}px ${uw}px;background:${m.fill||'none'}"></i>`}
n.innerHTML=`<div class="muka" style="gap:${m.mg||8*k}px"><div class="mata" style="gap:${m.gap||12*k}px">${ey}${ey}</div>${mu}</div>`+(o.lencana?`<span class="lenc" style="width:${w*.3}px;height:${w*.3}px">${ik('check').replace('class="ik"','class="ik" style="font-size:'+w*.18+'px"')}</span>`:'');

$('#s-kemajuan').innerHTML=`<div class="baris g12"><h2 class="judul-skrin f1">${T('Kemajuanku','My Progress')}</h2><button class="ikon-btn" data-go="s-papan" aria-label="${T('Papan peringkat','Leaderboard')}">${ik('emoji_events')}</button></div>
<div class="baris g8">${per.map((p,i)=>`<button class="cip" style="${perKm===i?'background:var(--tinta);color:var(--kertas)':'background:var(--putih);border:1.5px solid var(--garis)'}" data-do="perKm" data-arg="${i}">${p[0]}</button>`).join('')}</div>
<div class="kartu kol g12" style="background:var(--lavender);color:var(--ink-lav);border:0"><span class="mini" style="color:inherit">${T('Menit belajar '+per[perKm][1],'Study minutes '+per[perKm][1])}</span><div class="baris g10"><b style="font:900 36px var(--fig)">${sum} ${T('mnt','min')}</b><span class="cip" style="background:var(--lime);color:var(--ink-mint);min-height:28px;padding:4px 12px;font-size:13px">+22%</span></div><div class="grafik">${hm.map((v,i)=>`<div class="${i===hi?'hi':''}"><i style="height:${Math.max(8,v/mx*100)}%"></i>${T(D[i],DE[i])}</div>`).join('')}</div></div>
<div class="grid3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">${[[S.kata,T('Kata dipelajari','Words learned')],[ak+'%',T('Ketepatan kuis','Quiz accuracy')],[S.beruntun,T('Hari berturut','Day streak')]].map(x=>`<div class="kartu kol g6" style="padding:14px"><b style="font:900 24px var(--fig)">${x[0]}</b><span class="mini">${x[1]}</span></div>`).join('')}</div>
<div class="kartu kol g12"><b style="font:800 17px var(--fig)">${T('Kemahiran','Skills')}</b>${[[T('Kosa kata','Vocabulary'),82,'lavender'],[T('Ucapan','Speaking'),64,'langit'],[T('Tata bahasa','Grammar'),71,'pink']].map(x=>`<div class="kol g6"><div class="baris" style="justify-content:space-between;font:700 14px var(--jak)"><span>${x[0]}</span><span>${x[1]}%</span></div><div class="bar tebal"><i style="width:${x[1]}%;background:var(--${x[2]});border:2px solid var(--tinta)"></i></div></div>`).join('')}</div>
<div class="kartu baris g12" style="background:var(--coral);color:var(--ink-coral);border:0">${ik('target')}<span class="f1 kol g6"><b style="font:800 17px var(--fig)">${T('Fokus tata bahasa minggu depan','Grammar focus next week')}</b><span style="font:500 14px var(--jak)">${T('12 kesalahan berulang','12 repeated mistakes')}</span></span></div>`};
RENDER['s-profil']=()=>{
$('#s-profil').innerHTML=`<div class="baris g12"><h2 class="judul-skrin f1">${T('Profil','Profile')}</h2><button class="ikon-btn" data-do="nama" aria-label="${T('Ubah nama','Edit name')}">${ik('edit')}</button></div>
<div class="kartu kol g10" style="background:var(--mint);color:var(--ink-mint);border:0;align-items:flex-start">${mh({w:74,bg:'putih'})}<b style="font:900 26px var(--fig);color:var(--tinta)">${S.nama}</b><span style="font:600 14px var(--jak)">SDN 03 Menteng · 5 Melati</span><div class="baris g8"><span class="cip" style="background:var(--tinta);color:var(--mint);min-height:32px;padding:6px 14px;font-size:13px">${T('Tingkat','Level')} ${S.level}</span><span class="cip" style="background:var(--putih);color:var(--tinta);min-height:32px;padding:6px 14px;font-size:13px">${fmt(S.xp)} XP</span></div></div>
<div class="kartu kol g14" style="padding:6px 18px"><div class="baris g12" style="padding:12px 0;justify-content:space-between"><b style="font:700 15px var(--jak)">${T('Bahasa antarmuka','Interface language')}</b>${SEG()}</div><div class="baris g12" style="padding:12px 0;border-top:1.5px solid var(--garis2)"><span class="f1 kol g6"><b style="font:700 15px var(--jak)">${T('Pengingat harian','Daily reminder')}</b><span class="mini">${T('Setiap hari, pukul 19.00','Every day at 7 PM')}</span></span>${SUIS('ingat')}</div><div class="baris g12" style="padding:12px 0;border-top:1.5px solid var(--garis2)"><span class="f1 kol g6"><b style="font:700 15px var(--jak)">${T('Pelajaran luring','Offline lessons')}</b><span class="mini">${T('Bisa dipakai tanpa kuota','Works without data')}</span></span>${SUIS('luring')}</div><div class="baris g12" style="padding:12px 0;border-top:1.5px solid var(--garis2);justify-content:space-between"><b style="font:700 15px var(--jak)">${T('Kode kelas guru','Teacher class code')}</b><b style="font:800 15px var(--fig)">5MLT-26</b></div></div>
<button class="kartu baris g12" style="background:var(--tinta);color:var(--kertas);border:0" data-do="toast" data-arg="${T('Cakap Premium segera hadir','Cakap Premium is coming soon')}">${ik('workspace_premium')}<span class="f1 kol g6"><b style="font:800 17px var(--fig)">Cakap Premium</b><span style="font:500 13px var(--jak);color:var(--abu-teks2)">${T('Kelas ucapan tanpa batas','Unlimited speaking classes')}</span></span></button>
<button class="btn garis lebar" data-do="reset">${T('Mulai ulang kemajuan','Reset progress')}</button>`};

/* navigasi */
const TAB={'s-home':'s-home','s-path':'s-path','s-kemajuan':'s-kemajuan','s-profil':'s-profil','s-papan':'s-kemajuan'};
function pergi(id){if(id==='s-path'&&cur!=='s-path')lihat=null;$$('.screen').forEach(s=>s.classList.remove('active'));const e=$('#'+id);e.classList.add('active');e.scrollTop=0;$('#ponsel').style.background=e.dataset.bg?'var(--'+e.dataset.bg+')':'';$('#tab').classList.toggle('hidden',!TAB[id]);$$('#tab button').forEach(b=>b.classList.toggle('on',b.dataset.go===TAB[id]));cur=id;RENDER[id]&&RENDER[id]();document.documentElement.lang=S.bahasa==='EN'?'en':'id'}
const ulang=()=>RENDER[cur]&&RENDER[cur]();
function mulai(id){const l=LANGKAH.find(x=>x.id===id);ses={les:l,kartu:0,soal:0,nyawa:3,betul:0,pilih:-1,solo:false,sx:0};pergi('s-card')}
function selesaiPelajaran(){const l=ses.les;S.selesai[l.id]=true;S.menit+=8;S.hariMenit[hariIdx()]+=8;S.xp+=20;S.xpMinggu+=20;simpan();konfeti();toast(T(`Pelajaran “${l.idn}” selesai! +${20+ses.sx} XP`,`Lesson “${l.en}” complete! +${20+ses.sx} XP`));setTimeout(()=>pergi('s-path'),900)}
function mulaiRek(){if(rek)return;const g=$('#gel');if(!g)return;g.classList.add('rek');$('#mik').classList.add('rekam');rek={t:Date.now(),iv:setInterval(()=>[...g.children].forEach(b=>{const h=15+Math.random()*70;b.style.height=h+'%';b.classList.toggle('kuat',h>78)}),120),to:setTimeout(hentiRek,5000)}}
function hentiRek(){if(!rek)return;clearInterval(rek.iv);clearTimeout(rek.to);const d=Date.now()-rek.t;rek=null;const g=$('#gel');if(g){g.classList.remove('rek');[...g.children].forEach((b,i)=>{b.style.height=POLA[i]+'%';b.classList.remove('kuat')})}const m=$('#mik');m&&m.classList.remove('rekam');if(d<400){toast(T('Tahan sedikit lebih lama ya','Hold a little longer'));return}
const sk=78+Math.floor(Math.random()*21);S.xp+=10;S.xpMinggu+=10;ses.sx+=10;simpan();toast(T(`Ucapanmu ${sk}%! +10 XP`,`Your speaking: ${sk}%! +10 XP`));setTimeout(()=>ses.solo?pergi('s-home'):selesaiPelajaran(),800)}
const AKSI={
level:a=>{S.level=a;simpan();ulang()},
bahasa:a=>{S.bahasa=a;simpan();document.documentElement.lang=a==='EN'?'en':'id';ulang()},
suis:a=>{S.suis[a]=!S.suis[a];simpan();ulang()},
toast:a=>toast(a),
mulai:a=>mulai(a),
mulaiKosa:()=>mulai(langkahBerjalan().id),
mulaiUcap:()=>{ses={les:langkahBerjalan(),kartu:0,soal:0,nyawa:3,betul:0,pilih:-1,solo:true,sx:0};pergi('s-sebut')},
mulaiTata:()=>{ses={les:langkahBerjalan(),kartu:0,soal:0,nyawa:3,betul:0,pilih:-1,solo:true,sx:0};pergi('s-quiz')},
ganti:()=>{const cl=langkahBerjalan();lihat=((lihat==null?cl.u:lihat)+1)%KURIKULUM.length;ulang()},
ucap:a=>ucap(a),
pelan:()=>{if(!ses.les)ses.les=langkahBerjalan();ucap(ses.les.s[0],true)},
kartu:a=>{const l=ses.les;if(a==='1'){S.hafal[l.k[ses.kartu][0]]=true;S.kata=412+Object.keys(S.hafal).length;simpan()}ses.kartu++;if(ses.kartu>=l.k.length){ses.soal=0;ses.pilih=-1;pergi('s-quiz')}else ulang()},
pilih:a=>{ses.pilih=+a;ulang()},
periksa:()=>{const q=ses.les.q[ses.soal];S.jawab++;if(ses.pilih===q.a){S.benar++;ses.betul++;S.xp+=15;S.xpMinggu+=15;simpan();konfeti();pergi('s-betul')}else{ses.nyawa--;simpan();pergi('s-salah')}},
lanjut:()=>{ses.soal++;ses.pilih=-1;if(ses.soal>=ses.les.q.length){ses.soal=0;ses.solo&&ses.les?pergi('s-home'):pergi('s-sebut')}else pergi('s-quiz')},
bookmark:()=>{const q=ses.les.q[ses.soal];if(!S.simpan.includes(q.prompt))S.simpan.push(q.prompt);simpan();toast(T('Disimpan ke ulangan','Saved for review'))},
coba:()=>{if(ses.nyawa<=0){ses.nyawa=3;ses.soal=0;toast(T('Nyawa habis — ulang dari soal 1','Out of lives — back to question 1'))}ses.pilih=-1;pergi('s-quiz')},
simpanUlang:()=>{const q=ses.les.q[ses.soal];if(!S.simpan.includes(q.prompt))S.simpan.push(q.prompt);simpan();toast(T('Disimpan ke ulangan','Saved for review'));AKSI.coba()},
lewati:()=>{if(ses.solo||!ses.les)pergi('s-home');else selesaiPelajaran()},
periode:()=>{perPapan=perPapan?0:1;ulang()},
perKm:a=>{perKm=+a;ulang()},
ajak:()=>{try{navigator.clipboard.writeText('5MLT-26')}catch(e){}toast(T('Kode kelas 5MLT-26 disalin','Class code 5MLT-26 copied'))},
nama:()=>{const n=prompt(T('Nama kamu:','Your name:'),S.nama);if(n&&n.trim()){S.nama=n.trim().slice(0,30);simpan();ulang()}},
reset:()=>{if(confirm(T('Mulai ulang semua kemajuan?','Reset all progress?'))){S=JSON.parse(JSON.stringify(AWAL));simpan();ses={les:null,kartu:0,soal:0,nyawa:3,betul:0,pilih:-1,solo:false,sx:0};pergi('s-onboarding')}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-do]');if(!el)return;if(el.dataset.go)pergi(el.dataset.go);else{const f=AKSI[el.dataset.do];f&&f(el.dataset.arg,el)}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#mik')){e.preventDefault();mulaiRek()}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,hentiRek));
document.addEventListener('pointerleave',e=>{if(e.target&&e.target.id==='mik')hentiRek()},true);
window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.id==='mik'&&!rek){e.preventDefault();mulaiRek()}});
window.addEventListener('keyup',e=>{if(e.code==='Space'&&e.target.id==='mik')hentiRek()});
jam();setInterval(jam,20000);
try{speechSynthesis.getVoices()}catch(e){}
pergi('s-onboarding');
</script>
</body>
</html>
