<div class="kt kr kol g8"><b style="font:800 12px 'Nunito';letter-spacing:.12em;text-transform:uppercase;color:#a1481a">${T('Catatan','Note')}</b><b style="font:400 22px 'Lilita One'">${q.note.title}</b><p class="isi1">${q.note.body}</p><div class="baris g6" style="flex-wrap:wrap">${q.note.chips.map(c=>`<span class="ch1" style="font-size:12px">${c}</span>`).join('')}</div></div>
<div class="baris g12"><div class="kt tengah kol f1" style="padding:12px"><span class="mn">${T('Hadiah','Reward')}</span><b class="big1" style="font-size:30px">+15 XP</b></div><div class="kt tengah kol f1" style="padding:12px;background:${CK};color:#fff"><span class="mn">${T('Ketepatan','Accuracy')}</span><b class="big1" style="font-size:30px;color:var(--kn)">${d.ak}%</b></div></div>
<div class="baris g10 mt-auto"><button class="tb hj f1" data-do="lanjut">${T('Lanjutkan','Continue')}</button><button class="rb" style="width:56px;height:56px" data-do="bookmark" aria-label="${T('Simpan','Save')}">${ik('bookmark')}</button></div>`};
V.render['s-salah']=e=>{const d=D.salah(),q=d.q;
e.innerHTML=`<div class="hd1">${rb('s-path','close',T('Tutup','Close'))}<span class="jd1">${T('Ups!','Oops!')}</span><span class="tb sm pt" style="margin:0;box-shadow:0 4px 0 ${CK};color:${CK}">${ik('favorite').replace('class="ik"','class="ik" style="color:#D4474A"')}${d.nyawa}</span></div>
<div class="kol tengah g6">${mk1(4,92,{bg:'#fff',mulut:'sedih'})}<h2 class="logo1" style="font-size:46px;color:#fff;text-shadow:0 6px 0 ${CK}">${T('Belum tepat','Not quite')}</h2></div>
<div class="kt kol g6"><b class="mn" style="opacity:.7">${T('Jawabanmu','Your answer')}</b><span style="font:800 18px 'Nunito';text-decoration:line-through;opacity:.6">${d.js}</span></div>
<div class="kt kol g6" style="background:#B8F0B8"><b class="mn" style="opacity:.7">${T('Jawaban benar','Correct answer')}</b><span style="font:800 18px 'Nunito'">${d.df}</span></div>
<div class="kt kr kol g6"><b style="font:400 20px 'Lilita One'">${ik('lightbulb').replace('class="ik"','class="ik" style="color:#FF8A3D;vertical-align:-5px"')} ${T('Kenapa?','Why?')}</b><p class="isi1">${q.note.body}</p></div>
<div class="kol g8 mt-auto"><button class="tb lebar" data-do="coba">${T('Coba Lagi','Try Again')}</button><button class="tb pt lebar" data-do="simpanUlang">${T('Simpan ke Ulangan','Save for Review')}</button></div>`};
V.render['s-sebut']=e=>{const d=D.sebut();
e.innerHTML=`${HD(BACK('s-path'),T('Latihan Ucapan','Speaking'),rb('','help',T('Bantuan','Help')).replace('data-go=""',`data-do="toast" data-arg="${T('Tekan dan tahan mikrofon','Press and hold the mic')}"`))}
<div class="kt kol g10"><b class="mn" style="opacity:.7">${T('Ucapkan setelah saya','Repeat after me')}</b><b style="font:400 32px/1.1 'Lilita One'">${d.s[0]}</b><span class="isi1" style="color:#a1481a">${d.s[1]}</span>${wave()}</div>
<b class="jd1" style="font-size:18px;text-align:left;-webkit-text-stroke:5px ${CK}">${T('Kata yang perlu diperbaiki','Words to improve')}</b>
<div class="baris g8" style="flex-wrap:wrap">${d.ws.map(w=>w.f?`<span class="ch1 on" style="border-radius:999px">${w.w} ${d.s[3]}</span>`:`<span class="ch1" style="border-radius:999px;background:#B8F0B8">${w.w} ✓</span>`).join('')}</div>
<div class="kol tengah g12 mt-auto"><button class="mik" id="mik" aria-label="${T('Rekam','Record')}">${ik('mic').replace('class="ik"','class="ik" style="font-size:48px"')}</button><span class="mn" style="color:#fff">${T('Tekan dan tahan untuk merekam','Press and hold to record')}</span><div class="baris g10"><button class="tb pt sm" data-do="pelan">${ik('slow_motion_video')}${T('Pelan','Slow')}</button><button class="tb pt sm" data-do="lewati">${ik('skip_next')}${T('Lewati','Skip')}</button></div></div>`};
V.render['s-papan']=e=>{const d=D.papan(),M=['🥇','🥈','🥉'];
e.innerHTML=`${HD(BACK('s-profil'),T('Peringkat','Ranking'),`<button class="rb" data-do="periode" aria-label="${d.per}">${ik('swap_vert')}</button>`)}
<div class="kt kn baris g12">${ik('emoji_events').replace('class="ik"','class="ik" style="font-size:40px"')}<div class="kol"><b style="font:400 22px 'Lilita One'">${T('Kelas 5 Melati','Class 5 Melati')} · ${d.per}</b><span class="isi1">${T('3 hari lagi sebelum minggu berakhir','3 days left this week')}</span></div></div>
${d.pr.map(r=>`<div class="rank1${r.saya?' me':''}"><b style="font:400 24px 'Lilita One';width:34px;text-align:center">${r.i<3?M[r.i]:r.i+1}</b>${mk1(r.i+2,42)}<span class="f1 kol"><b>${r.n}</b>${r.saya&&r.naik?`<span class="mn" style="opacity:.7">${r.naik} XP ${T('lagi untuk naik','to move up')}</span>`:''}</span><b style="font:400 20px 'Lilita One'">${fmt(r.xp)}</b></div>`).join('')}
<button class="tb hj lebar mt-auto" data-do="ajak">${ik('group_add')}${T('Ajak Teman','Invite Friends')}</button>`};
V.render['s-kemajuan']=e=>{const d=D.km();
e.innerHTML=`${HD('<span class="rb ghost"></span>',T('Kemajuanku','My Progress'),rb('s-papan','emoji_events',T('Peringkat','Ranking')))}
<div class="baris g8">${d.pn.map((p,i)=>`<button class="ch1${d.pk===i?' on':''}" style="border-radius:999px;flex:1" data-do="perKm" data-arg="${i}">${p[0]}</button>`).join('')}</div>
<div class="kt kol g10"><span class="mn" style="opacity:.7">${T('Menit belajar','Study minutes')} ${d.pn[d.pk][1]}</span><div class="baris g10"><b class="big1">${d.sum} ${T('mnt','min')}</b><span class="tb sm hj" style="margin:0;box-shadow:0 3px 0 ${CK};min-height:32px;padding:2px 12px">+22%</span></div><div class="gf">${d.hm.map((v,i)=>`<div class="${i===d.hi?'hi':''}"><i style="height:${Math.max(8,v/d.mx*100)}%"></i>${d.hari[i]}</div>`).join('')}</div></div>
<div class="baris g10">${[[d.kata,T('Kata','Words')],[d.ak+'%',T('Ketepatan','Accuracy')],[d.str,T('Hari','Days')]].map(x=>`<div class="kt kol tengah f1" style="padding:10px 6px"><b class="big1" style="font-size:26px">${x[0]}</b><span class="mn">${x[1]}</span></div>`).join('')}</div>
<div class="kt kol g10">${d.skill.map(s=>`<div class="kol g6"><div class="rw"><b>${s[0]}</b><b>${s[1]}%</b></div><div class="bar1"><i style="width:${s[1]}%"></i></div></div>`).join('')}</div>`};
V.render['s-profil']=e=>{const d=D.profil();
e.innerHTML=`${HD('<span class="rb ghost"></span>',T('Profilku','My Profile'),`<button class="rb" data-do="nama" aria-label="${T('Ubah nama','Edit name')}">${ik('edit')}</button>`)}
<div class="kt kr kol tengah g8" style="padding-top:20px"><div class="apung">${mk1(0,100,{bentuk:'kotak'})}</div><b class="jd2">${d.nama}</b><span class="isi1">SDN 03 Menteng · 5 Melati</span><div class="baris g8"><span class="tb sm hj" style="margin:0;box-shadow:0 3px 0 ${CK};min-height:34px;padding:2px 14px">${T('Tingkat','Level')} ${d.level}</span><span class="tb sm" style="margin:0;box-shadow:0 3px 0 ${CK};min-height:34px;padding:2px 14px">${d.xp} XP</span></div></div>
<div class="kt kol g12"><div class="rw"><b>${T('Bahasa antarmuka','Interface language')}</b>${SEG()}</div><div class="rw"><span class="kol"><b>${T('Pengingat harian','Daily reminder')}</b><span class="mn" style="opacity:.7">${T('Setiap hari, pukul 19.00','Every day at 7 PM')}</span></span>${SUIS('ingat')}</div><div class="rw"><span class="kol"><b>${T('Pelajaran luring','Offline lessons')}</b><span class="mn" style="opacity:.7">${T('Bisa dipakai tanpa kuota','Works without data')}</span></span>${SUIS('luring')}</div><div class="rw"><b>${T('Kode kelas guru','Teacher code')}</b><b>${d.kode}</b></div></div>
<button class="tb pt lebar" data-go="s-papan">${ik('emoji_events')}${T('Peringkat Kelas','Class Ranking')}</button><button class="tb pt lebar" style="color:#D4474A" data-do="reset">${T('Mulai Ulang Kemajuan','Reset Progress')}</button>`};

boot();
</script>
</body>
</html>
