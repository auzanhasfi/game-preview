function hentiRek(){if(!rek)return;clearInterval(rek.iv);clearTimeout(rek.to);const d=Date.now()-rek.t;rek=null;const g=$('#gel');if(g){g.classList.remove('rek');[...g.children].forEach((b,i)=>{b.style.height=POLA[i]+'%';b.classList.remove('kuat')})}const m=$('#mik');m&&m.classList.remove('rekam');if(d<400){toast(T('Tahan sedikit lebih lama ya','Hold a little longer'));return}
const sk=78+Math.floor(Math.random()*21);S.xp+=10;S.xpMinggu+=10;ses.sx+=10;simpan();toast(T(`Ucapanmu ${sk}%! +10 XP`,`Your speaking: ${sk}%! +10 XP`));setTimeout(()=>ses.solo?pergi('s-home'):selesaiPelajaran(),800)}

kartu:a=>{const l=ses.les;if(a==='1'){S.hafal[l.k[ses.kartu][0]]=true;S.kata=412+Object.keys(S.hafal).length;simpan()}ses.kartu++;if(ses.kartu>=l.k.length){ses.soal=0;ses.pilih=-1;pergi('s-quiz')}else ulang()},
pilih:a=>{ses.pilih=+a;ulang()},
periksa:()=>{const q=ses.les.q[ses.soal];S.jawab++;if(ses.pilih===q.a){S.benar++;ses.betul++;S.xp+=15;S.xpMinggu+=15;simpan();konfeti();pergi('s-betul')}else{ses.nyawa--;simpan();pergi('s-salah')}},
lanjut:()=>{ses.soal++;ses.pilih=-1;if(ses.soal>=ses.les.q.length){ses.soal=0;ses.solo?pergi('s-home'):pergi('s-sebut')}else pergi('s-quiz')},
bookmark:()=>{const q=ses.les.q[ses.soal];if(!S.simpan.includes(q.prompt))S.simpan.push(q.prompt);simpan();toast(T('Disimpan ke ulangan','Saved for review'))},
coba:()=>{if(ses.nyawa<=0){ses.nyawa=3;ses.soal=0;toast(T('Nyawa habis — ulang dari soal 1','Out of lives — back to question 1'))}ses.pilih=-1;pergi('s-quiz')},
simpanUlang:()=>{AKSI.bookmark();AKSI.coba()},
lewati:()=>{if(ses.solo||!ses.les)pergi('s-home');else selesaiPelajaran()},
periode:()=>{perPapan=perPapan?0:1;ulang()},
perKm:a=>{perKm=+a;ulang()},
ajak:()=>{try{navigator.clipboard.writeText('5MLT-26')}catch(e){}toast(T('Kode kelas 5MLT-26 disalin','Class code 5MLT-26 copied'))},
nama:()=>{const n=prompt(T('Nama kamu:','Your name:'),S.nama);if(n&&n.trim()){S.nama=n.trim().slice(0,24);simpan();ulang()}},
reset:()=>{if(confirm(T('Mulai ulang semua kemajuan?','Reset all progress?'))){S=JSON.parse(JSON.stringify(AWAL));simpan();baru();obi=0;pergi('s-onboarding')}}
};

<div class="kol g8"><div class="rw"><span class="mono">${T('PROGRES','PROGRESS')}</span><span class="mono">${Math.round(d.i/d.n*100)}%</span></div><div class="pb"><i style="width:${d.i/d.n*100}%"></i></div></div>
${q.opts.map((o,i)=>`<button class="row2${d.pilih===i?' on':''}" data-do="pilih" data-arg="${i}"><span class="sq" style="background:${C2[i]};color:${CI[i]}">${'ABCD'[i]}</span><b class="f1" style="font:700 16px 'Archivo'">${o}</b><span class="rad"></span></button>`).join('')}
<div class="tl2 nv kol g6"><div class="rw"><span class="mono" style="color:#a9a5c0">${T('Nyawa','Lives')}</span><b>♥ ${d.nyawa}</b></div><div class="rw"><span class="mono" style="color:#a9a5c0">${T('Hadiah','Reward')}</span><b>+15 XP</b></div></div>
<button class="cta2 ug mt-auto" ${d.pilih<0?'disabled':''} data-do="periksa"><span>${T('Periksa jawaban','Check answer')}</span><span class="ar">${ik('arrow_forward')}</span></button>`};
V.render['s-betul']=e=>{const d=D.betul(),q=d.q;
e.innerHTML=`<div class="rw"><span class="mono" style="color:#17142B">${T('TIKET JAWABAN','ANSWER TICKET')}</span><span class="tag2">+15 XP</span></div><div class="kol tengah g6" style="text-align:center"><div class="apung">${mk2(0,110,{bg:'#fff',mata:'garis',mulut:'lebar',lencana:1})}</div><h1 class="hx" style="font-size:60px">${T('Benar!','Correct!')}</h1><b style="font:700 16px 'Archivo'">That's correct — well done.</b></div>
<div class="tl2 pt"><div class="tml">${[[T('Soal dijawab','Question answered'),'s'],[T('Catatan dibuka','Note unlocked'),'s'],[T('Hadiah +15 XP','Reward +15 XP'),'k']].map(x=>`<div><span class="dt2 ${x[1]}">${ik(x[1]==='s'?'check':'star').replace('class="ik"','class="ik" style="font-size:16px"')}</span><b style="font:700 15px 'Archivo'">${x[0]}</b></div>`).join('')}</div><hr style="border:0;border-top:2px dashed #E4DFD0;margin:2px 0 12px"><span class="mono">${T('Catatan','Note')}</span><b style="display:block;font:900 20px 'Archivo';margin:4px 0">${q.note.title}</b><p style="font:600 14px/1.45 'Archivo'">${q.note.body}</p><div class="baris g6" style="flex-wrap:wrap;margin-top:8px">${q.note.chips.map(c=>`<span class="tag2 l" style="background:#E8E1FF;color:#17142B">${c}</span>`).join('')}</div></div>
<div class="tl2 nv baris g12">${mk2(1,40,{bentuk:'bulat'})}<span class="f1 kol"><b>${T('Ketepatan','Accuracy')}</b><span class="mono" style="color:#a9a5c0">${d.i+1}/${d.n}</span></span><b style="font:900 28px 'Archivo';color:#CDF54A">${d.ak}%</b></div>
<div class="baris g10 mt-auto"><button class="cta2 f1" style="min-height:58px" data-do="lanjut"><span>${T('Lanjutkan','Continue')}</span><span class="ar">${ik('arrow_forward')}</span></button><button class="rd dk" style="width:58px;height:58px" data-do="bookmark" aria-label="${T('Simpan','Save')}">${ik('bookmark')}</button></div>`};
V.render['s-salah']=e=>{const d=D.salah(),q=d.q;
e.innerHTML=`<div class="rw">${rd('s-path','close',T('Tutup','Close'))}<span class="mono" style="color:#17142B">${T('Percobaan','Attempt')}</span><span class="cp">♥ ${d.nyawa}</span></div><div class="kol tengah g6" style="text-align:center">${mk2(1,80,{bg:'#fff',mulut:'sedih'})}<h1 class="hx" style="font-size:44px">${T('Belum tepat.','Not quite.')}</h1><b style="font:700 15px 'Archivo'">Not quite — try again.</b></div>
<div class="tl2 pt kol g6"><span class="mono">${T('Jawabanmu','Your answer')}</span><b style="font:700 18px 'Archivo';text-decoration:line-through;color:#9a96ab">${d.js}</b></div><div class="tl2 lm kol g6"><span class="mono" style="color:#17142B">${T('Jawaban benar','Correct answer')}</span><b style="font:800 18px 'Archivo'">${d.df}</b></div>
<div class="tl2 nv kol g6"><div class="baris g6"><span style="color:#CDF54A">${ik('lightbulb')}</span><b>${T('Kenapa?','Why?')}</b></div><p style="font:600 14px/1.45 'Archivo';color:#d9d6ea">${q.note.body}</p>${q.why.rows.map(r=>`<div class="rw mono" style="color:#a9a5c0"><span>${r[0]}</span><b style="color:${r[2]?'#CDF54A':'#fff'}">${r[1]}</b></div>`).join('')}</div>
<div class="kol g8 mt-auto"><button class="cta2" data-do="coba"><span>${T('Coba lagi','Try again')}</span><span class="ar">${ik('refresh')}</span></button><button class="cta2" style="background:#fff;color:#17142B" data-do="simpanUlang"><span>${T('Simpan ke ulangan','Save for review')}</span><span class="ar">${ik('bookmark')}</span></button></div>`};
V.render['s-sebut']=e=>{const d=D.sebut();
e.innerHTML=`<div class="rw"><button class="rd" data-go="s-path" aria-label="${T('Kembali','Back')}">${ik('arrow_back')}</button><span class="mono" style="color:#d9d1ff">${T('Latihan ucapan','Speaking practice')}</span><button class="rd" data-do="toast" data-arg="${T('Tekan dan tahan mikrofon','Press and hold the mic')}" aria-label="${T('Bantuan','Help')}">${ik('help')}</button></div>
<div class="tl2 lm kol g10" style="margin-top:8px"><span class="mono" style="color:#17142B">${T('Ucapkan setelah saya','Repeat after me')}</span><b style="font:900 34px/1 'Archivo';letter-spacing:-.03em">${d.s[0]}</b><span style="font:600 15px 'Archivo'">${d.s[1]}</span>${wave()}</div>
<span class="mono" style="color:#d9d1ff">${T('Kata yang perlu diperbaiki','Words to improve')}</span><div class="baris g8" style="flex-wrap:wrap">${d.ws.map(w=>w.f?`<span class="tag2 l" style="font-size:12px;padding:8px 14px;background:#FFDD57">${w.w} ${d.s[3]}</span>`:`<span class="tag2" style="font-size:12px;padding:8px 14px">${w.w} ✓</span>`).join('')}</div>
<div class="kol tengah g12 mt-auto"><button class="mik" id="mik" aria-label="${T('Rekam','Record')}">${ik('mic').replace('class="ik"','class="ik" style="font-size:44px"')}</button><span class="mono" style="color:#d9d1ff">${T('Tekan dan tahan untuk merekam','Press and hold to record')}</span><div class="baris g10"><button class="cp" data-do="pelan">${ik('slow_motion_video')}${T('Pelan','Slow')}</button><button class="cp" data-do="lewati">${ik('skip_next')}${T('Lewati','Skip')}</button></div></div>`};
V.render['s-papan']=e=>{const d=D.papan(),CC=['lm','ug','or'];
e.innerHTML=`${TOP('s-profil',T('Papan peringkat','Leaderboard'))}<h2 class="hx">${T('Kelas 5<br>Melati.','Class 5<br>Melati.')}</h2>
<div class="rw"><span class="mono">${T('3 hari lagi sebelum minggu berakhir','3 days left this week')}</span><button class="tag2" style="min-height:30px" data-do="periode">${d.per} ⌄</button></div>
${d.pr.map(r=>`<div class="tl2 ${r.i<3?CC[r.i]:'pt'} baris g12" style="padding:12px 16px;${r.saya?'outline:4px solid #17142B;outline-offset:-4px':''}"><b style="font:900 34px 'Archivo';width:36px;letter-spacing:-.04em">${r.i+1}</b>${mk2(r.i,40)}<span class="f1 kol"><b style="font:800 16px 'Archivo'">${r.n}</b>${r.naik?`<span class="mono" style="color:inherit;opacity:.8">${r.naik} XP ${T('lagi untuk naik','to move up')}</span>`:''}</span><b style="font:900 18px 'Archivo'">${fmt(r.xp)}</b></div>`).join('')}
<button class="cta2 mt-auto" data-do="ajak"><span>${T('Ajak teman sekelas','Invite classmates')}</span><span class="ar">${ik('group_add')}</span></button>`};
V.render['s-kemajuan']=e=>{const d=D.km();
e.innerHTML=`<div class="rw"><h2 class="hx">${T('Kemajuanku.','My progress.')}</h2>${rd('s-papan','emoji_events',T('Peringkat','Ranking'))}</div>
<div class="baris g8">${d.pn.map((p,i)=>`<button class="tag2 ${d.pk===i?'':'w'}" style="min-height:34px;padding:8px 16px" data-do="perKm" data-arg="${i}">${p[0]}</button>`).join('')}</div>
<div class="tl2 ug kol g10"><span class="mono" style="color:#d9d1ff">${T('Menit belajar','Study minutes')} ${d.pn[d.pk][1]}</span><div class="baris g10"><b style="font:900 44px 'Archivo';letter-spacing:-.04em">${d.sum}</b><span class="tag2 l">+22%</span></div><div class="gf">${d.hm.map((v,i)=>`<div class="${i===d.hi?'hi':''}"><i style="height:${Math.max(8,v/d.mx*100)}%"></i>${d.hari[i]}</div>`).join('')}</div></div>
<div class="bento" style="grid-template-columns:1fr 1fr"><div class="tl2 lm"><b style="font:900 40px 'Archivo';letter-spacing:-.04em">${d.kata}</b><br><span class="mono" style="color:#17142B">${T('Kata dipelajari','Words learned')}</span></div><div class="tl2 or"><b style="font:900 40px 'Archivo';letter-spacing:-.04em">${d.ak}%</b><br><span class="mono" style="color:#17142B">${T('Ketepatan kuis','Quiz accuracy')}</span></div></div>
<div class="tl2 nv baris g12"><b style="font:900 40px 'Archivo';color:#CDF54A">${d.str}</b><span class="mono" style="color:#a9a5c0">${T('Hari berturut','Day streak')}</span></div>
<div class="tl2 pt kol g12">${d.skill.map(s=>`<div class="kol g6"><div class="rw"><b style="font-size:14px">${s[0]}</b><span class="mono">${s[1]}%</span></div><div class="pb"><i style="width:${s[1]}%"></i></div></div>`).join('')}</div>`};
V.render['s-profil']=e=>{const d=D.profil();
e.innerHTML=`<div class="rw"><h2 class="hx">${T('Profil.','Profile.')}</h2><button class="rd" data-do="nama" aria-label="${T('Ubah nama','Edit name')}">${ik('edit')}</button></div>
<div class="tl2 nv kol g10"><div class="baris g12">${mk2(0,60,{bentuk:'kotak'})}<span class="kol"><b style="font:900 22px 'Archivo'">${d.nama}</b><span class="mono" style="color:#a9a5c0">SDN 03 Menteng · 5 Melati</span></span></div><div class="baris g8"><span class="tag2 l">${T('Tingkat','Level')} ${d.level}</span><span class="tag2 l" style="background:#5B3DF5;color:#fff">${d.xp} XP</span></div></div>
<button class="row2" data-go="s-papan"><span class="sq" style="background:#CDF54A">${ik('emoji_events')}</span><b class="f1">${T('Papan peringkat','Leaderboard')}</b>${ik('chevron_right')}</button>
<div class="row2"><span class="sq" style="background:#E8E1FF">${ik('translate')}</span><b class="f1">${T('Bahasa antarmuka','Interface language')}</b>${SEG()}</div>
<div class="row2"><span class="sq" style="background:#FFE0D2">${ik('notifications')}</span><span class="f1 kol"><b>${T('Pengingat harian','Daily reminder')}</b><span class="mono">${T('Setiap hari, pukul 19.00','Every day at 7 PM')}</span></span>${SUIS('ingat')}</div>
<div class="row2"><span class="sq" style="background:#E4DFD0">${ik('cloud_off')}</span><span class="f1 kol"><b>${T('Pelajaran luring','Offline lessons')}</b><span class="mono">${T('Bisa dipakai tanpa kuota','Works without data')}</span></span>${SUIS('luring')}</div>
<div class="row2"><span class="sq" style="background:#CDF54A">${ik('key')}</span><b class="f1">${T('Kode kelas guru','Teacher code')}</b><b>${d.kode}</b></div>
<button class="row2" style="color:#d4302a" data-do="reset"><span class="sq" style="background:#FFE0D2">${ik('logout')}</span><b class="f1">${T('Mulai ulang kemajuan','Reset progress')}</b></button>`};

boot();
</script>
</body>
</html>
