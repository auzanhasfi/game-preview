e.innerHTML=`<div class="kol tengah g8" style="text-align:center;margin-top:10px"><div style="width:130px;height:130px;border-radius:50%;background:var(--lm);display:grid;place-items:center" class="apung">${ik('check').replace('class="ik"','class="ik" style="font-size:72px"')}</div><h2 class="h3" style="font-size:32px">${T('Benar!','Correct!')}</h2><p class="p3">That's correct — well done.</p></div>
<div class="c3 kol g8"><span class="ch3" style="align-self:flex-start">${T('Catatan','Note')}</span><b style="font:800 18px 'Manrope'">${q.note.title}</b><p class="p3" style="color:var(--nv)">${q.note.body}</p><div class="baris g6" style="flex-wrap:wrap">${q.note.chips.map(c=>`<span class="ch3 g">${c}</span>`).join('')}</div></div>
<div class="baris g10"><div class="c3 f1 kol"><span class="p3" style="font-size:12px">${T('Hadiah','Reward')}</span><b style="font:800 22px 'Manrope'">+15 XP</b></div><div class="c3 f1 kol" style="background:var(--nv);color:#fff"><span class="p3" style="font-size:12px">${T('Ketepatan','Accuracy')}</span><b style="font:800 22px 'Manrope';color:var(--lm)">${d.ak}%</b></div></div>
<div class="baris g10 mt-auto"><button class="bt3" data-do="lanjut">${T('Lanjutkan','Continue')}</button><button class="ib3" style="width:56px;height:56px" data-do="bookmark" aria-label="${T('Simpan','Save')}">${ik('bookmark')}</button></div>`};
V.render['s-salah']=e=>{const d=D.salah(),q=d.q;
e.innerHTML=`<div class="top3"><button class="ib3" data-go="s-path" aria-label="${T('Tutup','Close')}">${ik('close')}</button><span></span><span class="ch3 g">${ik('favorite').replace('class="ik"','class="ik" style="font-size:16px;color:#FF6B5E"')}${d.nyawa}</span></div>
<div class="kol tengah g8" style="text-align:center"><div style="width:120px;height:120px;border-radius:50%;background:#FFD9D3;display:grid;place-items:center">${mk3(4,76,{bg:'#fff',mulut:'sedih'})}</div><h2 class="h3" style="font-size:30px">${T('Belum tepat','Not quite')}</h2><p class="p3">Not quite — try again.</p></div>
<div class="c3 kol g6"><span class="p3" style="font-size:12px">${T('Jawabanmu','Your answer')}</span><b style="text-decoration:line-through;color:var(--gy)">${d.js}</b></div><div class="c3 kol g6" style="background:#F1FAC8"><span class="p3" style="font-size:12px;color:var(--nv)">${T('Jawaban benar','Correct answer')}</span><b>${d.df}</b></div>
<div class="c3 kol g8"><b>${ik('lightbulb').replace('class="ik"','class="ik" style="vertical-align:-6px;color:#E0A100"')} ${T('Kenapa?','Why?')}</b><p class="p3" style="color:var(--nv)">${q.note.body}</p></div>
<div class="kol g8 mt-auto"><button class="bt3" data-do="coba">${T('Coba lagi','Try again')}</button><button class="bt3 ol" data-do="simpanUlang">${T('Simpan ke ulangan','Save for review')}</button></div>`};
V.render['s-sebut']=e=>{const d=D.sebut();
e.innerHTML=`${HEAD3(BK3('s-path'),T('Latihan Ucapan','Speaking'),`<button class="ib3" data-do="toast" data-arg="${T('Tekan dan tahan mikrofon','Press and hold the mic')}" aria-label="${T('Bantuan','Help')}">${ik('help')}</button>`)}
<div class="c3 kol g10" style="background:var(--lm);box-shadow:none"><span class="p3" style="color:var(--nv);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase">${T('Ucapkan setelah saya','Repeat after me')}</span><b style="font:800 28px/1.15 'Manrope'">${d.s[0]}</b><span style="font:600 14px 'Manrope'">${d.s[1]}</span>${wave()}</div>
<b style="font:800 16px 'Manrope'">${T('Kata yang perlu diperbaiki','Words to improve')}</b><div class="baris g8" style="flex-wrap:wrap">${d.ws.map(w=>w.f?`<span class="ch3 dk">${w.w} ${d.s[3]}</span>`:`<span class="ch3">${w.w} ✓</span>`).join('')}</div>
<div class="kol tengah g12 mt-auto"><button class="mik" id="mik" aria-label="${T('Rekam','Record')}">${ik('mic').replace('class="ik"','class="ik" style="font-size:44px"')}</button><span class="p3">${T('Tekan dan tahan untuk merekam','Press and hold to record')}</span><div class="baris g10"><button class="ch3 g" style="min-height:44px;padding:10px 18px" data-do="pelan">${ik('slow_motion_video')}${T('Pelan','Slow')}</button><button class="ch3 g" style="min-height:44px;padding:10px 18px" data-do="lewati">${ik('skip_next')}${T('Lewati','Skip')}</button></div></div>`};
V.render['s-papan']=e=>{const d=D.papan();
e.innerHTML=`${HEAD3(BK3('s-home'),T('Peringkat','Ranking'))}<div class="seg" style="width:100%"><button class="f1 ${perPapan?'':'on'}" data-do="periode">${T('Mingguan','Weekly')}</button><button class="f1 ${perPapan?'on':''}" data-do="periode">${T('Bulanan','Monthly')}</button></div>
<p class="p3">${T('Kelas 5 Melati · 3 hari lagi sebelum minggu berakhir','Class 5 Melati · 3 days left this week')}</p>
${d.pr.map(r=>`<div class="c3 baris g12" style="padding:12px 14px;${r.saya?'background:var(--lm)':''}"><b style="font:800 16px 'Manrope';width:22px;text-align:center">${r.i+1}</b><span style="width:44px;height:44px;border-radius:50%;background:${r.saya?'#fff':P3[r.i%6]};display:grid;place-items:center;flex:none">${mk3(r.i+2,34,{bg:'transparent'})}</span><span class="f1 kol"><b style="font:800 15px 'Manrope'">${r.n}</b>${r.naik?`<span class="p3" style="font-size:12px;color:var(--nv)">${r.naik} XP ${T('lagi untuk naik','to move up')}</span>`:''}</span><b style="font:800 15px 'Manrope'">${fmt(r.xp)}</b></div>`).join('')}
<button class="bt3 dk mt-auto" data-do="ajak">${ik('group_add')}${T('Ajak teman sekelas','Invite classmates')}</button>`};
V.render['s-kemajuan']=e=>{const d=D.km();
e.innerHTML=`${HEAD3(BK3('s-profil'),T('Kemajuanku','My Progress'),`<button class="ib3" data-go="s-papan" aria-label="${T('Peringkat','Ranking')}">${ik('emoji_events')}</button>`)}
<div class="baris g8">${d.pn.map((p,i)=>`<button class="ch3 ${d.pk===i?'dk':'g'}" style="min-height:36px;padding:8px 16px" data-do="perKm" data-arg="${i}">${p[0]}</button>`).join('')}</div>
<div class="c3 kol g10"><span class="p3" style="font-size:13px">${T('Menit belajar '+d.pn[d.pk][1],'Study minutes '+d.pn[d.pk][1])}</span><div class="baris g10"><b style="font:800 34px 'Manrope';letter-spacing:-.03em">${d.sum} ${T('mnt','min')}</b><span class="ch3">+22%</span></div><div class="gf">${d.hm.map((v,i)=>`<div class="${i===d.hi?'hi':''}"><i style="height:${Math.max(8,v/d.mx*100)}%"></i>${d.hari[i]}</div>`).join('')}</div></div>
<div class="baris g10">${[[d.kata,T('Kata','Words'),P3[0]],[d.ak+'%',T('Ketepatan','Accuracy'),P3[1]],[d.str,T('Hari','Days'),P3[2]]].map(x=>`<div class="c3 f1 kol" style="background:${x[2]};box-shadow:none;padding:14px 12px"><b style="font:800 24px 'Manrope'">${x[0]}</b><span class="p3" style="font-size:12px;color:var(--nv)">${x[1]}</span></div>`).join('')}</div>
<div class="c3 kol g12">${d.skill.map(s=>`<div class="kol g6"><div class="rw"><b style="font-size:14px">${s[0]}</b><span class="p3">${s[1]}%</span></div><div class="pr3"><i style="width:${s[1]}%"></i></div></div>`).join('')}</div>`};
V.render['s-profil']=e=>{const d=D.profil();
e.innerHTML=`<div class="hdr3"><i style="width:220px;height:220px;background:#FF8E5E;left:-60px;top:-90px"></i><i style="width:200px;height:200px;background:#8CC8FF;right:-50px;top:-40px"></i><i style="width:140px;height:140px;background:#D9C6FF;left:120px;top:30px"></i><div class="top3" style="position:absolute;left:20px;right:20px;top:12px"><b style="font:800 17px 'Manrope';color:#fff;margin:0 auto">${T('Profil','Profile')}</b></div><button class="ib3" style="position:absolute;right:20px;top:60px" data-do="nama" aria-label="${T('Ubah nama','Edit name')}">${ik('edit')}</button></div>
<div class="av3">${mk3(0,70,{bg:'transparent'})}</div>
<div class="kol tengah g6" style="text-align:center"><h2 class="h3">${d.nama}</h2><span class="p3">SDN 03 Menteng · 5 Melati</span><div class="baris g8"><span class="ch3">${T('Tingkat','Level')} ${d.level}</span><span class="ch3 dk">${d.xp} XP</span></div></div>
<b style="font:800 16px 'Manrope'">${T('Pengaturan','Settings')}</b>
<div class="c3 kol g14"><div class="rw"><b style="font-size:14px">${T('Bahasa antarmuka','Interface language')}</b>${SEG()}</div><div class="rw"><span class="kol"><b style="font-size:14px">${T('Pengingat harian','Daily reminder')}</b><span class="p3" style="font-size:12px">${T('Setiap hari, pukul 19.00','Every day at 7 PM')}</span></span>${SUIS('ingat')}</div><div class="rw"><span class="kol"><b style="font-size:14px">${T('Pelajaran luring','Offline lessons')}</b><span class="p3" style="font-size:12px">${T('Bisa dipakai tanpa kuota','Works without data')}</span></span>${SUIS('luring')}</div><div class="rw"><b style="font-size:14px">${T('Kode kelas guru','Teacher code')}</b><b>${d.kode}</b></div></div>
<button class="bt3 ol" data-go="s-kemajuan">${ik('bar_chart')}${T('Lihat kemajuan','View progress')}</button><button class="bt3 ol" style="color:#E0463A" data-do="reset">${T('Mulai ulang kemajuan','Reset progress')}</button>`};

boot();
</script>
</body>
</html>
