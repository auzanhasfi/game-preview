<div class="baris g8" style="flex-wrap:wrap">${d.ws.map(w=>w.f?`<span class="pl4 pr" style="border:0">${w.w} ${d.s[3]}</span>`:`<span class="pl4" style="color:#fff;border-color:#fff">${w.w} ✓</span>`).join('')}</div>
<div class="kol tengah g12 mt-auto"><button class="mik" id="mik" aria-label="${T('Rekam','Record')}">${ik('mic').replace('class="ik"','class="ik" style="font-size:48px"')}</button><span class="sb4" style="font-size:14px;color:#E4DEFF">${T('Tekan dan tahan untuk merekam','Press and hold to record')}</span><div class="baris g10"><button class="pl4" style="color:#fff;border-color:#fff" data-do="pelan">${ik('slow_motion_video')}${T('Pelan','Slow')}</button><button class="pl4" style="color:#fff;border-color:#fff" data-do="lewati">${ik('skip_next')}${T('Lewati','Skip')}</button></div></div>`};
V.render['s-papan']=e=>{const d=D.papan(),C=['#C9E24B','#6B52FF','#FF8F7A'];
e.innerHTML=`<div class="rw"><h2 class="hh" style="font-size:46px">${T('Papan.','Board.')}</h2><button class="pl4" data-do="periode">${d.per} ${ik('expand_more')}</button></div><span class="sb4" style="font-size:14px">${T('Kelas 5 Melati · 3 hari lagi sebelum minggu berakhir','Class 5 Melati · 3 days left this week')}</span>
${d.pr.map(r=>`<div class="baris g12" style="padding:6px 16px 6px 6px;border-radius:99px;background:${r.saya?'#1F6B4A':r.i<3?C[r.i]:'#fff'};color:${r.saya?'#fff':IK}"><b style="font:800 40px 'Bricolage Grotesque';width:44px;text-align:center;letter-spacing:-.05em">${r.i+1}</b><span class="f1 kol"><b style="font:800 17px 'Figtree'">${r.n}</b>${r.naik?`<span style="font:600 12px 'Figtree';opacity:.8">${r.naik} XP ${T('lagi untuk naik','to move up')}</span>`:''}</span><b style="font:800 18px 'Figtree'">${fmt(r.xp)}</b></div>`).join('')}
<button class="bt4 mt-auto" data-do="ajak">${ik('group_add')}${T('Ajak teman sekelas','Invite classmates')}</button>`};
V.render['s-kemajuan']=e=>{const d=D.km();
e.innerHTML=`<div class="rw"><h2 class="hh" style="font-size:42px">${T('Kemajuan<br>kamu.','Your<br>progress.')}</h2><button class="rd4 w" data-go="s-papan" aria-label="${T('Peringkat','Ranking')}">${ik('emoji_events')}</button></div>
<div class="baris g8">${d.pn.map((p,i)=>`<button class="pl4${d.pk===i?' pr':''}" style="${d.pk===i?'':'color:#fff;border-color:#fff'}" data-do="perKm" data-arg="${i}">${p[0]}</button>`).join('')}</div>
<div class="kol"><span class="num4" style="color:#C9E24B">${d.sum}</span><b style="font-size:15px">${T('menit belajar '+d.pn[d.pk][1],'study minutes '+d.pn[d.pk][1])}</b></div><div class="gf4">${d.hm.map((v,i)=>`<div class="${i===d.hi?'hi':''}"><i style="height:${Math.max(8,v/d.mx*100)}%"></i>${d.hari[i]}</div>`).join('')}</div>
<div class="baris g12"><div class="kol f1"><span class="num4" style="font-size:44px">${d.kata}</span><b style="font-size:13px">${T('kata','words')}</b></div><div class="kol f1"><span class="num4" style="font-size:44px">${d.ak}%</span><b style="font-size:13px">${T('ketepatan','accuracy')}</b></div><div class="kol f1"><span class="num4" style="font-size:44px">${d.str}</span><b style="font-size:13px">${T('hari','days')}</b></div></div>
<div class="kol g12">${d.skill.map(s=>`<div class="kol g6"><div class="rw"><b>${s[0]}</b><b>${s[1]}%</b></div><div class="pb4" style="background:rgba(255,255,255,.2)"><i style="width:${s[1]}%;background:#C9E24B"></i></div></div>`).join('')}</div>`};
V.render['s-profil']=e=>{const d=D.profil();
e.innerHTML=`<div class="rw"><span></span><button class="rd4" data-do="nama" aria-label="${T('Ubah nama','Edit name')}">${ik('edit')}</button></div>
<div class="baris g14"><span class="apung">${pear(110)}</span><div class="kol g6"><h2 class="hh" style="font-size:36px">${d.nama.split(' ')[0]}</h2><span class="sb4" style="font-size:14px">SDN 03 Menteng · 5 Melati</span></div></div>
<div class="baris g8"><span class="pl4 k">${T('Tingkat','Level')} ${d.level}</span><span class="pl4 pr" style="border:0">${d.xp} XP</span></div>
<div class="kol" style="border-top:3px solid #101010"><div class="rw" style="padding:14px 0;border-bottom:3px solid #101010"><b style="font:800 18px 'Figtree'">${T('Bahasa antarmuka','Interface language')}</b>${SEG()}</div><div class="rw" style="padding:14px 0;border-bottom:3px solid #101010"><span class="kol"><b style="font:800 18px 'Figtree'">${T('Pengingat harian','Daily reminder')}</b><span class="sb4" style="font-size:13px">${T('Setiap hari, pukul 19.00','Every day at 7 PM')}</span></span>${SUIS('ingat')}</div><div class="rw" style="padding:14px 0;border-bottom:3px solid #101010"><span class="kol"><b style="font:800 18px 'Figtree'">${T('Pelajaran luring','Offline lessons')}</b><span class="sb4" style="font-size:13px">${T('Bisa dipakai tanpa kuota','Works without data')}</span></span>${SUIS('luring')}</div><div class="rw" style="padding:14px 0;border-bottom:3px solid #101010"><b style="font:800 18px 'Figtree'">${T('Kode kelas guru','Teacher code')}</b><b style="font:800 18px 'Figtree'">${d.kode}</b></div></div>
<button class="bt4 ol" data-go="s-kemajuan">${ik('bar_chart')}${T('Lihat kemajuan','View progress')}</button><button class="bt4 ol" style="color:#C23B28;border-color:#C23B28" data-do="reset">${T('Mulai ulang kemajuan','Reset progress')}</button>`};

boot();
</script>
</body>
</html>
