const ulang=()=>V.render[cur]&&V.render[cur]($('#'+cur));
const baru=o=>ses=Object.assign({les:langkahBerjalan(),kartu:0,soal:0,nyawa:3,betul:0,pilih:-1,solo:false,sx:0},o||{});
function mulai(id){const l=LANGKAH.find(x=>x.id===id);if(terkunci(l)){toast(T('Selesaikan pelajaran sebelumnya dulu ya','Finish the previous lesson first'));return}baru({les:l});pergi('s-card')}
function selesaiPelajaran(){const l=ses.les;S.selesai[l.id]=true;S.menit+=8;S.hariMenit[hariIdx()]+=8;S.xp+=20;S.xpMinggu+=20;simpan();konfeti();toast(T(`Pelajaran “${l.idn}” selesai! +${20+ses.sx} XP`,`Lesson “${l.en}” complete! +${20+ses.sx} XP`));setTimeout(()=>pergi('s-path'),900)}
function mulaiRek(){if(rek)return;const g=$('#gel');if(!g)return;g.classList.add('rek');const m=$('#mik');m&&m.classList.add('rekam');rek={t:Date.now(),iv:setInterval(()=>[...g.children].forEach(b=>{const h=15+Math.random()*70;b.style.height=h+'%';b.classList.toggle('kuat',h>78)}),120),to:setTimeout(hentiRek,5000)}}
function hentiRek(){if(!rek)return;clearInterval(rek.iv);clearTimeout(rek.to);const d=Date.now()-rek.t;rek=null;const g=$('#gel');if(g){g.classList.remove('rek');[...g.children].forEach((b,i)=>{b.style.height=POLA[i]+'%';b.classList.remove('kuat')})}const m=$('#mik');m&&m.classList.remove('rekam');if(d<400){toast(T('Tahan sedikit lebih lama ya','Hold a little longer'));return}
const sk=78+Math.floor(Math.random()*21);S.xp+=10;S.xpMinggu+=10;ses.sx+=10;simpan();toast(T(`Ucapanmu ${sk}%! +10 XP`,`Your speaking: ${sk}%! +10 XP`));setTimeout(()=>ses.solo?pergi('s-home'):selesaiPelajaran(),800)}
const wave=()=>`<div class="gel" id="gel">${POLA.map(p=>`<i style="height:${p}%"></i>`).join('')}</div>`;
const AKSI={
bahasa:a=>{S.bahasa=a;simpan();ulang()},
suis:a=>{S.suis[a]=!S.suis[a];simpan();ulang()},
toast:a=>toast(a),
level:a=>{S.level=a;simpan();ulang()},
ob:a=>{obi=+a;ulang()},
mulai:a=>mulai(a),
mulaiKosa:()=>mulai(langkahBerjalan().id),
mulaiUcap:()=>{baru({solo:true});pergi('s-sebut')},
mulaiTata:()=>{baru({solo:true});pergi('s-quiz')},
ganti:()=>{const cl=langkahBerjalan();lihat=((lihat==null?cl.u:lihat)+1)%KURIKULUM.length;ulang()},
ucap:a=>ucap(a),
pelan:()=>{if(!ses.les)ses.les=langkahBerjalan();ucap(ses.les.s[0],true)},
kartu:a=>{const l=ses.les;if(a==='1'){S.hafal[l.k[ses.kartu][0]]=true;S.kata=412+Object.keys(S.hafal).length;simpan()}ses.kartu++;if(ses.kartu>=l.k.length){ses.soal=0;ses.pilih=-1;pergi('s-quiz')}else ulang()},
pilih:a=>{ses.pilih=+a;ulang()},
periksa:()=>{const q=ses.les.q[ses.soal];S.jawab++;if(ses.pilih===q.a){S.benar++;ses.betul++;S.xp+=15;S.xpMinggu+=15;simpan();konfeti();pergi('s-betul')}else{ses.nyawa--;simpan();pergi('s-salah')}},
lanjut:()=>{ses.soal++;ses.pilih=-1;if(ses.soal>=ses.les.q.length){ses.soal=0;ses.solo?pergi('s-home'):pergi('s-sebut')}else pergi('s-quiz')},
bookmark:()=>{const q=ses.les.q[ses.soal];if(!S.simpan.includes(q.prompt))S.simpan.push(q.prompt);simpan();toast(T('Disimpan ke ulangan','Saved for review'))},
coba:()=>{if(ses.nyawa<=0){ses.nyawa=3;ses.soal=0;toast(T('Nyawa habis — ulang dari soal 1','Out of lives — back to question 1'))}ses.pilih=-1;pergi('s-quiz')},
simpanUlang:()=>{AKSI.bookmark();AKSI.coba()},
lewati:()=>{if(ses.solo||!ses.les)pergi('s-home');else selesaiPelajaran()},
periode:()=>{perPapan=perPapan?0:1;ulang()},
perKm:a=>{perKm=+a;ulang()},
ajak:()=>{try{navigator.clipboard.writeText('5MLT-26')}catch(e){}toast(T('Kode kelas 5MLT-26 disalin','Class code 5MLT-26 copied'))},
nama:()=>{const n=prompt(T('Nama kamu:','Your name:'),S.nama);if(n&&n.trim()){S.nama=n.trim().slice(0,24);simpan();ulang()}},
reset:()=>{if(confirm(T('Mulai ulang semua kemajuan?','Reset all progress?'))){S=JSON.parse(JSON.stringify(AWAL));simpan();baru();obi=0;pergi('s-onboarding')}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-do]');if(!el)return;if(el.dataset.go)pergi(el.dataset.go);else{const f=AKSI[el.dataset.do];f&&f(el.dataset.arg,el)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-go][role=button],[data-do][role=button]')){e.preventDefault();e.target.click()}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#mik')){e.preventDefault();mulaiRek()}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,hentiRek));
window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.id==='mik'&&!rek){e.preventDefault();mulaiRek()}});
window.addEventListener('keyup',e=>{if(e.code==='Space'&&e.target.id==='mik')hentiRek()});
const boot=()=>{$$('[data-go]:not(button):not(a),[data-do]:not(button):not(a)').forEach(e=>{if(!e.hasAttribute('role')){e.setAttribute('role','button');e.tabIndex=0}});jam();setInterval(jam,20000);try{speechSynthesis.getVoices()}catch(e){}pergi('s-onboarding')};

V.render['s-papan']=e=>{const d=D.papan(),C=['ye','li','or'];e.innerHTML=G(
tile('bk',`<div class="rw"><h2 class="d5 m" style="color:#fff">${T('Papan<br>peringkat','Leader<br>board')}</h2><button class="ch5 ye" data-do="periode">${d.per} ⌄</button></div><p class="p5" style="color:#ccc;margin-top:8px">${T('Kelas 5 Melati · 3 hari lagi sebelum minggu berakhir','Class 5 Melati · 3 days left this week')}</p>`)+
d.pr.map(r=>tile(r.saya?'gn':r.i<3?C[r.i]:'wh',`<div class="rk5"><span class="n">${r.i+1}</span><span class="apung" style="animation-duration:6s">${mk5(r.i+1,50)}</span><span class="f1 kol"><b style="font:800 18px 'DM Sans'">${r.n}</b>${r.naik?`<span class="l5">${r.naik} XP ${T('lagi untuk naik','to move up')}</span>`:''}</span><b style="font:400 30px 'Anton'">${fmt(r.xp)}</b></div>`)).join('')+
tile('bu',`<span class="d5 m">${T('Ajak teman<br>sekelas','Invite<br>classmates')}</span><span class="bt5 ye" style="margin-top:10px">${ik('group_add')}</span>`,'data-do="ajak"'))};
V.render['s-kemajuan']=e=>{const d=D.km();e.innerHTML=G(
tile('bk',`<div class="rw"><span class="l5" style="color:#aaa">${T('Menit belajar '+d.pn[d.pk][1],'Study minutes '+d.pn[d.pk][1])}</span><span class="ch5 gn">+22%</span></div><div class="d5" style="font-size:96px;color:#FFE14A">${d.sum}</div><div class="gf5">${d.hm.map((v,i)=>`<div class="${i===d.hi?'hi':''}" style="color:#aaa"><i style="height:${Math.max(8,v/d.mx*100)}%"></i>${d.hari[i]}</div>`).join('')}</div><div class="baris g8" style="margin-top:14px">${d.pn.map((p,i)=>`<button class="ch5${d.pk===i?' ye':''}" data-do="perKm" data-arg="${i}">${p[0]}</button>`).join('')}</div>`)+
tile('or',`<div class="d5" style="font-size:96px">${d.ak}%</div><b style="font:800 16px 'DM Sans';text-transform:uppercase">${T('ketepatan kuis','quiz accuracy')}</b>`)+
tile('li',`<div class="d5" style="font-size:96px">${d.kata}</div><b style="font:800 16px 'DM Sans';text-transform:uppercase">${T('kata dipelajari','words learned')}</b>`)+
tile('wh',`<div class="kol g14">${d.skill.map(s=>`<div class="kol g6"><div class="rw"><b>${s[0]}</b><b>${s[1]}%</b></div><div class="pb5"><i style="width:${s[1]}%"></i></div></div>`).join('')}</div>`)+
tile('gn',`<div class="d5 m">${d.str} ${T('hari<br>berturut','day<br>streak')}</div><span class="bt5" style="margin-top:10px">${T('Peringkat','Ranking')} →</span>`,'data-go="s-papan"'))};
V.render['s-profil']=e=>{const d=D.profil();e.innerHTML=G(
tile('pk',`<div class="rw" style="align-items:flex-start"><span class="apung">${mk5(0,110,{bg:'#fff'})}</span><button class="bt5" data-do="nama" aria-label="${T('Ubah nama','Edit name')}">${ik('edit')}</button></div><h2 class="d5 m" style="margin-top:10px">${d.nama}</h2><p class="p5">SDN 03 Menteng · 5 Melati</p><div class="baris g8" style="margin-top:10px"><span class="ch5 bk">${T('Tingkat','Level')} ${d.level}</span><span class="ch5 ye">${d.xp} XP</span></div>`)+
tile('wh',`<div class="kol g14"><div class="rw"><b>${T('Bahasa antarmuka','Interface language')}</b>${SEG()}</div><div class="rw"><span class="kol"><b>${T('Pengingat harian','Daily reminder')}</b><span class="l5" style="color:#777">${T('Setiap hari, pukul 19.00','Every day at 7 PM')}</span></span>${SUIS('ingat')}</div><div class="rw"><span class="kol"><b>${T('Pelajaran luring','Offline lessons')}</b><span class="l5" style="color:#777">${T('Bisa dipakai tanpa kuota','Works without data')}</span></span>${SUIS('luring')}</div><div class="rw"><b>${T('Kode kelas guru','Teacher code')}</b><b>${d.kode}</b></div></div>`)+
tile('bu',`<span class="d5 m">${T('Lihat<br>kemajuan','View<br>progress')}</span><span class="bt5 ye" style="margin-top:10px">→</span>`,'data-go="s-kemajuan"')+
tile('bk',`<span class="d5 s" style="color:#FF6A3D">${T('Mulai ulang kemajuan','Reset progress')}</span>`,'data-do="reset"'))};

boot();
</script>
</body>
</html>
