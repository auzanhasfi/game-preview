<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gemi Gabung Nombor</title>
<meta name="theme-color" content="#1b1f2e">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/gaya.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <button class="ib" id="btnBack" data-uji="kembali" hidden></button>
    <span class="bar-gap"></span>
    <button class="ib teks" id="btnLang" data-uji="tukar-bahasa"></button>
    <button class="ib" id="btnSnd" data-uji="bunyi"></button>
  </header>

  <!-- MENU -->
  <section class="skrin" id="menu">
    <div class="maskot besar" id="mMenu"></div>
    <h1 data-t="tajuk"></h1>
    <p class="sub" data-t="sub"></p>
    <div class="bahasa" role="group" aria-label="Bahasa">
      <button class="pil" data-uji="bm" data-loc="ms"></button>
      <button class="pil" data-uji="id" data-loc="id"></button>
    </div>
    <button class="btn utama" data-uji="mula" id="btnMula"></button>
    <p class="cara" data-t="cara"></p>
  </section>

  <!-- PETA TAHAP -->
  <section class="skrin" id="peta" hidden>
    <h2 data-t="peta"></h2>
    <div id="petaIsi"></div>
  </section>

  <!-- MAIN -->
  <section class="skrin" id="main" hidden>
    <div class="atas">
      <div class="maskot kecil" id="mMain"></div>
      <div class="soal">
        <div class="soal-op" id="soalOp"></div>
        <div class="soal-q" id="soalQ"></div>
        <div class="soal-s" id="soalS"></div>
        <div class="prog"><i id="progBar"></i></div>
      </div>
    </div>
    <div class="gelembung" id="bubble" aria-live="polite"></div>
    <div class="stat">
      <div><small data-t="skor"></small><b id="vSkor" data-uji="skor">0</b></div>
      <div><small data-t="langkah"></small><b id="vLangkah">0/0</b></div>
      <div><small data-t="terbaik"></small><b id="vBest">0</b></div>
    </div>
    <div class="papan-wrap">
      <div class="papan" id="papan" data-uji="papan" tabindex="0">
        <div class="sel-layer" id="selLayer"></div>
        <div class="tiles" id="tiles"></div>
        <div class="fx" id="fx"></div>
      </div>
    </div>
    <div class="alat">
      <button class="btn kecil" id="btnUndo" data-uji="buat-asal"></button>
      <button class="btn kecil" id="btnUlang" data-uji="ulang"></button>
    </div>
  </section>

  <!-- HASIL (lapisan di atas main) -->
  <section class="hasil" id="hasil" hidden>
    <div class="kad">
      <div class="maskot sederhana" id="mHasil"></div>
      <h2 id="hTajuk"></h2>
      <div class="bintang-baris" id="hBintang"></div>
      <p class="hs" id="hStat"></p>
      <div class="btn-baris">
        <button class="btn utama" id="btnNext" data-uji="seterusnya"></button>
        <button class="btn" id="btnUlang2" data-uji="ulang-hasil"></button>
        <button class="btn" id="btnPeta" data-uji="peta-hasil"></button>
      </div>
    </div>
  </section>
</div>
<script src="js/logic.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/maskot.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
