const touch=()=>{const t=dk(new Date());if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-60)}save()};

V.home=()=>{const nx=MODS.find(m=>pg(m.id).stars===0)||MODS[0];const sk=streak();
return`<h1>Halo, ${esc(S.name)}</h1><div class="row" style="flex-wrap:wrap;margin-bottom:16px"><span class="chip">${I('flame',20)}${sk} hari beruntun</span><span class="chip">${I('star',20)}${MODS.reduce((a,m)=>a+pg(m.id).stars,0)} bintang</span></div>
<div class="hero" style="margin-bottom:24px">${bulat(sk?'senang':'normal',96)}<div><h2>Lanjutkan belajar</h2><p style="margin-bottom:16px">Modul ${nx.id} · ${nx.t}</p><button class="btn p" data-a="modul" data-m="${nx.id}">${I('play',20)}Lanjutkan</button></div></div>
<h2>Peta modul</h2><div class="col" style="gap:8px">${MODS.map(modCard).join('')}</div>`};
V.belajar=()=>{let h='<h1>Belajar</h1>';['Matematika','Bahasa Indonesia'].forEach(mp=>{h+=`<h2 style="margin-top:24px">${mp}</h2><div class="col" style="gap:8px">${MODS.filter(m=>m.mp===mp).map(modCard).join('')}</div>`});
return h+`<h2 style="margin-top:32px">Alat bantu</h2><div class="grid g2"><button class="card mod" data-a="papan">${I('pen',32)}<span class="b"><b>Papan tulis coret</b><span class="sm mut">Menghitung dengan jari dan coretan.</span></span></button><button class="card mod" data-a="tantang">${I('timer',32)}<span class="b"><b>Tantangan 60 detik</b><span class="sm mut">Penjumlahan cepat. Terbaik: ${S.best} benar.</span></span></button></div>`};
ACT.modul=d=>go('modul',{m:+d.m});
V.modul=()=>{const m=MODS[R.m-1],p=pg(m.id),s=st(m.id);
const steps=[['pel','Pelajaran',`${LESS[m.id].length} langkah`,p.lesson,'book'],['lat','Latihan','10 soal',s.lat>0,'pen'],['kuis','Kuis akhir','5 soal campuran',p.stars>0,'star']];
const nx=steps.find(x=>!x[3])||steps[0];
return`<button class="btn t" data-a="tab" data-k="belajar">${I('prev',20)}Semua modul</button><h1 style="margin-top:8px">Modul ${m.id} · ${m.t}</h1><p class="mut">${m.d}</p><div class="row" style="margin-bottom:24px"><span class="chip">${m.mp}</span>${stars(p.stars)}</div>
<button class="btn p full" data-a="${nx[0]}" data-m="${m.id}">${I('play',20)}${nx[0]==='pel'?'Mulai pelajaran':nx[0]==='lat'?'Mulai latihan':'Mulai kuis akhir'}</button>
<div class="col" style="margin-top:24px;gap:8px">${steps.map(x=>`<button class="btn s full" style="justify-content:flex-start" data-a="${x[0]}" data-m="${m.id}">${I(x[4],22)}<span style="flex:1;text-align:left">${x[1]} <span class="sm mut">· ${x[2]}</span></span>${x[3]?I('check',22):''}</button>`).join('')}</div>`};

/* ---------- pelajaran ---------- */
ACT.pel=d=>{L={m:+d.m,i:0};go('pelajaran')};
V.pelajaran=()=>{const st_=LESS[L.m][L.i],last=L.i===LESS[L.m].length-1;
return`<div class="top"><button class="iconbtn" data-a="modul" data-m="${L.m}" aria-label="Keluar dari pelajaran">${I('x')}</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${LESS[L.m].length}" aria-valuenow="${L.i+1}"><i style="width:${(L.i+1)/LESS[L.m].length*100}%"></i></div><button class="iconbtn" data-a="mute" aria-label="Suara">${I(S.mute?'mute':'vol')}</button></div>
<div class="wrap"><p class="sm mut" style="margin-bottom:4px">Modul ${L.m} · Langkah ${L.i+1} dari ${LESS[L.m].length}</p><h2>${st_.h}</h2><div class="row" style="align-items:flex-start"><p style="flex:1">${st_.p}</p><button class="iconbtn" data-a="say" data-t="${esc(st_.p)}" aria-label="Dengarkan petunjuk">${I('vol')}</button></div><div id="lv">${lessonBody(st_)}</div></div>
<div class="foot"><div class="in">${L.i>0?`<button class="btn s" data-a="lprev" style="flex:0 0 auto">Kembali</button>`:''}<button class="btn p" data-a="lnext">${last?'Selesai, mulai latihan':'Lanjut'}${I('next',20)}</button></div></div>`};
ACT.lprev=()=>{L.i--;go('pelajaran')};
ACT.lnext=()=>{if(L.i<LESS[L.m].length-1){L.i++;return go('pelajaran')}const p=pg(L.m);p.lesson=1;S.prog[L.m]=p;touch();save();startQ(L.m,'lat')};
function lessonBody(s){
 const W=n=>`<button class="btn s" data-a="say" data-t="${n}">${n}</button>`;
 switch(s.v){
 case'count':return`<div class="eq"><span id="cnt">0</span></div><div class="vis">${Array.from({length:s.n},(_,i)=>`<button class="itbtn" style="animation-delay:${i*40}ms" aria-label="${K[s.k]} ke-${i+1}">${itm(s.k)}<span class="num"></span></button>`).join('')}</div><div id="sum" class="fb ok" hidden>${bulat('senang',56)}<p><b>Jumlahnya ${s.n} ${K[s.k]}.</b></p></div>`;
 case'add':return`<div class="eq">${s.x} + ${s.y} = <span id="cnt">?</span></div><div class="vis">${[s.x,s.y].map((n,j)=>(j?'<span class="op">+</span>':'')+`<div class="gi grp" style="gap:4px">${Array.from({length:n},()=>`<button class="itbtn">${itm(s.k)}<span class="num"></span></button>`).join('')}</div>`).join('')}</div><div id="sum" class="fb ok" hidden>${bulat('senang',56)}<p><b>${s.x} ditambah ${s.y} sama dengan ${s.x+s.y}.</b></p></div>`;
 case'sub':return`<div class="eq">${s.x} − ${s.y} = <span id="cnt">?</span></div><div class="vis"><div class="grp">${Array.from({length:s.x},()=>`<button class="itbtn">${itm(s.k)}</button>`).join('')}</div></div><p class="mut sm" id="cl">Dicoret: 0 dari ${s.y}</p><div id="sum" class="fb ok" hidden>${bulat('senang',56)}<p><b>${s.x} dikurang ${s.y} sama dengan ${s.x-s.y}.</b></p></div>`;
 case'cmp':return`<div class="vis" style="align-items:flex-start"><div class="grp box"><b>Kiri</b>${grp(s.k,s.l)}<span class="big">${s.l}</span></div><div class="grp box"><b>Kanan</b>${grp(s.k,s.r)}<span class="big">${s.r}</span></div></div><div class="fb ok">${bulat('senang',56)}<p style="flex:1"><b>${s.s}</b></p><button class="iconbtn" data-a="say" data-t="${esc(s.s)}" aria-label="Dengarkan">${I('vol')}</button></div>`;
 case'nums':return`<div class="card" style="text-align:center;margin-bottom:16px"><div class="big" id="nb">${s.a}</div><div id="nw" class="mut">${NW[s.a]}</div><div id="ng" class="vis" style="margin:8px 0 0">${grp('apple',s.a,0,1)}</div></div><div class="nums">${Array.from({length:s.b-s.a+1},(_,i)=>`<button class="btn s ${i?'':'cur'}" data-a="num" data-n="${s.a+i}">${s.a+i}</button>`).join('')}</div>`;
 case'shapes':return`<div class="grid g2">${[['lingkaran','Bulat, tanpa sudut.'],['segitiga','Punya 3 sisi.'],['persegi','4 sisi sama panjang.'],['persegi panjang','4 sisi, 2 panjang dan 2 pendek.']].map(([n,c])=>`<button class="card mod" data-a="say" data-t="${n}. ${c}">${shp(n)}<span class="b"><b>${n[0].toUpperCase()+n.slice(1)}</b><span class="sm mut">${c}</span></span>${I('vol',20)}</button>`).join('')}</div>`;
 case'objs':return`<div class="grid g2">${[['roda','lingkaran'],['atap','segitiga'],['jendela','persegi'],['pintu','persegi panjang']].map(([o,n])=>`<button class="card mod" data-a="say" data-t="${o==='atap'?'Atap rumah':o[0].toUpperCase()+o.slice(1)} berbentuk ${n}">${objs(o,'shp')}<span class="b"><b>${o==='atap'?'Atap rumah':o[0].toUpperCase()+o.slice(1)}</b><span class="sm mut">${n}</span></span>${I('vol',20)}</button>`).join('')}</div>`;
 case'letters':return`<div class="tbl" style="grid-template-columns:repeat(5,1fr)">${s.set.map(c=>`<button class="btn s" data-a="say" data-t="${c}">${c}</button>`).join('')}</div><p class="mut sm" style="margin-top:16px">${s.set[0]==='a'?'Vokal artinya huruf yang bunyinya keluar tanpa tertahan.':'Konsonan dipakai bersama vokal untuk membentuk suku kata.'}</p>`;
 case'syl':return`<div class="tbl">${['b','m','p','s'].map(c=>['a','i','u'].map(v=>`<button class="btn s" data-a="say" data-t="${c+v}">${c+v}</button>`).join('')).join('')}</div>`;
 case'words':return`<div class="col" style="gap:8px">${s.w.map(w=>`<button class="card mod" data-a="say" data-t="${w.join('')}"><span class="b"><b style="font-size:32px">${w.join('')}</b><span class="mut">${w.join(' + ')}</span></span>${I('vol',22)}</button>`).join('')}</div>`;
 default:return`<div class="hero">${bulat('semangat',96)}<p style="margin:0">Latihan nanti akan menyuruhmu menyusun huruf. Ketuk huruf sesuai urutan.</p></div>`}
}
ACT.num=(d,b)=>{const n=+d.n;$$('.nums .btn').forEach(x=>x.classList.toggle('cur',x===b));$('#nb').textContent=n;$('#nw').textContent=NW[n];$('#ng').innerHTML=grp('apple',n,0,1);say(NW[n])};
B.pelajaran=()=>{const s=LESS[L.m][L.i];const bs=$$('.itbtn'),cnt=$('#cnt');let c=0;
 if(s.v==='count'||s.v==='add')bs.forEach(b=>b.onclick=()=>{if(b.classList.contains('on'))return;c++;b.classList.add('on');$('.num',b).textContent=c;cnt.textContent=c;say(NW[c]);if(c===bs.length){$('#sum').hidden=false;sOk();say($('#sum').textContent)}});
 if(s.v==='sub')bs.forEach(b=>b.onclick=()=>{if(b.classList.contains('cut')||c>=s.y)return;c++;b.classList.add('cut');$('#cl').textContent=`Dicoret: ${c} dari ${s.y}`;say(NW[c]);if(c===s.y){cnt.textContent=s.x-s.y;$('#sum').hidden=false;sOk();say($('#sum').textContent)}})};

/* ---------- soal ---------- */
ACT.lat=d=>startQ(+d.m,'lat');ACT.kuis=d=>startQ(+d.m,'kuis');
function prep(q){const c=Object.assign({},q);if(q.opts)c.opts=shuf(q.opts);if(q.t==='build'){let t=shuf(q.tokens);for(let k=0;k<5&&t.join('')===q.a;k++)t=shuf(q.tokens);c.tk=t;c.put=[]}return c}
function startQ(m,kind){const n=kind==='lat'?10:5;P={m,kind,qs:shuf(BANK[m]).slice(0,n).map(prep),i:0,ok:0,done:false};go('soal')}
function opt(o){return typeof o==='string'&&SH[o]?shp(o,'shp')+'<span>'+o+'</span>':`<span>${o}</span>`}
function visHTML(q){const v=q.vis;if(!v)return'';
 if(v.add)return`<div class="vis">${grp(v.add[0].k,v.add[0].n)}<span class="op">+</span>${grp(v.add[1].k,v.add[1].n)}</div>`;
 if(v.cmp)return`<div class="vis" style="align-items:flex-start">${v.cmp.map((g,j)=>`<div class="grp box"><b>${j?'Kanan':'Kiri'}</b>${grp(g.k,g.n)}</div>`).join('')}</div>`;
 if(v.k)return`<div class="vis">${grp(v.k,v.n,v.x||0)}</div>`;
 if(v.obj)return`<div class="vis">${objs(v.obj)}</div>`;
 if(v.shape)return`<div class="vis">${shp(v.shape,'shp l')}</div>`;return''}
V.soal=()=>{const q=P.q=P.qs[P.i];let a='';
 switch(q.t){
 case'pick':case'listen':a=(q.t==='listen'?`<div class="vis"><button class="btn p" data-a="say" data-t="${q.say}">${I('vol',24)}Dengarkan</button></div>`:'')+`<div class="opts" role="group" aria-label="Pilihan jawaban">${q.opts.map((o,i)=>`<button class="opt" data-a="pick" data-i="${i}">${opt(o)}</button>`).join('')}</div>`;break;
 case'fill':a=`<div class="ansbox" id="ab" aria-live="polite"><span id="av">&nbsp;</span></div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn s" data-a="dig" data-n="${n}">${n}</button>`).join('')}<button class="btn s" data-a="digdel" aria-label="Hapus angka">${I('back',28)}</button><button class="btn s" data-a="dig" data-n="0">0</button><span></span></div>`;break;
 case'bin':a=`<div class="pool"><button class="chipd" data-chip="${q.item}" aria-label="Angka atau huruf ${q.item}">${q.item}</button></div><p class="sm mut" style="text-align:center">Seret ke kotak, atau ketuk lalu ketuk kotaknya.</p><div class="vis" style="align-items:stretch">${q.bins.map(b=>`<button class="dz" data-zone="${b.key}" ${b.vis?`aria-label="Keranjang berisi ${b.key}"`:''}>${b.vis?grp(b.vis.k,b.vis.n,0,1):''}<span>${b.label||b.key}</span></button>`).join('')}</div>`;break;
 case'sym':a=`<div class="vis" style="align-items:flex-start">${grp(q.l.k,q.l.n,0,1)}<button class="dz" data-zone="z" id="sz" aria-label="Kotak tanda">?</button>${grp(q.r.k,q.r.n,0,1)}</div><div class="pool">${['>','<','='].map(s=>`<button class="chipd" data-chip="${s}" aria-label="Tanda ${s==='>'?'lebih besar dari':s==='<'?'lebih kecil dari':'sama dengan'}">${s}</button>`).join('')}</div><p class="sm mut" style="text-align:center">Seret tanda ke kotak, atau ketuk tanda lalu kotaknya.</p>`;break;
 case'build':a=`<div class="vis"><button class="btn p" data-a="say" data-t="${q.say}">${I('vol',24)}Dengarkan kata</button></div><div class="slots" id="sl">${q.tokens.map((_,i)=>`<button class="slot" data-a="unput" data-i="${i}" aria-label="Kotak ke-${i+1}"></button>`).join('')}</div><div class="pool" id="tp">${q.tk.map((t,i)=>`<button class="tok" data-a="put" data-i="${i}">${t}</button>`).join('')}</div>`;break}
 const lastQ=P.i===P.qs.length-1;
 return`<div class="top"><button class="iconbtn" data-a="exitq" aria-label="Keluar">${I('x')}</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${P.qs.length}" aria-valuenow="${P.i}"><i style="width:${P.i/P.qs.length*100}%"></i></div><span class="sm" style="min-width:48px;text-align:right">${P.i+1}/${P.qs.length}</span><button class="iconbtn" data-a="mute" aria-label="Suara">${I(S.mute?'mute':'vol')}</button></div>
<div class="wrap"><p class="sm mut" style="margin:0">${P.kind==='lat'?'Latihan':'Kuis akhir'} · Modul ${P.m}</p><h2 class="q" id="qt">${q.q}</h2>${visHTML(q)}${a}<div id="fb" aria-live="polite"></div></div>
<div class="foot"><div class="in"><button class="btn p" id="fn" data-a="cek" ${q.t==='fill'||q.t==='build'?'disabled':'hidden'}>Cek jawaban</button></div></div>`};
ACT.exitq=()=>go('modul',{m:P.m});
let cur='';
B.soal=()=>{const q=P.q;P.done=false;cur='';
 if(q.t==='bin'||q.t==='sym')dnd(q);
 if(q.t==='listen')setTimeout(()=>say(q.say),300);
 if(q.t==='build')setTimeout(()=>say(q.say),300);
 if(q.t==='bin'&&/^[a-z]$/.test(q.item))setTimeout(()=>say(q.item),200)};
function judge(ans){const q=P.q;return q.t==='fill'?Number(ans)===q.a:String(ans)===String(q.a)}
function verdict(ok,mark){if(P.done)return;P.done=true;const q=P.q;if(ok)P.ok++;
 const pd=$('.pad');if(pd)pd.hidden=true;
 const fb=$('#fb');fb.innerHTML=`<div class="fb ${ok?'ok':'no'}">${bulat(ok?'senang':'sedih',64)}<div><p><b>${ok?'Benar.':'Belum tepat.'}</b> ${q.why}${ok?'':' Ayo coba lagi, kamu pasti bisa.'}</p></div></div>`;
 ok?(sOk(),fly($('#fb'))):sNo();say(q.why);
 const s=P.stat=st(P.m);s.all++;if(ok)s.ok++;S.stats[P.m]=s;
 const f=$('#fn'),last=P.i===P.qs.length-1;f.hidden=false;f.disabled=false;f.textContent=last?'Lihat hasil':'Lanjut';f.dataset.a='nextq';f.scrollIntoView({block:'nearest'});$('#fb').scrollIntoView({block:'nearest',behavior:'smooth'})}
ACT.pick=(d,b)=>{if(P.done)return;const q=P.q,o=q.opts[+d.i],ok=judge(o);$$('.opt').forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'no');if(!ok){const c=$$('.opt')[q.opts.findIndex(x=>String(x)===String(q.a))];c&&c.classList.add('ok')}verdict(ok)};
ACT.dig=d=>{if(P.done||cur.length>=2)return;cur+=d.n;$('#av').textContent=cur;$('#fn').disabled=false;$('#fn').hidden=false;say(NW[+cur]||'')};
ACT.digdel=()=>{if(P.done)return;cur=cur.slice(0,-1);$('#av').textContent=cur||' ';$('#fn').disabled=!cur};
ACT.put=(d,b)=>{if(P.done)return;const q=P.q,i=+d.i;if(b.disabled)return;q.put.push(i);b.disabled=true;drawSlots();say(q.tk[i])};
ACT.unput=(d)=>{if(P.done)return;const q=P.q;q.put.splice(+d.i,1);drawSlots()};
function drawSlots(){const q=P.q;$$('#sl .slot').forEach((s,j)=>s.textContent=q.put[j]!==undefined?q.tk[q.put[j]]:'');$$('#tp .tok').forEach((t,i)=>t.disabled=q.put.includes(i));$('#fn').disabled=q.put.length!==q.tokens.length}
ACT.cek=()=>{if(P.done)return;const q=P.q;let ans;if(q.t==='fill')ans=cur;else ans=q.put.map(i=>q.tk[i]).join('');const ok=judge(ans);if(q.t==='fill')$('#ab').classList.add(ok?'ok':'no');else $('#sl').querySelectorAll('.slot').forEach(s=>s.style.borderColor=ok?'var(--c-accent)':'var(--c-main)');if(!ok&&q.t==='fill')$('#av').textContent=cur+' → '+q.a;verdict(ok)};
ACT.nextq=()=>{if(P.i<P.qs.length-1){P.i++;return go('soal')}finishQ()};
function dnd(q){let sel=null;const chips=$$('[data-chip]'),zones=$$('[data-zone]');
 const drop=(c,z)=>{if(P.done)return;const ok=q.t==='bin'?String(z.dataset.zone)===String(q.a):c.dataset.chip===q.a;z.classList.add(ok?'ok':'no');if(q.t==='sym')z.textContent=c.dataset.chip;else if(!ok){const r=zones.find(x=>String(x.dataset.zone)===String(q.a));r&&r.classList.add('ok')}chips.forEach(x=>x.style.visibility=q.t==='bin'?'hidden':x.style.visibility);verdict(ok)};
 chips.forEach(c=>{let sx,sy,mv=false,dr=false;
  c.onpointerdown=e=>{if(P.done)return;sx=e.clientX;sy=e.clientY;mv=false;dr=true;c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!dr)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)mv=true;if(mv){c.classList.add('drag');c.style.transform=`translate(${dx}px,${dy}px)`;c.style.pointerEvents='none';const t=document.elementFromPoint(e.clientX,e.clientY);zones.forEach(z=>z.classList.toggle('hot',z===(t&&t.closest('[data-zone]'))));c.style.pointerEvents=''}};
  c.onpointerup=e=>{if(!dr)return;dr=false;c.classList.remove('drag');if(mv){c.style.pointerEvents='none';const t=document.elementFromPoint(e.clientX,e.clientY);c.style.pointerEvents='';const z=t&&t.closest('[data-zone]');zones.forEach(x=>x.classList.remove('hot'));c.style.transform='';c._mv=true;setTimeout(()=>c._mv=false,50);if(z)drop(c,z)}};
  c.onclick=()=>{if(c._mv||P.done)return;sel=sel===c?null:c;chips.forEach(x=>x.classList.toggle('sel',x===sel))}});
 zones.forEach(z=>z.onclick=()=>{if(P.done)return;const c=sel||(chips.length===1?chips[0]:null);if(c)drop(c,z)})}
function finishQ(){const n=P.qs.length,ok=P.ok;touch();const s=st(P.m);let stars_=0,nw=0;
 if(P.kind==='lat'){s.lat++}else{s.kuis++;stars_=ok===5?3:ok>=3?2:ok>=1?1:0;const p=pg(P.m);nw=stars_>p.stars?1:0;p.stars=Math.max(p.stars,stars_);p.best=Math.max(p.best,ok);S.prog[P.m]=p}
 S.stats[P.m]=s;save();go('hasil',{m:P.m,kind:P.kind,ok,tot:n,stars:stars_})}
V.hasil=()=>{const q=R.kind==='tantang';let t,e;
 if(q){t=`Kamu menjawab ${R.ok} soal dengan benar.`;e=R.ok>=8?'semangat':R.ok>=4?'senang':'normal'}
 else{const k=R.kind==='kuis';const r=R.ok/R.tot;e=r>=.6?'semangat':r>=.3?'senang':'sedih';t=k?(R.stars===3?'Luar biasa, semua benar.':R.stars===2?'Bagus, sedikit lagi sempurna.':R.stars===1?'Terus berlatih. Ayo coba lagi, kamu pasti bisa.':'Belum ada yang benar. Ayo coba lagi, kamu pasti bisa.'):(r>=.8?'Hebat, latihanmu sangat bagus.':r>=.5?'Bagus, terus berlatih.':'Ayo coba lagi, kamu pasti bisa.')}
 const nxt=R.m<8?R.m+1:null;
 return`<div style="max-width:560px;margin:0 auto;padding:48px 16px 24px;text-align:center" class="col">${bulat(e,150)}<div><h1 style="text-align:center">${q?'Waktu habis':R.kind==='kuis'?'Hasil kuis':'Hasil latihan'}</h1><p class="mut" style="margin:0">${q?'':`${R.ok} dari ${R.tot} soal benar. `}${t}</p></div>${R.kind==='kuis'?`<div style="display:flex;justify-content:center">${stars(R.stars,48)}</div>`:''}${q?`<p class="chip" style="align-self:center">Terbaik: ${S.best} benar</p>`:''}
 <div class="col" style="gap:8px">${q?`<button class="btn p full" data-a="tantang">Main lagi</button><button class="btn s full" data-a="tab" data-k="belajar">Kembali</button>`:R.kind==='lat'?`<button class="btn p full" data-a="kuis" data-m="${R.m}">Mulai kuis akhir</button><button class="btn s full" data-a="lat" data-m="${R.m}">Ulangi latihan</button><button class="btn t" data-a="modul" data-m="${R.m}">Kembali ke modul</button>`:`${nxt?`<button class="btn p full" data-a="modul" data-m="${nxt}">Modul berikutnya</button>`:`<button class="btn p full" data-a="tab" data-k="pencapaian">Lihat pencapaian</button>`}<button class="btn s full" data-a="kuis" data-m="${R.m}">Ulangi kuis</button><button class="btn t" data-a="modul" data-m="${R.m}">Kembali ke modul</button>`}</div></div>`};

/* ---------- tantangan 60 detik ---------- */
ACT.tantang=()=>{TC={left:60,score:0,tot:0,q:null};nq();go('tantang')};
function nq(){const x=rnd(1,19),y=rnd(1,20-x),a=x+y;let o=new Set([a]);while(o.size<3){const v=a+rnd(-3,3);if(v>0&&v<=20)o.add(v)}TC.q={x,y,a,o:shuf([...o])}}
V.tantang=()=>`<div class="top"><button class="iconbtn" data-a="tab" data-k="belajar" aria-label="Keluar">${I('x')}</button><span class="tmr" id="tt">${TC.left}</span><span class="sm mut">detik</span><span style="flex:1"></span><span class="chip">${I('check',18)}<span id="ts">${TC.score}</span></span></div><div class="wrap" style="text-align:center"><p class="mut sm">Jawab sebanyak mungkin. Tidak ada pengurangan nilai.</p><div class="eq" style="font-size:40px;margin:32px 0">${TC.q.x} + ${TC.q.y} = ?</div><div class="opts">${TC.q.o.map(o=>`<button class="opt" data-a="tpick" data-v="${o}">${o}</button>`).join('')}</div></div>`;
B.tantang=()=>{if(TC.tm)clearInterval(TC.tm);TC.tm=setInterval(()=>{TC.left--;const t=$('#tt');if(t)t.textContent=TC.left;if(TC.left<=0){clearInterval(TC.tm);S.best=Math.max(S.best,TC.score);touch();save();go('hasil',{kind:'tantang',ok:TC.score})}},1000)};
ACT.tpick=(d,b)=>{if(TC.lock)return;TC.lock=1;const ok=+d.v===TC.q.a;b.classList.add(ok?'ok':'no');ok?(TC.score++,sOk()):sNo();setTimeout(()=>{if(!TC||R.n!=='tantang')return;TC.lock=0;if(TC.left<=0)return;const tm=TC.tm;nq();render();TC.tm=tm},350)};

/* ---------- papan tulis ---------- */
let PEN=1;
V.papan=()=>`<div class="wb"><div class="row"><h2 style="margin:0;flex:1">Papan tulis</h2><button class="btn s" data-a="pen" id="bp">${I('pen',20)}Pena</button><button class="btn s" data-a="eras" id="be">Hapus</button><button class="btn s" data-a="clr">${I('trash',20)}Bersihkan</button><button class="btn p" data-a="tab" data-k="belajar">Selesai</button></div><div class="cvw"><canvas id="cv" aria-label="Area menggambar"></canvas></div></div>`;
ACT.papan=()=>go('papan');ACT.pen=()=>{PEN=1;pb()};ACT.eras=()=>{PEN=0;pb()};
const pb=()=>{$('#bp').style.background=PEN?'var(--tint)':'';$('#be').style.background=PEN?'':'var(--tint)'};
ACT.clr=()=>{const c=$('#cv');c.getContext('2d').clearRect(0,0,c.width,c.height)};
B.papan=()=>{const c=$('#cv'),r=c.getBoundingClientRect(),dp=devicePixelRatio||1;c.width=r.width*dp;c.height=r.height*dp;const x=c.getContext('2d');x.scale(dp,dp);x.lineCap=x.lineJoin='round';let d=false,lx,ly;pb();
 const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);[lx,ly]=pt(e);x.beginPath();x.arc(lx,ly,.5,0,7)};
 c.onpointermove=e=>{if(!d)return;const[px,py]=pt(e);x.globalCompositeOperation=PEN?'source-over':'destination-out';x.strokeStyle='#1F2937';x.lineWidth=PEN?6:28;x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py};
 c.onpointerup=c.onpointercancel=()=>d=false};

/* ---------- pencapaian, profil, orang tua ---------- */
V.pencapaian=()=>{const e=BAD.filter(earned).length;return`<h1>Pencapaian</h1><div class="row" style="flex-wrap:wrap;margin-bottom:16px"><span class="chip">${I('flame',20)}${streak()} hari beruntun</span><span class="chip">${I('award',20)}${e} dari ${BAD.length} lencana</span></div>${e===0?`<div class="card" style="margin-bottom:16px">${bulat('normal',64)}<p style="margin:8px 0 0">Belum ada lencana. Selesaikan kuis akhir modul untuk mendapat bintang dan lencana.</p></div>`:''}<div class="col">${BAD.map(b=>{const on=earned(b),prog=b.m?`${b.m.filter(m=>pg(m).stars>0).length} dari ${b.m.length} modul`:`${Math.min(streak(),3)} dari 3 hari`;return`<div class="card badge ${on?'on':'off'}"><div class="bi">${I(b.i,28)}</div><div><h3 style="margin:0">${b.n}</h3><span class="sm mut">${b.d}</span><br><span class="sm"><b>${on?'Sudah didapat':prog}</b></span></div></div>`}).join('')}</div><h2 style="margin-top:32px">Bintang per modul</h2><div class="col" style="gap:8px">${MODS.map(m=>`<div class="card row"><span class="mno">${m.id}</span><span style="flex:1">${m.t}</span>${stars(pg(m.id).stars,20)}</div>`).join('')}</div>`};
V.profil=()=>`<h1>Profil</h1><div class="col"><div class="card col" style="gap:8px"><div class="row">${bulat('senang',64)}<div><h3 style="margin:0">${esc(S.name)}</h3><span class="sm mut">${MODS.reduce((a,m)=>a+pg(m.id).stars,0)} bintang</span></div></div><label for="nm2" class="sm mut">Ubah nama</label><div class="row"><input id="nm2" class="field" maxlength="16" value="${esc(S.name)}"><button class="btn s" data-a="rename">Simpan</button></div></div>
<button class="card mod" data-a="mute">${I(S.mute?'mute':'vol',28)}<span class="b"><b id="mutechk">${S.mute?'Suara mati':'Suara menyala'}</b><span class="sm mut">Ketuk untuk ${S.mute?'menyalakan':'membisukan'} suara dan bacaan.</span></span></button>
<button class="card mod" data-a="ortuKunci">${I('lock',28)}<span class="b"><b>Mode orang tua dan guru</b><span class="sm mut">Ringkasan nilai dan reset progres.</span></span></button></div>`;
ACT.rename=()=>{const v=$('#nm2').value.trim();if(!v)return;S.name=v;save();go('profil')};
ACT.ortuKunci=()=>{R={n:'ortuKunci',x:rnd(5,9),y:rnd(4,9)};render()};
V.ortuKunci=()=>`<button class="btn t" data-a="tab" data-k="profil">${I('prev',20)}Profil</button><h1>Untuk orang tua dan guru</h1><p>Selesaikan soal ini untuk membuka.</p><div class="eq" style="text-align:left">${R.x} + ${R.y} = ?</div><input id="lk" class="field" inputmode="numeric" maxlength="2" aria-label="Jawaban" style="max-width:200px"><div id="le"></div><div style="margin-top:16px"><button class="btn p" data-a="buka">Buka</button></div>`;
B.ortuKunci=()=>{const i=$('#lk');i.onkeydown=e=>{if(e.key==='Enter')ACT.buka()};i.focus()};
ACT.buka=()=>{if(+$('#lk').value===R.x+R.y)return go('ortu');$('#le').innerHTML='<div class="err">Jawaban belum tepat. Coba lagi.</div>';$('#lk').value=''};
V.ortu=()=>`<button class="btn t" data-a="tab" data-k="profil">${I('prev',20)}Profil</button><h1>Ringkasan ${esc(S.name)}</h1><div class="card" style="overflow-x:auto"><table><thead><tr><th>Modul</th><th>Bintang</th><th>Kuis terbaik</th><th>Latihan</th><th>Akurasi</th></tr></thead><tbody>${MODS.map(m=>{const s=st(m.id),p=pg(m.id);return`<tr><td>${m.id}. ${m.t}</td><td>${p.stars}/3</td><td>${p.stars?p.best+'/5':'-'}</td><td>${s.lat}×</td><td>${s.all?Math.round(s.ok/s.all*100)+'%':'-'}</td></tr>`}).join('')}</tbody></table></div><p class="sm mut" style="margin-top:16px">Hari beruntun: ${streak()} · Tantangan 60 detik terbaik: ${S.best} benar.</p><h2 style="margin-top:24px">Reset progres</h2><p class="mut">Menghapus semua bintang, statistik, dan hari beruntun. Nama tetap tersimpan.</p><div id="rs"><button class="btn s" data-a="rs1">${I('trash',20)}Reset progres</button></div>`;
ACT.rs1=()=>{$('#rs').innerHTML=`<div class="err">Hapus semua progres? Tindakan ini tidak bisa dibatalkan.</div><div class="row"><button class="btn p" data-a="rs2">Ya, reset progres</button><button class="btn s" data-a="ortu2">Batal</button></div>`};
ACT.ortu2=()=>go('ortu');
ACT.rs2=()=>{S.prog={};S.stats={};S.days=[];S.best=0;save();go('ortu')};

/* ---------- mulai ---------- */
window.addEventListener('beforeunload',()=>{if(window.speechSynthesis)speechSynthesis.cancel()});
go(S.onb&&S.name?'home':'onboard');
</script>
</body>
</html>
