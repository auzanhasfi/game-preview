<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Game Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F9F3E5;--card:#FFFDF8;--ink:#1F1A14;--mut:#6B6257;--line:#E6DCC8;--acc:#FD5E2B;--acc-ink:#fff;--chip:#F1E8D4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1813;--card:#25211B;--ink:#F3ECDD;--mut:#A89E8F;--line:#3A342B;--acc:#FF7A4D;--acc-ink:#1B1813;--chip:#302A22}}
:root[data-theme="dark"]{--bg:#1B1813;--card:#25211B;--ink:#F3ECDD;--mut:#A89E8F;--line:#3A342B;--acc:#FF7A4D;--acc-ink:#1B1813;--chip:#302A22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Space Grotesk",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{padding:40px 0 20px}
.eyebrow{font:700 12px/1 "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h1{font-size:clamp(30px,5vw,48px);line-height:1.05;margin:10px 0 8px;letter-spacing:-.02em}
.lead{color:var(--mut);margin:0;max-width:560px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search svg{flex:none;color:var(--mut)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;outline:none;height:100%}
.search:focus-within{border-color:var(--acc)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px "Space Grotesk",sans-serif;border-radius:999px;padding:9px 14px;cursor:pointer}
.tab span{font:12px "Space Mono",monospace;color:var(--mut);margin-left:4px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-pressed="true"] span{color:inherit;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:24px 0 40px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--acc)}
.card:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.thumb{position:relative;aspect-ratio:8/5;background:var(--chip);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.kat{position:absolute;left:10px;top:10px;font:700 11px/1 "Space Mono",monospace;letter-spacing:.06em;text-transform:uppercase;background:var(--card);color:var(--ink);padding:6px 8px;border-radius:6px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{font-size:18px;line-height:1.25;margin:0}
.topik{color:var(--mut);font-size:14px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.chip{font-size:12px;background:var(--chip);border-radius:6px;padding:4px 8px;color:var(--mut)}
.empty{padding:40px 0;text-align:center;color:var(--mut)}
footer{border-top:1px solid var(--line);padding:20px 0 32px;color:var(--mut);font-size:13px}
@media (max-width:600px){header{padding:28px 0 14px}.grid{grid-template-columns:1fr 1fr;gap:12px}.body{padding:10px 12px 12px}.body h2{font-size:15px}.topik{display:none}.play{width:32px;height:32px}.chip:nth-child(n+2){display:none}}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

  <header>
    <div class="eyebrow">Game Preview</div>

  <main class="grid" id="grid"></main>

</div>

var S = {kat:'semua', q:''};
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var KAT = [['semua','Semua']].concat(DATA.kat).filter(function(k){return k[0]==='semua'||DATA.items.some(function(i){return i.kat===k[0]})});
var NAMA = {}; KAT.forEach(function(k){NAMA[k[0]]=k[1]});
var nGame = DATA.items.filter(function(i){return i.kat!=='app'}).length, nApp = DATA.items.length-nGame;
document.getElementById('lead').textContent = nGame+' game edukasi dan '+nApp+' app yang bisa langsung dimainkan. Pilih satu, lalu tekan Main.';
function tabs(){
  document.getElementById('tabs').innerHTML = KAT.map(function(k){
    var n = k[0]==='semua'?DATA.items.length:DATA.items.filter(function(i){return i.kat===k[0]}).length;
    return '<button class="tab" data-k="'+k[0]+'" aria-pressed="'+(S.kat===k[0])+'">'+esc(k[1])+'<span>'+n+'</span></button>';
  }).join('');
}
function grid(){
  var q = S.q.toLowerCase().trim();
  var list = DATA.items.filter(function(i){
    if(S.kat!=='semua'&&i.kat!==S.kat)return false;
    return !q || (i.n+' '+i.mapel+' '+i.jenjang+' '+i.topik).toLowerCase().indexOf(q)>=0;
  });
  document.getElementById('grid').innerHTML = list.length ? list.map(function(i){
    return '<a class="card" href="'+i.path+'"><div class="thumb"><img src="'+i.img+'" alt="" loading="lazy" width="800" height="500">'+
      '<span class="kat">'+esc(NAMA[i.kat]||i.kat)+'</span>'+
      '<span class="play" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></div>'+
      '<div class="body"><h2>'+esc(i.n)+'</h2><p class="topik">'+esc(i.topik)+'</p>'+
      '<div class="chips"><span class="chip">'+esc(i.mapel)+'</span><span class="chip">'+esc(i.jenjang)+'</span></div></div></a>';
  }).join('') : '<p class="empty">Tidak ada yang cocok. Coba kata lain.</p>';
}
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;S.kat=b.dataset.k;tabs();grid()});
document.getElementById('q').addEventListener('input',function(e){S.q=e.target.value;grid()});
tabs(); grid();
</script>
</body>
