<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Katak Metamorfosis</title><link rel="stylesheet" href="../_kit/edu.css">
<style>body{background:#0e2a1a;display:grid;place-items:center}#cv{margin-top:52px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);touch-action:none}</style></head><body>
<canvas id="cv"></canvas>
<div class="edu-pad touch" style="left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,62px);gap:6px"><span></span><button data-d="0">▲</button><span></span><button data-d="3">◀</button><button data-d="2">▼</button><button data-d="1">▶</button></div>
<script src="../_kit/edu.js"></script>
<script>
/* Katak Metamorfosis: terinspirasi Frogger (he-is-talha/html-css-javascript-games, MIT). Kode ditulis ulang. */
var CYC=[{n:'katak',s:['Telur','Berudu','Berudu berkaki','Katak muda','Katak dewasa']},{n:'kupu-kupu',s:['Telur','Ulat','Kepompong','Kupu-kupu']},{n:'nyamuk',s:['Telur','Jentik','Pupa','Nyamuk']},{n:'ayam',s:['Telur','Anak ayam','Ayam muda','Ayam dewasa']}];
var C=13,RW=13,CS,cv=EDU.$('#cv'),x=cv.getContext('2d');
var HOMES=[1,4,8,11];
var G={};
EDU.hud({title:'Katak Metamorfosis',lives:true,credit:'Terinspirasi Frogger · he-is-talha (MIT)'});
function size(){CS=Math.floor(Math.min((innerWidth-16)/C,(innerHeight-130)/RW));cv.width=CS*C;cv.height=CS*RW}size();addEventListener('resize',size);
/* baris: 0 rumah, 1-5 sungai, 6 tepi, 7-11 jalan, 12 start */
function mkRows(){var R=[];for(var r=1;r<=5;r++){var dir=r%2?1:-1,sp=(.9+r*.18)*dir,len=r===3?3:4,items=[];var gap=len+2+(r%2);for(var k=-2;k<C+4;k+=gap)items.push({x:k,len:r===2||r===4?3:len,turtle:r===2||r===4});R[r]={type:'river',dir:dir,sp:sp,items:items}}
  var cars=[['#e63946',1],['#ffbe0b',1],['#3a86ff',2],['#8338ec',1],['#fb5607',3]];
  for(r=7;r<=11;r++){var c=cars[r-7],dir2=r%2?-1:1,items2=[],g=c[1]+4+(r%2);for(k=0;k<C+4;k+=g)items2.push({x:k,len:c[1],col:c[0]});R[r]={type:'road',dir:dir2,sp:(1.2+(r-7)*.35)*dir2,items:items2}}
  return R}
function newQ(){var cy=EDU.pick(CYC),i=EDU.rand(0,cy.s.length-2);G.cy=cy;G.i=i;var ans=cy.s[i+1];var pool=[];CYC.forEach(function(c){c.s.forEach(function(s){if(s!==ans&&s!==cy.s[i]&&pool.indexOf(s)<0)pool.push(s)})});
  var opts=EDU.shuffle([ans].concat(EDU.shuffle(pool).slice(0,3)));G.homes=HOMES.map(function(c,k){return {c:c,t:opts[k],ok:opts[k]===ans,fill:false}});
  EDU.setQ('Daur hidup '+cy.n+': '+cy.s[i]+' → ?')}
function resetFrog(){G.f={c:6,r:12,fx:6,hop:0,dir:0}}
function start(){G={rows:mkRows(),score:0,lives:3,run:true,benar:0,salah:0,t:0,best:12,inv:0};resetFrog();newQ();EDU.setScore(0);EDU.setLives(3)}
function move(d){if(!G.run||G.f.hop>0)return;var f=G.f,nc=Math.round(f.fx)+[0,1,0,-1][d],nr=f.r+[-1,0,1,0][d];if(nc<0||nc>=C||nr>12)return;
  f.dir=d;f.fromC=f.fx;f.fromR=f.r;f.c=nc;f.r=nr;f.hop=1;EDU.sfx('pop');if(nr<G.best){G.best=nr;G.score+=1;EDU.setScore(G.score)}}
function die(m){if(G.f.dead)return;G.f.dead=true;G.lives--;EDU.setLives(G.lives);EDU.sfx('bad');EDU.toast(m,false);
  setTimeout(function(){if(G.lives<=0){G.run=false;EDU.end({key:'katak',score:G.score,benar:G.benar,salah:G.salah,max:300,head:'Katak kelelahan'},start)}else{resetFrog();G.best=12}},700)}
function update(dt){var f=G.f;G.t+=dt;
  G.rows.forEach(function(R){if(!R)return;R.items.forEach(function(it){it.x+=R.sp*dt;if(R.dir>0&&it.x>C+1)it.x-=C+5;if(R.dir<0&&it.x+it.len<-1)it.x+=C+5})});
  if(f.dead)return;
  if(f.hop>0){f.hop=Math.max(0,f.hop-dt/.13);f.fx=f.c+(f.fromC-f.c)*f.hop;if(f.hop>0)return;f.fx=f.c;land()}
  var R=G.rows[f.r];
  if(R&&R.type==='river'){var on=R.items.find(function(it){return f.fx+.5>it.x+.15&&f.fx+.5<it.x+it.len-.15&&!(it.turtle&&Math.sin(G.t*1.6+it.x)>.85)});if(!on)return die('Tercebur! Naik ke kayu atau kura-kura.');f.fx+=R.sp*dt;f.c=Math.round(f.fx);if(f.fx<-.4||f.fx>C-.6)die('Hanyut terbawa arus!')}
  if(R&&R.type==='road'){if(R.items.some(function(it){return f.fx+.8>it.x&&f.fx+.2<it.x+it.len}))die('Awas mobil!')}
  if(EDU.demo&&!f.dead)demo();
}
function land(){var f=G.f;if(f.r===0){var h=G.homes.find(function(h){return Math.abs(h.c-f.fx)<.8});if(!h)return die('Bukan rumah. Pilih teratai berlabel.');
  if(h.ok){h.fill=true;G.score+=50;G.benar++;EDU.setScore(G.score);EDU.sfx('ok');EDU.toast('✔ '+G.cy.s[G.i]+' → '+h.t,true);setTimeout(function(){newQ();resetFrog();G.best=12},700);f.dead=true;setTimeout(function(){f.dead=false},700)}
  else{G.salah++;die('✘ Setelah '+G.cy.s[G.i]+' adalah '+G.cy.s[G.i+1])}}}
/* demo: cek posisi mobil/kayu beberapa saat ke depan sebelum melompat */
function okAt(r,c,t0,t1){var R=G.rows[r];if(r===12||r===6||!R)return true;if(r===0)return false;
  for(var t=t0;t<=t1;t+=.05){var hit=R.items.some(function(it){var ix=it.x+R.sp*t;if(R.type==='road')return c+.95>ix&&c+.05<ix+it.len;return c+.5>ix+.35&&c+.5<ix+it.len-.35&&!(it.turtle&&Math.sin((G.t+t)*1.6+ix)>.8)});
    if(R.type==='road'&&hit)return false;if(R.type==='river'&&!hit)return false}return true}
function demo(){var f=G.f;if(f.hop>0)return;var tgt=G.homes.find(function(h){return h.ok}).c,c=Math.round(f.fx),R=G.rows[f.r];
  if(f.r===1){if(Math.abs(f.fx-tgt)<.35)return move(0);var d=tgt>f.fx?1:3,nc=c+(d===1?1:-1);if(okAt(1,nc,.1,.5)&&Math.abs(nc-tgt)<Math.abs(c-tgt))return move(d);return}
  var here=okAt(f.r,c,0,.35);
  if(f.r===2){/* tunggu baris atas membawa kayu dekat rumah */var R1=G.rows[1];var tt=(tgt-f.fx)/(R1.sp-(R?R.sp:0));if(okAt(1,c,.1,.6))return move(0)}
  else if(okAt(f.r-1,c,.1,.55))return move(0);
  if((f.r===12||f.r===6)&&Math.abs(c-tgt)>0&&okAt(f.r-1,c,.1,.55)===false){var d2=c<tgt?1:3;return move(d2)}
  if(!here){if(okAt(f.r+1,c,.1,.4)&&f.r<12)return move(2);if(okAt(f.r,c+1,.1,.4)&&c<C-1)return move(1);if(okAt(f.r,c-1,.1,.4)&&c>0)return move(3)}
  if(R&&R.type==='river'&&(f.fx<1||f.fx>C-2)){var d3=f.fx<1?1:3;if(okAt(f.r,c+(d3===1?1:-1),.1,.4))move(d3)}}
function draw(){
  x.fillStyle='#0b4f8a';x.fillRect(0,CS,cv.width,CS*5);
  for(var i=0;i<30;i++){x.fillStyle='rgba(255,255,255,.08)';x.fillRect(((i*97+G.t*20)%(cv.width+40))-20,CS+(i*37%(CS*5)),CS*.6,2)}
  x.fillStyle='#1f7a3a';x.fillRect(0,0,cv.width,CS);x.fillStyle='#6a4bc4';x.fillRect(0,CS*6,cv.width,CS);x.fillRect(0,CS*12,cv.width,CS);
  x.fillStyle='#2b2d42';x.fillRect(0,CS*7,cv.width,CS*5);x.fillStyle='rgba(255,255,255,.35)';for(var r=8;r<=11;r++)for(var k=0;k<C;k+=2)x.fillRect(k*CS+CS*.2,r*CS-1,CS*.6,2);
  for(var k2=0;k2<C;k2++){x.fillStyle='rgba(255,255,255,.07)';x.fillRect(k2*CS,CS*6,1,CS);x.fillRect(k2*CS,CS*12,1,CS)}
  G.homes&&G.homes.forEach(function(h){var hx=(h.c+.5)*CS,hy=CS*.5;x.fillStyle='#0b4f8a';x.fillRect(h.c*CS-CS*.15,0,CS*1.3,CS);x.fillStyle=h.fill?'#7bd88f':'#3fae5a';x.beginPath();x.arc(hx,hy+2,CS*.42,.35,Math.PI*2-.35+.35);x.lineTo(hx,hy+2);x.fill();
    x.font='700 '+Math.round(CS*.3)+'px Space Grotesk';var w=x.measureText(h.t).width+10;x.fillStyle='rgba(255,250,240,.96)';x.beginPath();x.roundRect(hx-w/2,CS*1.02,w,CS*.42,6);x.fill();x.fillStyle='#1d3b23';x.textAlign='center';x.textBaseline='middle';x.fillText(h.t,hx,CS*1.24)});
  G.rows&&G.rows.forEach(function(R,r){if(!R)return;R.items.forEach(function(it){var X=it.x*CS,Y=r*CS;
    if(R.type==='river'){if(it.turtle){var sink=Math.sin(G.t*1.6+it.x)>.85;for(var j=0;j<it.len;j++){x.fillStyle=sink?'rgba(46,125,50,.35)':'#2e7d32';x.beginPath();x.ellipse(X+(j+.5)*CS,Y+CS*.5,CS*.4,CS*.34,0,0,7);x.fill();x.fillStyle=sink?'rgba(0,0,0,0)':'#66bb6a';x.beginPath();x.ellipse(X+(j+.5)*CS,Y+CS*.5,CS*.25,CS*.2,0,0,7);x.fill()}}
      else{x.fillStyle='#8d5a2b';x.beginPath();x.roundRect(X+2,Y+CS*.18,it.len*CS-4,CS*.64,CS*.3);x.fill();x.fillStyle='#a8713a';x.fillRect(X+CS*.3,Y+CS*.32,it.len*CS-CS*.6,CS*.08);x.fillRect(X+CS*.5,Y+CS*.55,it.len*CS-CS,CS*.06)}}
    else{x.fillStyle=it.col;x.beginPath();x.roundRect(X+3,Y+CS*.16,it.len*CS-6,CS*.68,6);x.fill();x.fillStyle='rgba(255,255,255,.7)';x.fillRect(X+(R.dir>0?it.len*CS-CS*.45:CS*.15),Y+CS*.26,CS*.3,CS*.48);x.fillStyle='#111';x.fillRect(X+CS*.2,Y+CS*.08,CS*.3,CS*.1);x.fillRect(X+it.len*CS-CS*.5,Y+CS*.08,CS*.3,CS*.1);x.fillRect(X+CS*.2,Y+CS*.82,CS*.3,CS*.1);x.fillRect(X+it.len*CS-CS*.5,Y+CS*.82,CS*.3,CS*.1)}})});
  if(G.f&&!G.f.dead){var f=G.f,fy=(f.hop>0?f.r+(f.fromR-f.r)*f.hop:f.r),px=(f.fx+.5)*CS,py=(fy+.5)*CS,s=1+(f.hop>0?Math.sin(f.hop*Math.PI)*.25:0);
    x.save();x.translate(px,py);x.rotate([0,Math.PI/2,Math.PI,-Math.PI/2][f.dir]);x.scale(s,s);x.fillStyle='#7ed957';x.beginPath();x.ellipse(0,0,CS*.32,CS*.36,0,0,7);x.fill();
    x.fillStyle='#4caf50';x.fillRect(-CS*.42,CS*.05,CS*.18,CS*.28);x.fillRect(CS*.24,CS*.05,CS*.18,CS*.28);x.fillRect(-CS*.38,-CS*.3,CS*.14,CS*.2);x.fillRect(CS*.24,-CS*.3,CS*.14,CS*.2);
    x.fillStyle='#fff';x.beginPath();x.arc(-CS*.13,-CS*.22,CS*.1,0,7);x.arc(CS*.13,-CS*.22,CS*.1,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(-CS*.13,-CS*.24,CS*.05,0,7);x.arc(CS*.13,-CS*.24,CS*.05,0,7);x.fill();x.restore()}
}
var last=0;function loop(t){var dt=Math.min(.05,(t-last)/1000);last=t;if(G.run)update(dt);if(G.rows)draw();requestAnimationFrame(loop)}
document.addEventListener('keydown',function(e){var d={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3}[e.key];if(d!=null){e.preventDefault();move(d)}});
document.querySelectorAll('.edu-pad button').forEach(function(b){b.addEventListener('pointerdown',function(e){e.preventDefault();move(+b.dataset.d)})});
requestAnimationFrame(loop);window.__G=function(){return G};
EDU.title({key:'katak',title:'Katak Metamorfosis',mapel:'IPA · Daur hidup hewan · SD Kelas 3–6',desc:'Antar katak ke teratai yang berisi TAHAP BERIKUTNYA dari daur hidup hewan.',how:['Panah / tombol layar untuk melompat.','Seberangi jalan, lalu naik kayu dan kura-kura di sungai.','Masuk ke teratai dengan jawaban benar: +50.']},start);
</script></body></html>
