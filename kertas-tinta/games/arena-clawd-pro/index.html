<style>

  :root {

<main>
  <section id="menu" class="card" aria-labelledby="ttl">
    <div class="brand">
      <canvas id="heroCv" width="220" height="220" aria-hidden="true"></canvas>
      <div>
        <p class="tag" id="mTag"></p>
        <h1 id="ttl">Arena Clawd <span class="pro">PRO</span></h1>
        <p id="mIntro"></p>
        <p class="note" id="mNote"></p>
      </div>
    </div>
    <div class="topbar">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="seg lang" role="group" aria-label="Bahasa"><button data-lang="id" data-uji="lang-id">Indonesia</button><button data-lang="ms" data-uji="lang-ms">Melayu</button></div>
    </div>
    <div id="tabMain" style="display:flex;flex-direction:column;gap:18px"></div>
    <div id="tabBelajar" hidden></div>
    <div id="tabLatihan" hidden></div>
    <div id="tabKemajuan" hidden></div>

  <section id="game" hidden aria-label="Permainan">
    <div class="stage">
      <canvas id="cv" aria-label="Arena 3 lorong"></canvas>
      <div class="top-btns">
        <button id="bPause" data-uji="jeda" aria-label="Jeda">⏸</button>

      </div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <p class="hint" id="hint"></p>
  </section>
</main>

<div class="sheet" id="sheet" hidden><div class="paper" id="paper" role="dialog" aria-modal="true"></div></div>
