<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bola Hamster Clawd</title>
<meta name="description" content="Game bola hamster matematik: Clawd bergolek di dalam bola lutsinar melalui 4 trek terapung dan menjawab soalan matematik asas. Bahasa Melayu dan English.">
<meta name="theme-color" content="#efebe2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;700&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Geist:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<main>
  <section id="menu" class="card" aria-labelledby="ttl">
    <div class="topbar">
      <span class="tag" data-t="tagline"></span>
      <div class="lang" role="group" aria-label="Bahasa / Language">
        <button type="button" data-lang="ms">BM</button><button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <div class="brand">
      <canvas id="heroPrev" width="600" height="400" aria-hidden="true"></canvas>
      <div>
        <h1 id="ttl"><span data-t="title1"></span> <u data-t="title2"></u></h1>
        <p data-t="intro"></p>
        <ul class="feat">
          <li><i data-ic="roll"></i><span data-t="f1"></span></li>
          <li><i data-ic="gate"></i><span data-t="f2"></span></li>
          <li><i data-ic="seed"></i><span data-t="f3"></span></li>
        </ul>
      </div>
    </div>
    <ol class="tracks" id="tracks" aria-label="Trek"></ol>
    <div class="levels" role="group" aria-label="Tahap">
      <button type="button" class="lv" data-d="mudah"><b data-t="lv1"></b><small data-t="lv1d"></small><span class="best" id="b-mudah"></span></button>
      <button type="button" class="lv" data-d="sederhana"><b data-t="lv2"></b><small data-t="lv2d"></small><span class="best" id="b-sederhana"></span></button>
      <button type="button" class="lv" data-d="mencabar"><b data-t="lv3"></b><small data-t="lv3d"></small><span class="best" id="b-mencabar"></span></button>
    </div>
    <p class="note" data-t="menuNote"></p>
  </section>

  <section id="game" hidden aria-label="Permainan">
    <div class="card play">
      <div class="hud" aria-live="off">
        <span id="hTr"></span>
        <span class="hearts" id="hH"></span>
        <span><i data-ic="seed"></i><b id="hSeed">0</b></span>
        <span><i data-ic="clock"></i><b id="hTime">0:00</b></span>
        <span><b id="hScore">0</b></span>
      </div>
      <div id="qbar" role="status" aria-live="polite"><p id="qText" class="goal"></p><div id="qOpts"></div></div>
      <div class="stage" id="stage">
        <canvas id="cv" width="960" height="540" role="img" aria-label="Trek bola hamster"></canvas>
        <div class="ccard" id="ccard" hidden role="dialog" aria-labelledby="cTitle">
          <span class="tag" id="cTag"></span>
          <h2 id="cTitle"></h2>
          <p id="cFact"></p>
          <p class="goal" id="cGoal"></p>
          <button type="button" class="primary" id="cGo"></button>
        </div>
        <div class="toast" id="toast" hidden></div>
        <div class="hint" id="hint" hidden></div>
      </div>
      <div class="tools">
        <span class="muted keys" data-t="keys"></span>
        <span class="btns">
          <button type="button" id="bSnd" class="ib"><i data-ic="sound"></i><span data-t="soundOn"></span></button>
          <button type="button" id="bQuit" class="ib"><i data-ic="home"></i><span data-t="quit"></span></button>
        </span>
      </div>
    </div>
  </section>

  <section id="end" class="card" hidden aria-labelledby="eh">
    <span class="tag" id="eTag"></span>
    <h2 id="eh"></h2>
    <div class="stars" id="eStars"></div>
    <p id="eMsg"></p>
    <div class="stats">
      <div><b id="eScore">0</b><span data-t="score"></span></div>
      <div><b id="eOk">0</b><span data-t="firstTry"></span></div>
      <div><b id="eSeed">0</b><span data-t="seeds"></span></div>
      <div><b id="eTime">0:00</b><span data-t="time"></span></div>
    </div>
    <div class="recap"><b data-t="recapT"></b><div id="eRecap"></div></div>
    <p class="muted" id="eBest"></p>
    <div class="row">
      <button type="button" class="primary" id="bAgain"></button>
      <button type="button" id="bRetry" hidden></button>
      <button type="button" id="bMenu"></button>
    </div>
  </section>
</main>

<script src="js/01-teks.js"></script>
<script src="js/02-ikon.js"></script>
<script src="js/03-util.js"></script>
<script src="js/04-bunyi.js"></script>
<script src="js/05-soal.js"></script>
<script src="js/06-trek.js"></script>
<script src="js/07-fizik.js"></script>
<script src="js/08-lukis.js"></script>
<script src="js/09-hud.js"></script>
<script src="js/10-kawalan.js"></script>
<script src="js/99-main.js"></script>
</body>
</html>
