  function refreshSel() { seedEls.forEach(function (b, i) { b.classList.toggle('pilih', G.sel === G.seeds[i].type); }); $('bSekop').classList.toggle('pilih', G.sel === 'sekop'); }
  function hud() {
    if (!G.seeds) return; if ($('nSun').textContent !== String(G.sun)) $('nSun').textContent = G.sun;
    seedEls.forEach(function (b, i) { var s = G.seeds[i], P = PLANTS[s.type]; b.classList.toggle('mahal', G.sun < P.cost); b.querySelector('.cd').style.height = (s.cdLeft > 0 ? s.cdLeft / P.cd * 100 : 0) + '%'; });
  }

  /* ---------- input ---------- */
  var drag = null;
  function cellAt(e) { var r = lrect(cv), q = lp(e.clientX, e.clientY), px = q.x - r.left, py = q.y - r.top; if (px < 0 || py < 0 || px > r.width || py > r.height) return null; var c = Math.floor((px - LX) / C), rr = Math.floor((py - LY) / C); return { c: c, r: rr, px: px, py: py, ok: c >= 0 && c < 9 && rr >= 0 && rr < 5 }; }
  function trySun(px, py) {
    var best = null, bd = C * 0.55; suns.forEach(function (s) { if (s.fly) return; var d = Math.hypot(SX(s.x) - px, SY(s.y) - py); if (d < bd) { bd = d; best = s; } });
    if (best) { collectSun(best); return true; } return false;
  }
  function act(cell) {
    if (!cell || !cell.ok || !G.sel) return;
    if (G.sel === 'sekop') { var p = plantAt(cell.r, cell.c); if (p) { removePlant(p); sfx('cabut'); for (var i = 0; i < 8; i++) parts.push(part(SX(cell.c + 0.5), rowY(cell.r), '#8f6a3f', 150)); } G.sel = null; refreshSel(); return; }
    var s = G.seeds.filter(function (x) { return x.type === G.sel; })[0], P = PLANTS[G.sel];
    if (plantAt(cell.r, cell.c)) { sfx('kurang'); return; }
    if (G.sun < P.cost || s.cdLeft > 0) { sfx('kurang'); return; }
    G.sun -= P.cost; s.cdLeft = P.cd; addPlant(G.sel, cell.r, cell.c); sfx('tanam'); for (var j = 0; j < 10; j++) parts.push(part(SX(cell.c + 0.5), rowY(cell.r), j % 2 ? '#8f6a3f' : '#6e5232', 140));
    G.sel = null; G.ghost = null; refreshSel();
  }
  cv.addEventListener('pointerdown', function (e) {
    audio(); var cell = cellAt(e); if (!cell) return;
    if (G.reward && G.state === 'menang') { return; }
    if (G.state !== 'main') return;
    if (trySun(cell.px, cell.py)) return;
    if (G.sel) { act(cell); }
  });
  window.addEventListener('pointermove', function (e) {
    if (G.state !== 'main') return; var cell = cellAt(e);
    if (drag && cell) drag.moved = true;
    G.ghost = cell && cell.ok && G.sel ? cell : null;
  });
  window.addEventListener('pointerup', function (e) { if (drag && drag.moved && G.sel) { var cell = cellAt(e); if (cell && cell.ok) act(cell); } drag = null; if (e.pointerType !== 'mouse') G.ghost = null; });
  window.addEventListener('keydown', function (e) {
    if (G.state !== 'main') return; var n = parseInt(e.key, 10);
    if (n >= 1 && n <= G.seeds.length) selectSeed(n - 1);
    if (e.key === 's' || e.key === 'S') { G.sel = G.sel === 'sekop' ? null : 'sekop'; refreshSel(); }
    if (e.key === 'Escape') { G.sel = null; refreshSel(); }
    if (e.key === 'p' || e.key === 'P') pause(true);
  });
  $('bSekop').addEventListener('click', function () { if (G.state !== 'main') return; audio(); G.sel = G.sel === 'sekop' ? null : 'sekop'; sfx('pilih'); refreshSel(); });

  /* ---------- aliran ---------- */
  var save = { level: 1 }; try { var sv = JSON.parse(localStorage.getItem('clawd-vs-zombi') || 'null'); if (sv && sv.level) save = sv; } catch (e) {}
  function persist() { try { localStorage.setItem('clawd-vs-zombi', JSON.stringify(save)); } catch (e) {} }
  G.pick = Math.min(LEVELS.length - 1, save.level - 1);
  function start(li) {
    audio(); musicStop(); newLevel(li); G.state = 'siap'; G.cdT = 3; G.rewardShown = false;
    show('menu', false); show('hasil', false); show('jeda', false); qLock = 0; $('mK').hidden = true;
    buildSeeds(); refreshSel(); bumpSun(); newQ(); banner(tx().siap, null, INK, 1); sfx('siap');
  }
  function pause(on) { if (on && G.state === 'main') { G.state = 'jeda'; show('jeda', true); musicStop(); } else if (!on && G.state === 'jeda') { G.state = 'main'; show('jeda', false); musicStart(); last = performance.now(); } }
  function toMenu() { musicStop(); show('hasil', false); show('jeda', false); G.state = 'menu'; newLevel(G.pick); G.preview = null; buildSeeds(); show('menu', true); refreshMenu(); }
  function showResult(won) {
    G.rewardShown = true; var L = LEVELS[G.level], rk = L.reward;
    $('rTag').textContent = won ? tx().menangTag : tx().kalahTag; $('rJudul').textContent = won ? tx().menang : tx().kalah; $('rJudul').style.color = won ? '#3f6b22' : '#b4553a';
    var hc = $('hadiahCv'); ctx = hc.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 280, 350);
    if (won) { if (rk === 'piala') { trophy(140, 190, 230); $('rHadiah').textContent = tx().piala; } else { packet(rk, 40, 20, 200, 250); $('rHadiah').textContent = tx().baru + 'Clawd ' + tx().p[rk] + '!'; } }
    else { drawZombie({ id: 3, type: 'biasa', armor: 0, walk: G.t, arm: true, arm2: true, flash: 0, slowT: 0, eating: true, chompT: 0 }, 150, 300, 260); $('rHadiah').textContent = ''; }
    $('rBenar').textContent = G.benar + '/' + (G.benar + G.salah); $('rSun').textContent = '+' + G.sunSoal; $('rZombi').textContent = G.kills;
    var hasNext = won && G.level < LEVELS.length - 1; $('bNext').textContent = won ? (hasNext ? tx().next : tx().ulangi) : tx().coba;
    G.nextLevel = won ? (hasNext ? G.level + 1 : G.level) : G.level; if (won && hasNext) G.pick = G.level + 1;
    show('hasil', true);
  }
  $('bMula').addEventListener('click', function () { start(G.pick); });
  $('bNext').addEventListener('click', function () { start(G.nextLevel); });
  $('bMenu').addEventListener('click', toMenu); $('bKeMenu').addEventListener('click', toMenu);
  $('bJeda').addEventListener('click', function () { pause(G.state === 'main'); }); $('bLanjut').addEventListener('click', function () { pause(false); });
  $('bUlang').addEventListener('click', function () { start(G.level); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(true); });
  window.addEventListener('resize', resize);

  /* ---------- menu ---------- */
  function applyLang() {
    document.documentElement.lang = G.lang === 'ms' ? 'ms' : 'id';
    document.querySelectorAll('[data-t]').forEach(function (el) { var v = tx()[el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
    $('how').innerHTML = tx().cara.map(function (c) { return '<div><b>' + c[0] + '</b><span>' + c[1] + '</span></div>'; }).join('');
    $('mPutar').textContent = tx().putar; refreshMenu(); if (G.seeds) buildSeeds();
  }
  function refreshMenu() {
    var box = $('levels'); box.innerHTML = '';
    LEVELS.forEach(function (L, i) { var b = document.createElement('button'); b.dataset.uji = 'level' + (i + 1); b.innerHTML = '<span>' + tx().hari + '</span><b>' + (i + 1) + '</b>'; b.disabled = i >= save.level; b.setAttribute('aria-pressed', String(G.pick === i)); b.addEventListener('click', function () { G.pick = i; audio(); sfx('pilih'); refreshMenu(); }); box.appendChild(b); });
    var unl = {}; LEVELS.slice(0, Math.min(LEVELS.length, save.level)).forEach(function (L) { L.plants.forEach(function (p) { unl[p] = 1; }); });
    var kol = $('koleksi'); kol.innerHTML = ''; ORDER.forEach(function (p) { var d = document.createElement('div'); if (!unl[p]) d.className = 'kunci'; var c = document.createElement('canvas'); c.width = 160; c.height = 200; c.getContext('2d').drawImage(seedArt(p), 0, 0); d.appendChild(c); d.appendChild(document.createTextNode(tx().p[p])); kol.appendChild(d); });
    document.querySelectorAll('[data-lvl]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lvl === G.lvl)); });
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === G.lang)); });
  }
  document.querySelectorAll('[data-lvl]').forEach(function (b) { b.addEventListener('click', function () { G.lvl = b.dataset.lvl; audio(); sfx('pilih'); refreshMenu(); }); });
  document.querySelectorAll('[data-lang]').forEach(function (b) { b.addEventListener('click', function () { G.lang = b.dataset.lang; try { localStorage.setItem('clawd-vs-zombi-bahasa', G.lang); } catch (e) {} audio(); sfx('pilih'); applyLang(); }); });
  function drawLogo() {
    ctx = $('logoCv').getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#d8e7b3'; ctx.fillRect(0, 0, 260, 260); ctx.fillStyle = '#c8da9f'; ctx.fillRect(0, 130, 260, 130);
    sunShape(60, 52, 22, G.t * 0.6, true);
    drawPlant('penembak', 70, 215, 120, { t: G.t, shoot: Math.max(0, Math.sin(G.t * 3)) });
    var zx = 200 - (G.t * 8) % 30; drawZombie({ id: 2, type: 'kon', armor: 370, walk: G.t, arm: true, arm2: true, flash: 0, slowT: 0 }, zx, 228, 120);
    var px = 120 + ((G.t * 120) % 70); if (px < zx - 30) { ctx.beginPath(); ctx.arc(px, 160, 6, 0, 6.3); ctx.fillStyle = INK; ctx.fill(); }
  }
  function drawSunIcon() { ctx = $('sunIco').getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 68, 68); sunShape(34, 34, 20, G.t * 0.5, false); }

  /* ---------- gelung ---------- */
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (G.state !== 'jeda') { var steps = G.speed || 1; for (var i = 0; i < steps; i++) update(dt); }
    render(); hud(); drawSunIcon();
    if (G.state === 'menu') drawLogo();
    requestAnimationFrame(frame);
  }
  try { var sl = localStorage.getItem('clawd-vs-zombi-bahasa'); if (sl === 'ms' || sl === 'id') G.lang = sl; } catch (e) {}
  newLevel(G.pick); G.preview = null; resize(); applyLang(); buildSeeds();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
  requestAnimationFrame(frame);

  /* ---------- kait ujian ---------- */
  window.__game = {
    get keadaan() { return G.state; }, get skor() { return G.kills || 0; },
    mula: function (li) { start(li || 0); }, lewatiMula: function () { if (G.state === 'siap') G.cdT = 0.01; },
    info: function () { return { keadaan: G.state, level: G.level + 1, matahari: G.sun, gelombang: G.wave + '/' + LEVELS[G.level].waves, tanaman: Object.keys(plants).length, zombi: zombies.filter(function (z) { return !z.dead; }).length, kalah: G.kills, benar: G.benar, gerobak: mowers.map(function (m) { return m.gone ? 0 : 1; }).join('') }; },
    matahari: function (n) { G.sun = n; bumpSun(); },
    tanam: function (type, r, c) { if (!G.seeds.some(function (s) { return s.type === type; })) G.seeds.push({ type: type, cdLeft: 0 }); var s = G.seeds.filter(function (x) { return x.type === type; })[0]; s.cdLeft = 0; G.sun = Math.max(G.sun, PLANTS[type].cost); G.sel = type; act({ r: r, c: c, ok: true }); return !!plantAt(r, c); },
    zombi: function (type, r, x) { spawnZ(type, r, x === undefined ? 9.2 : x); },
    gelombang: function () { G.waveT = 0.01; },
    kliksemuaMatahari: function () { var n = 0; suns.forEach(function (s) { if (!s.fly) { collectSun(s); n++; } }); return n; },
    jawabUji: function (betul) { if (!Q) return null; var v = betul ? Q.ans : Q.opts.filter(function (x) { return x !== Q.ans; })[0], btn = Array.prototype.filter.call($('mA').children, function (b) { return +b.textContent === v; })[0]; if (btn) btn.click(); return v; },
    habiskan: function () { G.wave = LEVELS[G.level].waves; zombies.forEach(function (z) { if (!z.dead) { z.armor = 0; hitZ(z, 9999); } }); },
    percepat: function (n) { G.speed = n || 1; }
  };
})();
</script>
