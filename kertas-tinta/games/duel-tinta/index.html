<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duel Tinta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;700&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Geist:wght@400;600;800&display=swap">
<link rel="stylesheet" href="../../kit/ink.css">
</head><body>
<script src="../../kit/ink.js"></script>
<script>
/* Duel Tinta — RPG giliran: jawab soal sebelum sumbu habis terbakar, Si Bulat menyerang monster tinta. */
(function () {
  'use strict';
  var I = INK, C = I.C, W = I.W, H = I.H, FLOOR = 178, BX = 118, MX = 352, CY = 204, CH = 46;
  var MONS = [{ name: 'Tetes Tinta', hp: 3, s: 1.7 }, { name: 'Kelelawar Tinta', hp: 3, s: 1.55, wings: true }, { name: 'Raja Tinta', hp: 4, s: 2.2, crown: true }];
  var cur = null, cards = [], sel = 0, timer = 0, limit = 9, mi = 0, mhp = 3, mon = null, atk = null, balls = [], think = 0, demoWrong = false;

  function newMonster(i) { mi = i; mhp = MONS[i].hp; mon = { t: 0, pop: 0, hurt: 0, dead: 0, x: MX }; }
  function stage() {
    cur = I.mathQ(I.S.diff, 4);
    I.setQ(cur.text);
    cards = cur.options.map(function (v, i) { return { v: v, x: 16 + i * 114, wrong: false, good: false, pop: 0, u: I.ri(1, 80) }; });
    timer = limit = I.S.diff === 'mudah' ? 10 : I.S.diff === 'sedang' ? 9 : 8;
    sel = 0; think = I.rf(1.0, 1.7);
    demoWrong = I.demo && Math.random() < 0.15;
    if (!mon || mon.dead > 0 || mhp <= 0) newMonster(Math.min(MONS.length - 1, mon ? mi + 1 : 0));
  }
  function choose(i) {
    if (I.state !== 'play' || !cards[i] || cards[i].wrong) return;
    sel = i; var c = cards[i];
    if (c.v === cur.ans) {
      c.good = true; atk = { t: 0, hit: false };
      I.sfx('whoosh');
    } else {
      c.wrong = true; demoWrong = false;
      monsterThrow(c.x + 52, CY);
    }
  }
  function monsterThrow() {
    balls.push({ x: mon.x - 20, y: FLOOR - 40, t: 0 });
    I.sfx('bump');
  }
  function update(dt) {
    if (mon) { mon.t += dt; if (mon.pop < 1) mon.pop = Math.min(1, mon.pop + dt * 3); if (mon.hurt > 0) mon.hurt -= dt; if (mon.dead > 0) mon.dead = Math.max(0.001, mon.dead - dt * 0.6); }
    cards.forEach(function (c) { if (c.pop < 1) c.pop = Math.min(1, c.pop + dt * 5); });
    if (atk) {
      atk.t += dt;
      if (!atk.hit && atk.t > 0.24) {
        atk.hit = true; mhp--; mon.hurt = 0.5; I.hitstop = 0.07;
        var last = mhp <= 0;
        I.good(mon.x, FLOOR - 50, { word: last ? 'MELELEH!' : 'BAM!' });
        I.rays(mon.x, FLOOR - 40, 10, C.ink, 9, 90);
        if (last) { mon.dead = 1; I.splat(mon.x, FLOOR + 2, 22); I.drops(mon.x, FLOOR - 30, 22, 170); I.sfx('stomp'); }
      }
      if (atk.t > 0.55) atk = null;
    }
    for (var i = balls.length - 1; i >= 0; i--) {
      var b = balls[i]; b.t += dt * 1.8;
      b.x = (mon ? mon.x - 20 : MX) + (BX - (mon ? mon.x - 20 : MX)) * b.t; b.y = FLOOR - 40 - Math.sin(b.t * Math.PI) * 60 + b.t * 8;
      if (b.t >= 1) { balls.splice(i, 1); I.splat(BX + 10, FLOOR + 2, 10); I.bad(BX, FLOOR - 40, { word: 'SPLAT!' }); }
    }
    if (I.state === 'play' && !atk) {
      for (var k = 1; k <= 4; k++) if (I.take(String(k))) choose(k - 1);
      if (I.take('L')) { sel = (sel + 3) % 4; I.sfx('tick'); }
      if (I.take('R')) { sel = (sel + 1) % 4; I.sfx('tick'); }
      if (I.take('A')) choose(sel);
      if (!balls.length) {
        timer -= dt;
        if (timer <= 0) { timer = limit; I.say(W / 2, CY - 18, 'waktu habis!', C.ink, 20, 0); monsterThrow(); }
      }
    }
  }
  function demo(dt) {
    if (atk || balls.length) return;
    think -= dt;
    var target = demoWrong ? cards.findIndex(function (c) { return !c.wrong && c.v !== cur.ans; }) : cards.findIndex(function (c) { return c.v === cur.ans; });
    if (target < 0) return;
    if (think < 0.6 && sel !== target && Math.floor(think * 10) % 3 === 0) { sel += target > sel ? 1 : -1; I.sfx('tick'); }
    if (think <= 0 && sel === target) { choose(target); think = I.rf(0.9, 1.4); }
  }
  function drawMonster() {
    if (!mon) return;
    var m = MONS[mi], e = 1 - Math.pow(1 - mon.pop, 3), c = I.ctx();
    var hx = mon.hurt > 0 ? Math.sin(mon.hurt * 60) * 4 : 0, fly = m.wings ? -26 + Math.sin(mon.t * 3) * 6 : 0;
    c.globalAlpha = 0.25; c.fillStyle = C.ink; c.beginPath(); c.ellipse(mon.x, FLOOR + 2, 34 * (m.s / 1.8), 5, 0, 0, 6.3); c.fill(); c.globalAlpha = 1;
    if (mon.dead > 0 && mon.dead < 0.002) return;
    c.save(); c.translate(mon.x, FLOOR + fly); c.scale(e, e); c.translate(-mon.x, -FLOOR - fly);
    I.blob(mon.x + hx, FLOOR + fly, { t: mon.t, dir: -1, s: m.s, wings: m.wings, crown: m.crown, hurt: mon.hurt > 0, dead: mon.dead > 0 ? mon.dead * 0.5 : 0 });
    c.restore();
    /* nama + darah */
    I.text(m.name, W - 16, 44, { font: 'hand', size: 20, col: C.ink, align: 'right' });
    for (var i = 0; i < m.hp; i++) {
      var x = W - 16 - (m.hp - i) * 16;
      I.card(x, 54, 12, 12, i + 30, { fill: i < mhp ? C.ink : C.paper2, amp: 0.4, lw: 1.3 });
    }
  }
  function draw() {
    var c = I.ctx();
    I.paper(0.03);
    c.globalAlpha = 0.28; var pts = []; for (var xx = 0; xx <= W; xx += 8) pts.push([xx, FLOOR - 40 - Math.sin(xx * 0.018 + 1) * 14]); I.trace(pts); I.stroke(1.2); c.globalAlpha = 1;
    I.cloud(40, 54, 0.9, 2); I.cloud(200, 42, 0.7, 5);
    I.line(0, FLOOR, W, FLOOR, 3, 1, 1.7);
    I.hatch(0, FLOOR + 1, W, 12, 6, C.ink, 0.7, 0.25);
    I.drawSplats();
    /* Si Bulat */
    var bx = BX, jump = 0;
    if (atk) { var k = atk.t / 0.55; bx = BX + Math.sin(Math.min(1, k) * Math.PI) * 170; jump = Math.sin(Math.min(1, k) * Math.PI) * 30; }
    c.globalAlpha = 0.25; c.fillStyle = C.ink; c.beginPath(); c.ellipse(bx, FLOOR + 2, 20, 4, 0, 0, 6.3); c.fill(); c.globalAlpha = 1;
    var bob = atk ? 0 : Math.abs(Math.sin(I.time * 3)) * 3;
    I.bulat(bx, FLOOR - jump - bob, { r: 22, face: 1, t: I.time, air: jump > 2, sq: atk ? -0.08 : Math.sin(I.time * 6) * 0.03, mood: I.S.hearts <= 0 ? 'hurt' : balls.length ? 'wow' : 'happy', rot: atk ? atk.t * 9 : 0 });
    for (var h = 0; h < 3; h++) I.text('♥', BX - 18 + h * 18, 62, { size: 16, col: h < I.S.hearts ? C.org : C.line, font: '700 16px "Source Serif 4", serif' });
    drawMonster();
    balls.forEach(function (b) { I.circle(b.x, b.y, 7, b.t * 9, 1.2, 1.2, C.ink, C.ink); });
    /* sumbu waktu */
    if (I.state === 'play') {
      var fx = 16 + (W - 32) * Math.max(0, timer / limit);
      I.line(16, CY - 8, fx, CY - 8, 61, 0.6, 2.2, timer / limit < 0.3 ? C.org : C.ink);
      I.star4(fx, CY - 8, 4 + Math.random() * 2, I.time * 9, C.org, 1.6);
    }
    cards.forEach(function (cd, i) {
      var e = 1 - Math.pow(1 - cd.pop, 3), lift = (i === sel && I.state === 'play' && !cd.wrong) ? -4 : 0;
      c.save(); c.translate(cd.x + 52, CY + CH / 2); c.scale(e, e); c.translate(-(cd.x + 52), -(CY + CH / 2));
      I.card(cd.x, CY + lift, 104, CH, cd.u, { fill: cd.good ? C.org : cd.wrong ? C.wash : C.paper2, hatch: cd.wrong, mark: !cd.good && !cd.wrong, text: cd.v, size: 20, col: cd.good ? '#fff' : cd.wrong ? 'rgba(43,42,40,0.5)' : C.ink, cross: cd.wrong });
      I.text(String(i + 1), cd.x + 8, CY + lift + 9, { font: 'mono', size: 7, col: C.muted });
      if (i === sel && I.state === 'play' && !cd.wrong) I.line(cd.x + 18, CY + CH + 4, cd.x + 86, CY + CH + 4, i + 66, 0.5, 2.4, C.org);
      c.restore();
    });
  }
  function mini(t) {
    var k = (t % 2) / 2, bx = 38 + Math.sin(Math.min(1, k * 2) * Math.PI) * 50;
    I.line(4, 80, 146, 80, 5, 0.8, 1.4);
    I.blob(112, 80, { t: t, dir: -1, s: 1.1, crown: true, hurt: k > 0.2 && k < 0.45 });
    I.bulat(bx, 80, { r: 12, t: t, rot: k < 0.5 ? k * 12 : 0 });
    if (k > 0.2 && k < 0.45) I.text('BAM!', 110, 34, { font: 'hand', size: 18, col: C.org });
  }

  I.game({
    id: 'duel-tinta', title: 'Duel Tinta', tag: 'RPG giliran · Matematika',
    desc: 'Si Bulat berduel melawan tiga monster tinta. Jawab soal sebelum sumbu habis terbakar: jawaban benar = serangan, salah = kena cipratan tinta.',
    levels: [{ d: 'mudah', b: 'Mudah', s: 'Tambah dan kurang sampai 24' }, { d: 'sedang', b: 'Sedang', s: 'Perkalian 2–9, tambah kurang sampai 60' }, { d: 'sulit', b: 'Sulit', s: 'Kali, bagi, dua langkah' }],
    note: '3 monster, 10 serangan, 3 nyawa. Pilih kartu dengan angka 1–4.', tip: 'pilih kartu jawaban sebelum sumbu habis', unit: 'Serangan',
    pad: [{ k: '1', label: '1', wide: 1 }, { k: '2', label: '2', wide: 1 }, { k: '3', label: '3', wide: 1 }, { k: '4', label: '4', wide: 1 }],
    keyHelp: 'Keyboard: <kbd>1</kbd>–<kbd>4</kbd> pilih, atau <kbd>←</kbd> <kbd>→</kbd> lalu <kbd>Spasi</kbd> · atau ketuk kartu',
    winTitle: 'Raja Tinta kalah!',
    start: function () { mon = null; atk = null; balls = []; },
    stage: stage, update: update, draw: draw, demo: demo, mini: mini,
    pointer: function (type, x, y) { if (type !== 'down' || y < CY - 10) return; cards.forEach(function (cd, i) { if (x >= cd.x && x <= cd.x + 104) choose(i); }); },
    answer: function () { return cur ? cur.ans : ''; }
  });
})();
</script>
</body></html>
