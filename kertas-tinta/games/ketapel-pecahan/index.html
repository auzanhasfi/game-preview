<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ketapel Pecahan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;700&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Geist:wght@400;600;800&display=swap">
<link rel="stylesheet" href="../../kit/ink.css">
<style>
  .fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: .52em; line-height: 1.05; margin-inline: .08em; }
  .fr b { border-bottom: .09em solid currentColor; padding-inline: .12em; }
  .fr i { font-style: normal; }
</style>
</head><body>
<script src="../../kit/ink.js"></script>
<script>
/* Ketapel Pecahan — tarik ketapel, lempar Si Bulat ke balon berisi pecahan yang benar. */
(function () {
  'use strict';
  var I = INK, C = I.C, W = I.W, H = I.H, GROUND = 236, PX = 66, PY = 182, GRAV = 420;
  var aim = { ang: 0.7, pow: 380 }, shot = null, ready = true, reloadIn = 0, balloons = [], stars = [], cur = null, drag = null, plan = null, demoWrong = false, planWait = 0;

  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function F(a, b) { return { a: a, b: b, v: a / b, s: a + '/' + b }; }
  function fr(f) { return '<span class="fr"><b>' + f.a + '</b><i>' + f.b + '</i></span>'; }
  function fill(ans, cands) {
    var out = [ans], seen = {}; seen[ans.v.toFixed(4)] = true;
    I.shuffle(cands).forEach(function (f) { if (out.length < 3 && f.a > 0 && f.b > 1 && f.a <= f.b * 2 && !seen[f.v.toFixed(4)]) { seen[f.v.toFixed(4)] = true; out.push(f); } });
    var k = 1; while (out.length < 3) { var g = F(k, ans.b + 1 + k); if (!seen[g.v.toFixed(4)]) { seen[g.v.toFixed(4)] = true; out.push(g); } k++; }
    return I.shuffle(out);
  }
  function makeQ() {
    var d = I.S.diff, a, b, ans, text, pie = null;
    if (d === 'mudah') {
      b = I.pick([2, 3, 4, 5, 6, 8]); a = I.ri(1, b - 1); ans = F(a, b); pie = ans;
      text = 'Bagian oranye = ?';
      return { text: text, ans: ans, pie: pie, options: fill(ans, [F(b - a, b), F(a, b + 1), F(Math.min(b, a + 1), b), F(a, Math.max(2, b - 1)), F(Math.max(1, a - 1), b)]) };
    }
    if (d === 'sedang') {
      do { b = I.ri(2, 6); a = I.ri(1, b - 1); } while (gcd(a, b) !== 1);
      var m = I.ri(2, 4); ans = F(a, b);
      text = fr(F(a * m, b * m)) + ' = ?';
      var c = []; for (var i = 0; i < 8; i++) { var bb = I.ri(2, 6), aa = I.ri(1, bb - 1); c.push(F(aa, bb)); }
      c.push(F(a, b * m)); c.push(F(a * m, b));
      return { text: text, ans: ans, options: fill(ans, c) };
    }
    b = I.ri(5, 9);
    var x1 = I.ri(1, b - 2), x2 = I.ri(1, b - 1 - x1), plus = Math.random() < 0.55;
    if (!plus && x1 <= x2) { var t = x1; x1 = x2 + 1; x2 = t; if (x1 >= b) x1 = b - 1; }
    ans = plus ? F(x1 + x2, b) : F(x1 - x2, b);
    text = fr(F(x1, b)) + (plus ? ' + ' : ' − ') + fr(F(x2, b)) + ' = ?';
    return { text: text, ans: ans, options: fill(ans, [F(plus ? x1 + x2 : x1 - x2, b * 2), F(ans.a + 1, b), F(Math.max(1, ans.a - 1), b), F(plus ? x1 + x2 : x1 + x2, b), F(ans.a, b + 1)]) };
  }
  function stage() {
    cur = makeQ(); I.setQ(cur.text);
    var xs = I.shuffle([246, 308, 370, 430]).slice(0, 3), ys = I.shuffle([84, 120, 156, 186]);
    balloons = cur.options.map(function (f, i) { return { x: xs[i] + I.ri(-8, 8), y0: ys[i], y: ys[i], f: f, u: I.ri(1, 80), ph: I.rf(0, 6), pop: 0, good: false, wrong: false, gone: false }; });
    stars = [];
    for (var k = 0; k < 3; k++) stars.push({ x: 150 + k * 34, y: 60 + I.ri(0, 30), t: k, got: false });
    plan = null; demoWrong = I.demo && Math.random() < 0.18; planWait = 0.6;
  }
  function launch() {
    if (!ready || I.state !== 'play') return;
    ready = false;
    shot = { x: PX, y: PY - 10, vx: Math.cos(aim.ang) * aim.pow, vy: -Math.sin(aim.ang) * aim.pow, rot: 0, hit: false };
    I.sfx('whoosh'); I.rings(PX, PY, 3);
  }
  function update(dt) {
    balloons.forEach(function (b) { b.y = b.y0 + Math.sin(I.time * 1.5 + b.ph) * 5; if (b.pop < 1) b.pop = Math.min(1, b.pop + dt * 4); });
    stars.forEach(function (s) { s.t += dt; });
    if (I.state === 'play' && ready && !drag) {
      if (I.key.U) aim.ang += 1.1 * dt; if (I.key.D) aim.ang -= 1.1 * dt;
      if (I.key.R) aim.pow += 240 * dt; if (I.key.L) aim.pow -= 240 * dt;
      if (I.take('A')) launch();
    }
    aim.ang = I.clamp(aim.ang, 0.12, 1.4); aim.pow = I.clamp(aim.pow, 220, 560);
    if (shot) {
      shot.vy += GRAV * dt; shot.x += shot.vx * dt; shot.y += shot.vy * dt; shot.rot += 9 * dt;
      if (!shot.hit && I.state === 'play') {
        balloons.forEach(function (b) {
          if (shot.hit || b.gone || b.wrong || Math.hypot(shot.x - b.x, shot.y - b.y) > 20) return;
          shot.hit = true; I.sfx('pop');
          if (b.f.v === cur.ans.v && b.f.s === cur.ans.s) { b.good = true; b.gone = true; I.good(b.x, b.y, { word: 'DOR!' }); }
          else { b.wrong = true; demoWrong = false; I.splat(b.x, GROUND, 9); I.bad(b.x, b.y); }
        });
        stars.forEach(function (s) { if (!s.got && Math.hypot(shot.x - s.x, shot.y - s.y) < 14) { s.got = true; I.addScore(1, s.x, s.y); I.coinFx(s.x, s.y); I.sfx('coin'); } });
      }
      if (shot.y > GROUND - 8 || shot.x > W + 30) {
        if (shot.y > GROUND - 8) { I.rings(shot.x, GROUND, 3); I.sfx('land'); }
        if (!shot.hit && I.state === 'play') I.say(Math.min(shot.x, W - 40), GROUND - 30, 'meleset…', C.muted, 18, 0.05);
        shot = null; reloadIn = 0.7;
      }
    }
    if (!shot && !ready) { reloadIn -= dt; if (reloadIn <= 0) { ready = true; plan = null; planWait = 0.5; } }
  }
  /* simulasi lintasan (dipakai titik bidik dan demo) */
  function sim(ang, pow, target) {
    var x = PX, y = PY - 10, vx = Math.cos(ang) * pow, vy = -Math.sin(ang) * pow, dt = 1 / 120, best = 1e9;
    for (var i = 0; i < 480; i++) {
      vy += GRAV * dt; x += vx * dt; y += vy * dt;
      if (y > GROUND - 8 || x > W + 30) break;
      for (var k = 0; k < balloons.length; k++) {
        var b = balloons[k]; if (b.gone || b.wrong) continue;
        var d = Math.hypot(x - b.x, y - b.y0);
        if (b !== target && d < 27) return 1e9;
        if (b === target && d < 20) return d;
      }
      if (target) best = Math.min(best, Math.hypot(x - target.x, y - target.y0));
    }
    return best + 100;
  }
  function demo(dt) {
    I.key = {};
    if (!ready) return;
    if (!plan) {
      var tgt = demoWrong ? balloons.find(function (b) { return !b.gone && !b.wrong && b.f.s !== cur.ans.s; }) : balloons.find(function (b) { return b.f.s === cur.ans.s; });
      if (!tgt || tgt.gone) return;
      var best = { d: 1e9 };
      for (var a = 0.2; a < 1.32; a += 0.025) for (var p = 240; p <= 560; p += 8) { var d = sim(a, p, tgt); if (d < best.d) best = { d: d, a: a, p: p }; }
      plan = best;
    }
    if (plan.a === undefined) return;
    var da = plan.a - aim.ang, dp = plan.p - aim.pow;
    aim.ang += I.clamp(da, -0.9 * dt, 0.9 * dt); aim.pow += I.clamp(dp, -260 * dt, 260 * dt);
    if (Math.abs(da) < 0.004 && Math.abs(dp) < 2) { planWait -= dt; if (planWait <= 0) { aim.ang = plan.a; aim.pow = plan.p; launch(); } }
  }
  function pie(cx, cy, r, f) {
    var c = I.ctx(), a0 = -Math.PI / 2;
    for (var i = 0; i < f.b; i++) {
      var s = a0 + i / f.b * 6.2832, e = a0 + (i + 1) / f.b * 6.2832;
      c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, r, s, e); c.closePath(); c.fillStyle = i < f.a ? C.org : C.paper2; c.fill();
      I.line(cx, cy, cx + Math.cos(s) * r, cy + Math.sin(s) * r, i + 300, 0.4, 1.2);
    }
    I.circle(cx, cy, r, 6, 0.8, 1.6, C.ink);
  }
  function balloon(b) {
    var c = I.ctx(), e = 1 - Math.pow(1 - b.pop, 3);
    if (b.gone) return;
    var pts = [];
    for (var k = 0; k <= 8; k++) { var yy = b.y + 20 + k * ((GROUND - b.y - 20) / 8); pts.push([b.x + Math.sin(k * 1.4 + I.time * 2) * 2.5, yy]); }
    I.trace(pts); I.stroke(1, C.ink);
    c.save(); c.translate(b.x, b.y); c.scale(e, e); c.translate(-b.x, -b.y);
    if (b.wrong) {
      I.circle(b.x, b.y + 6, 11, b.u, 1.4, 1.5, C.ink, C.wash); I.hatch(b.x - 11, b.y - 5, 22, 22, 4, C.ink, 0.8, 0.5);
      I.line(b.x - 7, b.y - 1, b.x + 7, b.y + 13, b.u + 3, 0.6, 2); I.line(b.x + 7, b.y - 1, b.x - 7, b.y + 13, b.u + 4, 0.6, 2);
    } else {
      I.circle(b.x, b.y, 19, b.u, 1, 1.8, C.ink, C.paper2);
      c.fillStyle = 'rgba(217,119,87,0.16)'; c.beginPath(); c.arc(b.x + 4, b.y + 4, 14, 0, 6.3); c.fill();
      I.trace([[b.x - 3, b.y + 19], [b.x, b.y + 23], [b.x + 3, b.y + 19]]); I.stroke(1.3);
      I.line(b.x - 11, b.y - 9, b.x - 7, b.y - 13, b.u + 7, 0.3, 2, C.org);
      I.frac(b.f.a, b.f.b, b.x, b.y, 11);
    }
    c.restore();
  }
  function sling(front) {
    if (!front) { I.line(PX, GROUND, PX, PY + 14, 2, 0.6, 3); I.line(PX, PY + 14, PX - 9, PY - 6, 3, 0.5, 2.6); I.line(PX, PY + 14, PX + 9, PY - 6, 4, 0.5, 2.6); }
    var pull = ready ? 6 + (aim.pow - 220) / 340 * 14 : 0, bx = PX - Math.cos(aim.ang) * pull, by = PY - 2 + Math.sin(aim.ang) * pull;
    if (front && ready) { I.line(PX - 9, PY - 6, bx - 6, by, 21, 0.3, 1.6, C.orgD); I.line(PX + 9, PY - 6, bx + 6, by, 22, 0.3, 1.6, C.orgD); }
    return [bx, by];
  }
  function draw() {
    var c = I.ctx();
    I.paper(0.03);
    I.sun(430, 46, 13);
    c.globalAlpha = 0.28; var pts = []; for (var xx = 0; xx <= W; xx += 8) pts.push([xx, GROUND - 30 - Math.sin(xx * 0.02 + 2) * 12]); I.trace(pts); I.stroke(1.2); c.globalAlpha = 1;
    I.cloud(300, 46, 0.9, 4);
    I.grass(GROUND, 5);
    I.drawSplats();
    if (cur && cur.pie) {
      I.card(16, 40, 64, 64, 9, { mark: true });
      pie(48, 72, 24, cur.pie);
    }
    if (ready && I.state === 'play') {
      var x = PX, y = PY - 10, vx = Math.cos(aim.ang) * aim.pow, vy = -Math.sin(aim.ang) * aim.pow;
      c.fillStyle = C.ink;
      for (var i = 1; i <= 66; i++) { var dt = 1 / 120 * 3; vy += GRAV * dt; x += vx * dt; y += vy * dt; if (i % 3 === 0) { c.globalAlpha = 0.6 * (1 - i / 70); c.beginPath(); c.arc(x, y, 1.5, 0, 6.3); c.fill(); } }
      c.globalAlpha = 1;
    }
    stars.forEach(function (s) { if (!s.got) I.star4(s.x, s.y + Math.sin(s.t * 3) * 2, 5, s.t, C.org, 1.6); });
    balloons.forEach(balloon);
    sling(false);
    var p = sling(true);
    if (ready) I.bulat(p[0], p[1] + 12, { r: 10, face: 1, noFeet: true, mood: I.S.hearts <= 0 ? 'hurt' : 'happy', t: I.time });
    if (shot) I.bulat(shot.x, shot.y + 10, { r: 10, rot: shot.rot, mood: 'wow', noFeet: true });
    I.line(PX - 9, PY - 6, PX + 9, PY - 6, 23, 0.3, 1.4, C.orgD);
    if (ready && I.state === 'play' && !I.preview) I.text('sudut ' + Math.round(aim.ang * 57.3) + '° · tenaga ' + Math.round((aim.pow - 220) / 3.4) + '%', 14, GROUND + 22, { font: 'mono', size: 7, align: 'left', col: C.muted });
  }
  function mini(t) {
    var c = I.ctx(), k = (t % 2.4) / 2.4;
    I.line(4, 88, 146, 88, 5, 0.8, 1.4);
    I.line(28, 88, 28, 64, 2, 0.5, 2.4); I.line(28, 64, 22, 54, 3, 0.4, 2); I.line(28, 64, 34, 54, 4, 0.4, 2);
    I.circle(118, 38, 15, 2, 1, 1.5, C.ink, C.paper2); I.frac(3, 4, 118, 38, 9);
    I.line(118, 53, 118, 88, 6, 1, 1);
    var x = 28 + k * 90, y = 54 - Math.sin(k * Math.PI) * 30 + k * -10;
    c.globalAlpha = 0.5; for (var i = 0; i < 6; i++) { var kk = i / 6 * k; c.beginPath(); c.arc(28 + kk * 90, 54 - Math.sin(kk * Math.PI) * 30 + kk * -10, 1.3, 0, 6.3); c.fillStyle = C.ink; c.fill(); } c.globalAlpha = 1;
    I.bulat(x, y + 8, { r: 8, rot: k * 8, mood: 'wow', noFeet: true });
  }

  I.game({
    id: 'ketapel-pecahan', title: 'Ketapel Pecahan', tag: 'Bidik & lempar · Matematika',
    desc: 'Tarik ketapel kertas dan lempar Si Bulat ke balon yang berisi pecahan yang benar. Atur sudut dan tenaga lemparan.',
    levels: [{ d: 'mudah', b: 'Mudah', s: 'Membaca gambar pecahan' }, { d: 'sedang', b: 'Sedang', s: 'Pecahan senilai (sederhanakan)' }, { d: 'sulit', b: 'Sulit', s: 'Tambah & kurang penyebut sama' }],
    note: '10 soal, 3 nyawa. Lemparan meleset tidak mengurangi nyawa.', tip: 'tarik & lepas di arena, atau atur sudut dan tenaga lalu LEMPAR',
    pad: [{ k: 'D', label: '↘', aria: 'Sudut turun' }, { k: 'U', label: '↗', aria: 'Sudut naik' }, { k: 'L', label: '−', aria: 'Tenaga kurang' }, { k: 'R', label: '+', aria: 'Tenaga tambah' }, { k: 'A', label: 'LEMPAR', main: 1 }],
    keyHelp: 'Keyboard: <kbd>↑</kbd> <kbd>↓</kbd> sudut, <kbd>←</kbd> <kbd>→</kbd> tenaga, <kbd>Spasi</kbd> lempar',
    winTitle: 'Semua balon pecah',
    start: function () { shot = null; ready = true; aim.ang = 0.7; aim.pow = 380; },
    stage: stage, update: update, draw: draw, demo: demo, mini: mini,
    pointer: function (type, x, y) {
      if (!ready || I.state !== 'play') { drag = null; return; }
      if (type === 'down') drag = { x: x, y: y };
      else if (drag) {
        var dx = drag.x - x, dy = drag.y - y, len = Math.hypot(dx, dy);
        if (len > 6) { aim.ang = I.clamp(Math.atan2(-dy, dx), 0.12, 1.4); aim.pow = I.clamp(220 + len * 3.2, 220, 560); }
        if (type === 'up') { drag = null; if (len > 12) launch(); }
      }
    },
    answer: function () { return cur ? cur.ans.s : ''; }
  });
})();
</script>
</body></html>
