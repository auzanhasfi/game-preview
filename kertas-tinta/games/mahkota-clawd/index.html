  .lbl { font: 700 16px var(--font-serif); margin-bottom: 6px; }
  .dek { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .dek div { position: relative; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; background: var(--paper); }
  .dek canvas { display: block; width: 100%; aspect-ratio: 3/4; }

  window.addEventListener('pointerup', function (e) { var p = arenaPos(e); if ((downOnArena || (drag && drag.moved)) && p) tryDeploy(p); drag = null; downOnArena = false; if (e.pointerType !== 'mouse') G.ghost = null; });
  window.addEventListener('pointercancel', function () { drag = null; downOnArena = false; });
  window.addEventListener('keydown', function (e) { if (G.state !== 'main') return; var n = '1234'.indexOf(e.key); if (n >= 0) { G.sel = G.sel === n ? null : n; sfx('pilih'); refreshCards(); } if (e.key === 'Escape') { G.sel = null; refreshCards(); } if (e.key === 'p' || e.key === 'P') pause(true); });

  /* ---------- aliran ---------- */
  function start() {
    audio(); newBattle(); G.state = 'hitung'; G.cdT = 3; G.lastCd = 4; $('pWaktu').classList.remove('x2'); $('pWaktu').querySelector('small').textContent = tx().sisa;
    $('nMkLawan').textContent = '0'; $('nMkKamu').textContent = '0'; $('trLawan').textContent = '🏆 ' + (save.trofi + 20 + Math.floor(Math.random() * 40));
    show('menu', false); show('hasil', false); show('jeda', false); $('emoteBox').hidden = true; G.kombo = 0; $('mK').hidden = true; qLock = 0;
    buildHand(); newQ(); sfx('hitung');
  }
  function pause(on) { if (on && G.state === 'main') { G.state = 'jeda'; show('jeda', true); musicStop(); } else if (!on && G.state === 'jeda') { G.state = 'main'; show('jeda', false); musicStart(); last = performance.now(); } }
  function toMenu() { musicStop(); show('hasil', false); show('jeda', false); peti = null; newBattle(); G.state = 'menu'; show('menu', true); refreshMenu(); buildHand(); }
  $('bMula').addEventListener('click', start); $('bLagi').addEventListener('click', start); $('bMenu').addEventListener('click', toMenu);
  $('bJeda').addEventListener('click', function () { pause(G.state === 'main'); }); $('bLanjut').addEventListener('click', function () { pause(false); });
  $('bKeluar').addEventListener('click', function () { show('jeda', false); G.state = 'main'; crowns[1] = 3; $('nMkLawan').textContent = 3; finish(); });
  $('petiCv').addEventListener('click', openPeti);
  $('bEmote').addEventListener('click', function () { audio(); var b = $('emoteBox'); b.hidden = !b.hidden; });
  function buildEmotes() { var b = $('emoteBox'); b.innerHTML = ''; tx().emote.forEach(function (t) { var x = document.createElement('button'); x.textContent = t; x.addEventListener('click', function () { G.emote[0] = { text: t, t: 2.2 }; b.hidden = true; sfx('emote'); if (G.state === 'main' && Math.random() < 0.5) setTimeout(function () { if (G.state === 'main') aiEmote(1); }, 900); }); b.appendChild(x); }); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(true); });
  window.addEventListener('resize', resize);

  /* ---------- menu ---------- */
  function applyLang() {
    document.documentElement.lang = G.lang === 'ms' ? 'ms' : 'id';
    document.querySelectorAll('[data-t]').forEach(function (el) { var v = tx()[el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
    $('how').innerHTML = tx().cara.map(function (c) { return '<div><b>' + c[0] + '</b><span>' + c[1] + '</span></div>'; }).join('');
    var dk = $('dek'); dk.innerHTML = ''; DECK.forEach(function (k) { var d = document.createElement('div'), c = document.createElement('canvas'); c.width = 180; c.height = 240; c.getContext('2d').drawImage(cardArt(k), 0, 0); d.appendChild(c); d.insertAdjacentHTML('beforeend', '<b>' + CARDS[k].cost + '</b><span>' + tx().kartu[k] + '</span>'); dk.appendChild(d); });
    buildEmotes(); refreshMenu(); if (cardEls.length) refreshCards(true);
  }
  function refreshMenu() {
    document.querySelectorAll('[data-lvl]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lvl === G.lvl)); });
    document.querySelectorAll('[data-ai]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.ai === G.ai)); });
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === G.lang)); });
    $('sTrofi').textContent = '🏆 ' + save.trofi; $('sKoin').textContent = '🪙 ' + save.koin;
  }
  document.querySelectorAll('[data-lvl]').forEach(function (b) { b.addEventListener('click', function () { G.lvl = b.dataset.lvl; audio(); sfx('pilih'); refreshMenu(); }); });
  document.querySelectorAll('[data-ai]').forEach(function (b) { b.addEventListener('click', function () { G.ai = b.dataset.ai; audio(); sfx('pilih'); refreshMenu(); }); });
  document.querySelectorAll('[data-lang]').forEach(function (b) { b.addEventListener('click', function () { G.lang = b.dataset.lang; try { localStorage.setItem('mahkota-clawd-bahasa', G.lang); } catch (e) {} audio(); sfx('pilih'); applyLang(); }); });
  function drawLogo() {
    ctx = $('logoCv').getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#dfe5c6'; ctx.fillRect(0, 0, 240, 240);
    ctx.fillStyle = '#9cc3e0'; ctx.fillRect(0, 150, 240, 26); ctx.beginPath(); ctx.moveTo(0, 150); ctx.lineTo(240, 150); ctx.moveTo(0, 176); ctx.lineTo(240, 176); stroke(1.5, INK);
    drawComot(178, 104 + Math.sin(G.t * 3) * 3, 26, { t: G.t, king: true, col: PLUM, lx: -1, angry: true });
    drawClawd(78, 226 - Math.abs(Math.sin(G.t * 4)) * 6, { s: 2.6, hero: 'pahlawan', t: G.t, face: 0.7, crown: false, atk: Math.max(0, Math.sin(G.t * 4)) });
    crownPath(120, 60 + Math.sin(G.t * 2) * 4, 52, GOLD);
  }

  /* ---------- gelung ---------- */
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (G.state !== 'jeda') update(dt);
    render(); hud();
    if (G.state === 'menu') drawLogo();
    if (!$('hasil').hidden) drawPeti(dt);
    requestAnimationFrame(frame);
  }
  try { var sl = localStorage.getItem('mahkota-clawd-bahasa'); if (sl === 'ms' || sl === 'id') G.lang = sl; } catch (e) {}
  newBattle(); resize(); applyLang(); buildHand();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
  requestAnimationFrame(frame);

  /* ---------- kait ujian ---------- */
  window.__game = {
    get keadaan() { return G.state; }, get skor() { return crowns[0]; },
    mula: start,
    info: function () { return { keadaan: G.state, waktu: Math.round(G.left), eliksir: +E[0].toFixed(1), eliksirLawan: +E[1].toFixed(1), tangan: D[0].hand.slice(), mahkota: crowns.slice(), pasukan: units.length, menara: towers.map(function (t) { return Math.round(t.hp); }), benar: G.benar, hasil: G.result }; },
    lewatiHitung: function () { if (G.state === 'hitung') G.cdT = 0.01; },
    eliksir: function (n) { E[0] = n; },
    pasang: function (i, x, y) { return deploy(0, i, x, y); },
    pasangKartu: function (key, x, y) { var dk = D[0], i = dk.hand.indexOf(key); if (i < 0) { var q = dk.queue.indexOf(key); dk.queue[q] = dk.hand[0]; dk.hand[0] = key; i = 0; refreshCards(true); } E[0] = Math.max(E[0], CARDS[key].cost); return deploy(0, i, x, y); },
    jawabUji: function (betul) { if (!Q) return null; var v = betul ? Q.ans : Q.opts.filter(function (x) { return x !== Q.ans; })[0], btn = Array.prototype.filter.call($('mA').children, function (b) { return +b.textContent === v; })[0]; if (btn) btn.click(); return v; },
    rusakMenara: function (team, idx, hp) { var t = towers.filter(function (t) { return t.team === team; })[idx]; hurt(t, t.hp - hp); },
    waktu: function (s) { G.left = s; }
  };
})();
</script>
</body>
</html>
