<body>
<div id="app">
  <div id="atas">

<div class="ov" id="jeda" hidden>

    <div class="aksi"><button class="big" id="bLanjut" data-t="lanjut"></button><button id="bUlang" data-t="ulang"></button><button id="bKeMenu" data-uji="keMenu" data-t="keMenu"></button></div>

</div>

    <h2 id="rJudul" style="font-size:34px"></h2>
    <canvas id="hasilCv" width="300" height="300"></canvas>

      <div><b id="rTotal">0</b><span data-t="totalBintang"></span></div>
    </div>
    <div class="aksi"><button class="big" data-uji="lanjutLevel" id="bNext"></button><button id="bUlang2" data-uji="ulangLevel" data-t="ulang"></button><button id="bMenu" data-uji="menu" data-t="keMenu"></button></div>
  </div>
</div>

<div class="ov" id="menu">
  <div class="card">
    <div class="brand">
      <canvas id="logoCv" width="240" height="320"></canvas>
      <div>
        <span class="tag" data-t="tag"></span>
        <h1>Potong Tali Clawd</h1>
        <p class="note" data-t="sub"></p>
      </div>
    </div>
    <div>
      <div class="lbl"><span data-t="pilihKotak" style="font:700 16px var(--font-serif);color:var(--ink)"></span><span id="mTotal"></span></div>
      <div class="kotak" id="kotak"></div>
      <div class="levels" id="levels"></div>
    </div>
    <div class="rows">
      <div><div class="lbl" data-t="tingkat"></div><div class="seg2"><button data-lvl="mudah" data-uji="mudah" data-t="mudah"></button><button data-lvl="sedang" data-uji="sedang" data-t="sedang"></button></div></div>
      <div><div class="lbl" data-t="bahasa"></div><div class="seg2"><button data-lang="id" data-uji="id">Indonesia</button><button data-lang="ms" data-uji="bm">Melayu</button></div></div>
    </div>
    <div class="how" id="how"></div>
    <div class="aksi"><button class="big" data-uji="mula" id="bMula" data-t="mula"></button></div>
  </div>
</div>

     candy [x,y], ropes [[ax,ay,(L)]], bubbles [[x,y]], cush [[x,y,arahDerajat]], spikes [[x1,y1,x2,y2]], hooks [[x,y,R]], stars [[x,y]×3], clawd [x,y] (atas kotak) */
  var LEVELS = [

      if (s.crack) { if (s.crack >= 1) return; ctx.save(); ctx.globalAlpha = 1 - s.crack; for (var q = 0; q < 2; q++) { ctx.save(); ctx.translate(s.x + (q ? 6 : -6) * s.crack * 4, s.y + s.crack * s.crack * 60); ctx.rotate((q ? 1 : -1) * s.crack * 2); star5(0, 0, 12, 0, '#b8b0a2', 1.4); ctx.restore(); } ctx.restore(); return; }
      var pulse = 1 + Math.sin(G.t * 4 + s.i) * 0.07, by = Math.sin(G.t * 2.4 + s.i * 2) * 2.5;
      var gr = ctx.createRadialGradient(s.x, s.y + by, 3, s.x, s.y + by, 26); gr.addColorStop(0, 'rgba(255,230,150,.75)'); gr.addColorStop(1, 'rgba(255,230,150,0)'); ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(s.x, s.y + by, 26, 0, 6.3); ctx.fill();
      star5(s.x, s.y + by, 13 * pulse, Math.sin(G.t * 1.5 + s.i) * 0.2, GOLD, 1.6);
      star4(s.x + 11, s.y - 10 + by, 3 + Math.sin(G.t * 6 + s.i) * 1.5, G.t, '#fff', 1.4);
    });
    // tali
    S.loose.forEach(function (l) { drawChain(l.ch.pts, '#a07a4a', Math.min(1, l.life)); if (l.pinA) drawPin(l.pinA.x, l.pinA.y); });
    S.ropes.forEach(function (r) { var d = hyp(c.x - r.ax, c.y - r.ay), taut = d > r.L * 0.985; if (r.ch) drawChain(r.ch.pts, taut ? '#c0563f' : '#a07a4a'); });
    S.ropes.forEach(function (r) { drawPin(r.ax, r.ay); });
    (L.ropes || []).forEach(function (rp, i) { if (!S.ropes.some(function (r) { return r.id === 'r' + i; }) && !S.loose.some(function (l) { return l.pinA && l.pinA.x === rp[0] && l.pinA.y === rp[1]; })) drawPin(rp[0], rp[1]); });
    // permen
    if (S.done !== 'pecah' && !(G.eatT > 0.05)) {
      drawCandy(c.x, c.y, c.r, c.rot);
      if (c.bub) { var wob = Math.sin(G.t * 5) * 1.5; ctx.beginPath(); ctx.ellipse(c.x, c.y, 24 + wob, 24 - wob, 0, 0, 6.3); ctx.fillStyle = 'rgba(191,227,242,.4)'; ctx.fill(); stroke(1.5, 'rgba(46,38,32,.6)'); ctx.beginPath(); ctx.arc(c.x - 8, c.y - 9, 6, 3.4, 4.6); stroke(2.2, '#fff'); }
    } else if (G.eatT && G.eatT < 0.25) drawCandy(m.x, m.y, c.r * (1 - G.eatT * 4), c.rot, 1 - G.eatT * 4);
    // efek
    fx.forEach(function (f) { ctx.globalAlpha = Math.min(1, f.life * 2); ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.3); ctx.fillStyle = f.col; ctx.fill(); if (f.air) stroke(0.8, 'rgba(46,38,32,.35)'); ctx.globalAlpha = 1; });
    // jejak pisau
    var tr = trail.filter(function (p) { return G.t - p.t < 0.18; });
    if (tr.length > 1) { for (var i = 1; i < tr.length; i++) { var a2 = 1 - (G.t - tr[i].t) / 0.18; ctx.beginPath(); ctx.moveTo(tr[i - 1].x, tr[i - 1].y); ctx.lineTo(tr[i].x, tr[i].y); ctx.lineCap = 'round'; ctx.lineWidth = 1 + a2 * 6 * (i / tr.length); ctx.strokeStyle = 'rgba(255,255,255,' + (0.85 * a2) + ')'; ctx.stroke(); } }
    // tulisan
    banners.forEach(function (b) {
      var u = b.t / b.dur, sc = u < 0.15 ? 0.5 + u / 0.15 * 0.6 : (u < 0.25 ? 1.1 - (u - 0.15) : 1), al = u > 0.8 ? (1 - u) / 0.2 : 1;
      ctx.save(); ctx.globalAlpha = al; ctx.translate(b.x, b.y - (b.big ? 0 : u * 20)); ctx.scale(sc, sc); ctx.font = (b.big ? '900 28px' : '900 30px') + ' "Source Serif 4", serif'; ctx.textAlign = 'center'; ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.strokeText(b.text, 0, 0); ctx.fillStyle = b.big ? '#b4553a' : CL; ctx.fillText(b.text, 0, 0); ctx.restore();
    });
  }
  function drawLogo() {
    var lc = $('logoCv'); ctx = lc.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#e6d3ad'; ctx.fillRect(0, 0, 240, 320);
    ctx.save(); ctx.scale(0.75, 0.6667); scratch(0, 0, 320, 480, 40, '#b48a55', 0.4, -0.8, 4); ctx.restore();
    var ang = Math.sin(G.t * 1.6) * 0.5, ax = 120, ay = 26, L = 120, cx = ax + Math.sin(ang) * L, cy = ay + Math.cos(ang) * L;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + cx) / 2 + Math.sin(ang) * 6, (ay + cy) / 2, cx, cy); stroke(4, INK); ctx.lineWidth = 2.2; ctx.strokeStyle = '#a07a4a'; ctx.stroke();
    drawPin(ax, ay); drawCandy(cx, cy, 15, ang * 2);
    star5(60, 190, 13, Math.sin(G.t) * 0.2, GOLD, 1.6); star5(185, 200, 11, Math.cos(G.t) * 0.2, GOLD, 1.6);
    drawBox(120, 270, 80, 40, 9); var m = { x: 120, y: 270 - 44 };
    drawClawd(120, 270, 1.8, { look: { x: (cx - m.x) / 60, y: (cy - m.y) / 60 }, open: 0.4 + Math.sin(G.t * 1.6) * 0.3, blink: (G.t % 3.2) < 0.12 });
  }
  function drawHasil() {
    var hc = $('hasilCv'); ctx = hc.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 300, 300);
    ctx.beginPath(); ctx.arc(150, 160, 120, 0, 6.3); ctx.fillStyle = '#f3e7c9'; ctx.fill();
    for (var i = 0; i < 10; i++) { var a = i / 10 * 6.28 + G.t * 0.4; ctx.beginPath(); ctx.moveTo(150 + Math.cos(a) * 60, 160 + Math.sin(a) * 60); ctx.lineTo(150 + Math.cos(a + 0.18) * 130, 160 + Math.sin(a + 0.18) * 130); ctx.lineTo(150 + Math.cos(a - 0.18) * 130, 160 + Math.sin(a - 0.18) * 130); ctx.closePath(); ctx.fillStyle = 'rgba(226,169,59,.18)'; ctx.fill(); }
    drawBox(150, 250, 110, 40, 9); drawClawd(150, 250, 2.8, { happy: true, chew: (G.t % 2) < 0.6 ? G.t % 2 : 0 });
  }

  /* ---------- UI ---------- */
  var $ = function (id) { return document.getElementById(id); };
  function show(id, on) { var el = $(id); if (el.hidden === on) el.hidden = !on; }
  function pause(on) { if (on && G.state === 'main') { G.state = 'jeda'; show('jeda', true); musicStop(); } else if (!on && G.state === 'jeda') { G.state = 'main'; show('jeda', false); musicStart(); last = performance.now(); } }
  function toMenu() { musicStop(); ['hasil', 'jeda', 'soal'].forEach(function (id) { show(id, false); }); G.state = 'menu'; Q = null; qStar = null; show('menu', true); refreshMenu(); }
  function applyLang() {
    document.documentElement.lang = G.lang === 'ms' ? 'ms' : 'id';
    document.querySelectorAll('[data-t]').forEach(function (el) { var v = tx()[el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
    $('how').innerHTML = tx().cara.map(function (c) { return '<div><b>' + c[0] + '</b>' + c[1] + '</div>'; }).join('');
    $('bBunyi').textContent = G.muted ? tx().bunyiOff : tx().bunyiOn;
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === G.lang)); });
    document.querySelectorAll('[data-lvl]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lvl === G.lvl)); });
    if (S) $('lvBox').textContent = tx().kotak[G.box];
    refreshMenu();
  }
  function refreshMenu() {
    var tot = totalStars(); $('mTotal').textContent = '★ ' + tot + '/' + LEVELS.length * 3;
    $('kotak').innerHTML = ''; [0, 1].forEach(function (b) {
      var btn = document.createElement('button'), lock = tot < BOX_NEED[b] && !G.allOpen, n = 0; LEVELS.forEach(function (L, i) { if ((L.box || 0) === b) n += save.stars[i]; });
      btn.className = 'k' + b; btn.dataset.uji = 'kotak' + b; btn.setAttribute('aria-pressed', String(G.box === b)); btn.innerHTML = '<b>' + (lock ? '🔒 ' : '') + tx().kotak[b] + '</b><span>' + (lock ? tx().butuh + BOX_NEED[b] : '★ ' + n + '/18') + '</span>';
      btn.addEventListener('click', function () { sfx('klik'); if (lock) { btn.animate([{ transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'none' }], 300); return; } G.box = b; refreshMenu(); });
      $('kotak').appendChild(btn);
    });
    var lv = $('levels'); lv.innerHTML = ''; LEVELS.forEach(function (L, i) {
      if ((L.box || 0) !== G.box) return; var b = document.createElement('button'), ok = unlocked(i), st = save.stars[i];
      b.dataset.uji = 'level' + (i + 1); b.disabled = !ok; b.innerHTML = '<b>' + (ok ? (i - firstOfBox(G.box) + 1) : '🔒') + '</b><span>' + '★★★'.slice(0, st) + '<i>' + '★★★'.slice(0, 3 - st) + '</i></span>';
      b.addEventListener('click', function () { start(i); }); lv.appendChild(b);
    });
  }
  function nextPlayable() { for (var i = 0; i < LEVELS.length; i++) if (unlocked(i) && !(save.done && save.done[i])) return i; for (var j = LEVELS.length - 1; j >= 0; j--) if (unlocked(j)) return j; return 0; }
  $('bMula').addEventListener('click', function () { var i = nextPlayable(); if ((LEVELS[i].box || 0) !== G.box) { var f = firstOfBox(G.box); if (unlocked(f)) i = f; } start(i); });
  document.querySelectorAll('[data-lang]').forEach(function (b) { b.addEventListener('click', function () { G.lang = b.dataset.lang; save.lang = G.lang; persist(); applyLang(); }); });
  document.querySelectorAll('[data-lvl]').forEach(function (b) { b.addEventListener('click', function () { G.lvl = b.dataset.lvl; save.lvl = G.lvl; persist(); applyLang(); }); });
  $('bJeda').addEventListener('click', function () { pause(true); });
  $('bUlangHud').addEventListener('click', function () { if (G.state === 'main' || G.state === 'gagal' || G.state === 'soal') { show('soal', false); start(G.level); } });
  $('bLanjut').addEventListener('click', function () { pause(false); });
  $('bUlang').addEventListener('click', function () { start(G.level); });
  $('bKeMenu').addEventListener('click', toMenu);
  $('bBunyi').addEventListener('click', function () { G.muted = !G.muted; if (G.muted) musicStop(); applyLang(); });
  $('bNext').addEventListener('click', function () { if (G.level >= LEVELS.length - 1) { toMenu(); return; } var n = G.level + 1; if (unlocked(n)) start(n); else { G.box = LEVELS[n].box || 0; toMenu(); } });
  $('bUlang2').addEventListener('click', function () { start(G.level); });
  $('bMenu').addEventListener('click', toMenu);
  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(true); });

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (G.state !== 'jeda') { var k = G.speed || 1; for (var i = 0; i < k; i++) update(dt); }
    render(); if (G.state === 'menu') drawLogo(); if (G.state === 'menang') drawHasil();
    requestAnimationFrame(frame);
  }
  resize(); applyLang(); S = mkState(0); S.ropes.forEach(function (r) { r.ch = chainInit(r.ax, r.ay, S.c.x, S.c.y, r.L); });
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv); else addEventListener('resize', resize);
  requestAnimationFrame(frame);

  /* ---------- kait ujian ---------- */
  window.__game = {
    get keadaan() { return G.state; }, get skor() { return totalStars(); },
    mula: function (li) { start(li || 0); },
    info: function () { return S && { keadaan: G.state, level: G.level + 1, tali: S.ropes.map(function (r) { return r.id; }), permen: [Math.round(S.c.x), Math.round(S.c.y)], gelembung: S.c.bub, bintang: S.stars.map(function (s) { return s.res || (s.got ? '?' : '-'); }).join(''), benar: G.benar, simpan: save.stars.join('') }; },
    potong: function (id) { var r = S.ropes.filter(function (x) { return x.id === id; })[0]; if (!r) return false; doCut(r, Math.floor(r.ch.pts.length / 2)); return true; },
    usap: function (x1, y1, x2, y2) { trySlice({ x: x1, y: y1 }, { x: x2, y: y2 }); trail = [{ x: x1, y: y1, t: G.t }, { x: x2, y: y2, t: G.t }]; return S.ropes.length; },
    pecahkan: function () { return tapAt({ x: S.c.x, y: S.c.y }); }, tiup: function (k) { var c = S.cush[k || 0]; return c ? tapAt({ x: c.x, y: c.y }) : false; },
    jawabUji: function (betul) { if (G.state !== 'soal' || !Q || Q.done) return null; var v = betul ? Q.ans : Q.opts.filter(function (x) { return x !== Q.ans; })[0]; Array.prototype.filter.call($('sA').children, function (b) { return +b.textContent === v; })[0].click(); return v; },
    jalankan: function (acts) { // jadwal aksi pemecah pada game sebenar (masa = masa fizik)
      acts.forEach(function (a) { var go = function () { if (!S || S.t + 1e-6 < a.t) return setTimeout(go, 5); if (a.a === 'potong') window.__game.potong(a.id); else if (a.a === 'pecah') window.__game.pecahkan(); else window.__game.tiup(a.k); }; go(); });
    },
    get waktu() { return S ? S.t : 0; },
    sim: simulate, cari: solve, semuaLevel: function () { return LEVELS.length; },
    otomatis: function (b) { G.auto = b; },
    bukaSemua: function () { G.allOpen = true; refreshMenu(); }, percepat: function (n) { G.speed = n || 1; }
  };
})();
