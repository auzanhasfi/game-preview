<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Turbo Clawd</title>
<meta name="description" content="Game balap mobil mainan 3D di lintasan oranye: loop, lompatan, roket, bom, gelombang dorong, nitro, dan Gerbang Angka matematika di tengah lintasan. Cerita Clawd merebut Piala Angka dari Raja Comot. Bahasa Indonesia dan Melayu.">
<meta property="og:title" content="Turbo Clawd · Arena Lintasan Angka"><meta property="og:description" content="Balap mobil mainan 3D + soal matematika di tengah lintasan."><meta property="og:image" content="sampul.jpg">
<meta name="theme-color" content="#0d1630">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/gaya.css">
<script type="importmap">{ "imports": { "three": "./js/vendor/three/three.module.js" } }</script>
</head>
<body>
<div id="kanvas"></div>
<div id="garisKecepatan"></div>
<div id="kilau"></div>

<!-- layar memuat -->
<section id="muat" class="layar aktif"><div class="muat-isi"><div class="logo"><span>TURBO</span><b>CLAWD</b></div><div class="batang"><i id="muatBatang"></i></div></div></section>

<!-- menu utama -->
<section id="menu" class="layar">
  <div class="menu-isi">
    <div class="logo besar"><span>TURBO</span><b>CLAWD</b></div>
    <p class="sub" data-t="sub"></p>
    <div class="tombol-kolom">
      <button class="btn utama" id="bMulai" data-uji="mulai"><span data-ic="flag"></span><span data-t="mulai"></span></button>
      <button class="btn" id="bArena" data-uji="arena"><span data-ic="map"></span><span data-t="arena"></span></button>
      <button class="btn" id="bGarasi" data-uji="garasi"><span data-ic="car"></span><span data-t="garasi"></span></button>
      <button class="btn" id="bAtur" data-uji="atur"><span data-ic="sliders"></span><span data-t="atur"></span></button>
    </div>
    <div class="menu-bawah">
      <button class="chip" id="bBahasa" data-uji="bahasa"></button>
      <button class="chip" id="bSuara" aria-label="Suara"></button>
      <button class="chip" id="bBantuan"><span data-ic="help"></span><span data-t="bantuan"></span></button>
    </div>
  </div>
</section>

<!-- pilih arena -->
<section id="pArena" class="layar panel-layar">
  <header class="kepala"><button class="xbtn" data-kembali aria-label="Kembali"><span data-ic="back"></span></button><h2 data-t="arena"></h2></header>
  <div id="daftarArena" class="grid-kartu"></div>
</section>

<!-- garasi -->
<section id="pGarasi" class="layar panel-layar">
  <header class="kepala"><button class="xbtn" data-kembali aria-label="Kembali"><span data-ic="back"></span></button><h2 data-t="garasi"></h2></header>
  <div id="daftarMobil" class="grid-kartu"></div>
</section>

<!-- pengaturan -->
<section id="pAtur" class="layar panel-layar">
  <header class="kepala"><button class="xbtn" data-kembali aria-label="Kembali"><span data-ic="back"></span></button><h2 data-t="atur"></h2></header>
  <div class="atur-isi">
    <h3 data-t="level"></h3><div class="segmen" id="segLevel"></div><p class="ket" id="ketLevel"></p>
    <h3 data-t="bahasa"></h3><div class="segmen" id="segBahasa"></div>
    <h3 data-t="suara"></h3><div class="segmen" id="segSuara"></div>
  </div>
</section>

<!-- bantuan -->
<section id="pBantuan" class="layar panel-layar">
  <header class="kepala"><button class="xbtn" data-kembali aria-label="Kembali"><span data-ic="back"></span></button><h2 data-t="bantuan"></h2></header>
  <div class="atur-isi"><ol id="isiBantuan" class="bantuan"></ol><div class="item-daftar" id="daftarItem"></div><p class="ket" data-t="kontrol"></p></div>
</section>

<!-- cerita -->
<section id="cerita" class="layar">
  <div class="cerita-kartu">
    <div class="cerita-judul" id="ceritaJudul"></div>
    <div class="cerita-baris">
      <div class="cerita-potret" id="ceritaPotret"></div>
      <div class="cerita-teks"><b id="ceritaNama"></b><p id="ceritaIsi"></p></div>
    </div>
    <div class="cerita-aksi"><button class="btn kecil hantu" id="bLewati" data-t="lewati"></button><button class="btn kecil utama" id="bLanjut" data-uji="lanjut"><span data-t="lanjut"></span><span data-ic="next"></span></button></div>
  </div>
</section>

<!-- HUD -->
<div id="hud" hidden>
  <div class="hud-kiri">
    <div class="pos"><b id="hPos">1</b><small id="hPosDari">/6</small></div>
    <div class="info"><span id="hPutaran"></span><span id="hWaktu" class="mono">0:00.0</span></div>
  </div>
  <div class="hud-kanan">
    <button class="xbtn" id="bJeda" data-uji="jeda" aria-label="Jeda"><span data-ic="pause"></span></button>
    <canvas id="peta" width="150" height="150"></canvas>
  </div>
  <div id="hSoal" class="hsoal" hidden>
    <div class="hsoal-label" data-t="gerbang"></div>
    <div class="hsoal-teks" id="hSoalTeks"></div>
    <div class="hsoal-pilihan" id="hSoalPil"></div>
    <div class="hsoal-jarak"><i id="hSoalJarak"></i></div>
  </div>
  <div class="hud-bawah">
    <div class="spido"><b id="hKec" class="mono">0</b><small>km/j</small><div class="drift"><i id="hDrift"></i></div></div>
  </div>
  <div class="slot" id="hSlot"><div class="slot-ikon" id="hItem"></div><small id="hItemNama"></small></div>
  <div id="toast"></div>
  <div id="kontrolSentuh">
    <div class="ks-kiri"><button id="tKiri" aria-label="Kiri"><span data-ic="back"></span></button><button id="tKanan" aria-label="Kanan"><span data-ic="next"></span></button></div>
    <div class="ks-kanan"><button id="tRem" class="kecil" aria-label="Rem">REM</button><button id="tDrift" aria-label="Drift"><span data-ic="drift"></span></button><button id="tItem" class="item" aria-label="Item"><span data-ic="star"></span></button></div>
  </div>
</div>
<div id="hitung" hidden></div>

<!-- jeda -->
<section id="jeda" class="layar">
  <div class="dialog"><h2 data-t="jeda"></h2>
    <button class="btn utama" id="bTeruskan" data-uji="teruskan"><span data-ic="play"></span><span data-t="teruskan"></span></button>
    <button class="btn" id="bUlangJeda"><span data-ic="redo"></span><span data-t="ulangi"></span></button>
    <button class="btn" id="bKeluar"><span data-ic="home"></span><span data-t="keluar"></span></button>
  </div>
</section>

<!-- hasil -->
<section id="hasil" class="layar">
  <div class="dialog lebar"><h2 data-t="hasil"></h2>
    <div class="hasil-atas"><div class="hasil-pos" id="hasilPos"></div><div class="hasil-bintang" id="hasilBintang"></div></div>
    <div class="hasil-stat" id="hasilStat"></div>
    <ol class="hasil-daftar" id="hasilDaftar"></ol>
    <p class="ket" id="hasilPesan"></p>
    <div class="hasil-aksi">
      <button class="btn" id="bUlangi" data-uji="ulangi"><span data-ic="redo"></span><span data-t="ulangi"></span></button>
      <button class="btn utama" id="bBerikut" data-uji="berikut"><span data-t="arenaBerikut"></span><span data-ic="next"></span></button>
      <button class="btn" id="bMenuHasil"><span data-ic="home"></span><span data-t="menu"></span></button>
    </div>
  </div>
</section>

<script type="module" src="js/99-main.js"></script>
</body></html>
