<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ketik Kilat Kosakata</title><link rel="stylesheet" href="../_kit/edu.css">
<style>
body{background:#2c3e50;background:linear-gradient(160deg,#34495e,#1f2d3a);color:#fff;display:grid;place-items:center}
.box{width:min(560px,92vw);background:#4a6075;border-radius:22px;padding:26px 24px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.4);margin-top:40px}
.mean{font-size:15px;color:#c9d6e2;text-transform:uppercase;letter-spacing:.12em}
.id{font-size:24px;font-weight:700;color:#ffd166;margin:2px 0 14px}
.word{font:700 clamp(38px,8vw,64px) 'Space Mono',monospace;letter-spacing:.06em;margin:0 0 16px;min-height:1.2em}
.word i{font-style:normal;color:#5fe3a1}.word u{text-decoration:none;color:#ff7a6b}
input{width:100%;font:700 26px 'Space Mono',monospace;text-align:center;padding:12px;border-radius:14px;border:3px solid #6f8aa3;background:#fff;color:#1f2d3a;outline:0}
input:focus{border-color:#FD5E2B}
.bar{height:10px;border-radius:9px;background:#2c3e50;margin-top:16px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,#5fe3a1,#ffd166,#ff7a6b);transition:width .25s}
.lv{display:flex;gap:8px;justify-content:center;margin-top:14px}.lv button{border:0;border-radius:999px;padding:6px 14px;font:700 13px 'Space Grotesk';background:#2c3e50;color:#c9d6e2;cursor:pointer}.lv button.on{background:#FD5E2B;color:#fff}
.box.good{animation:gd .35s}@keyframes gd{40%{transform:scale(1.03);box-shadow:0 0 0 6px #5fe3a1}}
</style></head><body>
<div class="box" id="box"><div class="mean">Arti dalam Bahasa Indonesia</div><div class="id" id="id">–</div><div class="word" id="word"></div>
<input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ketik kata Inggrisnya…" aria-label="Ketik kata">
<div class="bar"><div id="bar" style="width:100%"></div></div>
<div class="lv"><button data-lv="mudah" class="on">Mudah: kata terlihat</button><button data-lv="sulit">Sulit: hanya huruf awal</button></div></div>
<script src="../_kit/edu.js"></script>
<script>
/* Ketik Kilat Kosakata: terinspirasi Typing Game (bradtraversy/vanillawebprojects). Repo tanpa lisensi: kode ditulis sendiri dari nol. */
var G={w:null,time:20,max:20,score:0,run:false,lv:'mudah',benar:0,iv:null,used:[]};
EDU.hud({title:'Ketik Kilat Kosakata',timer:true,credit:'Terinspirasi Typing Game · Brad Traversy (tanpa lisensi, kode baru)'});
var inp=EDU.$('#inp');
function next(){
  var pool=EDU.VOCAB.filter(function(v){return G.used.indexOf(v[0])<0});if(!pool.length){G.used=[];pool=EDU.VOCAB}
  G.w=EDU.pick(pool);G.used.push(G.w[0]);EDU.$('#id').textContent=G.w[1];inp.value='';draw();EDU.setQ('Ketik: '+G.w[1]);
}
function draw(){
  var t=inp.value.toLowerCase(),w=G.w[0],h='';
  for(var i=0;i<w.length;i++){var c=w[i];if(i<t.length)h+=t[i]===c?'<i>'+c+'</i>':'<u>'+c+'</u>';else h+=(G.lv==='sulit'&&i>0)?'_':c}
  EDU.$('#word').innerHTML=h;
}
inp.addEventListener('input',function(){if(!G.run)return;draw();
  if(inp.value.toLowerCase().trim()===G.w[0]){G.score+=G.w[0].length;G.benar++;G.time=Math.min(G.max,G.time+3);EDU.setScore(G.score);EDU.sfx('ok');
    var b=EDU.$('#box');b.classList.remove('good');void b.offsetWidth;b.classList.add('good');EDU.toast(G.w[0]+' = '+G.w[1]+' · +3 detik',true);next()}
  else if(G.w[0].indexOf(inp.value.toLowerCase())!==0)EDU.sfx('tick');
});
document.querySelectorAll('[data-lv]').forEach(function(b){b.onclick=function(){G.lv=b.dataset.lv;document.querySelectorAll('[data-lv]').forEach(function(x){x.classList.toggle('on',x===b)});draw();inp.focus()}});
function tick(){G.time-=.1;EDU.setTime(Math.ceil(G.time));EDU.$('#bar').style.width=(G.time/G.max*100)+'%';if(G.time<=0)finish()}
function start(){G.score=0;G.time=20;G.benar=0;G.run=true;EDU.setScore(0);next();clearInterval(G.iv);G.iv=setInterval(tick,100);inp.focus();if(EDU.demo)auto()}
function finish(){G.run=false;clearInterval(G.iv);EDU.end({key:'ketik',score:G.score,benar:G.benar,salah:0,max:80,head:'Waktu habis!',note:'<p>Kamu mengetik '+G.benar+' kata dengan benar.</p>'},start)}
/* demo: mengetik huruf demi huruf, sesekali salah ketik lalu dihapus */
function auto(){if(!G.run)return;var w=G.w[0],v=inp.value;
  if(v&&w.indexOf(v)!==0)inp.value=v.slice(0,-1);else if(Math.random()<.08&&v.length>1)inp.value=v+'x';else inp.value=w.slice(0,v.length+1);
  inp.dispatchEvent(new Event('input'));setTimeout(auto,130+Math.random()*90)}
EDU.title({key:'ketik',title:'Ketik Kilat Kosakata',mapel:'Bahasa Inggris · SD Kelas 4 – SMP',desc:'Ketik kata Inggris secepat mungkin sebelum waktu habis.',how:['Lihat arti kata dalam Bahasa Indonesia.','Ketik kata Inggrisnya. Huruf hijau = benar, merah = salah.','Setiap kata benar menambah 3 detik. Mode Sulit hanya menampilkan huruf awal.']},start);
</script></body></html>
