<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Potong Makanan Sehat</title><link rel="stylesheet" href="../_kit/edu.css">
<style>body{background:#7a1f12}#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}</style></head><body>
<canvas id="cv"></canvas>
<script src="../_kit/edu.js"></script>
<script>
/* Potong Makanan Sehat: terinspirasi Fruit Slicer (he-is-talha/html-css-javascript-games, MIT). Kode ditulis ulang, gambar = emoji. */
var SEHAT=[['🍎','Apel: serat untuk pencernaan'],['🍌','Pisang: kalium untuk otot'],['🍉','Semangka: banyak air'],['🥦','Brokoli: vitamin C dan serat'],['🥕','Wortel: vitamin A untuk mata'],['🍊','Jeruk: vitamin C'],['🍇','Anggur: buah segar'],['🥑','Alpukat: lemak sehat'],['🍓','Stroberi: vitamin C'],['🥚','Telur: protein'],['🐟','Ikan: protein dan omega-3'],['🥛','Susu: kalsium untuk tulang']];
var KURANG=[['🍬','Permen: banyak gula'],['🍭','Lolipop: banyak gula'],['🥤','Minuman bersoda: banyak gula'],['🍟','Kentang goreng: banyak minyak dan garam'],['🍩','Donat: gula dan minyak'],['🍔','Burger cepat saji: lemak tinggi']];
var cv=EDU.$('#cv'),x=cv.getContext('2d'),W,H,G={};
EDU.hud({title:'Potong Makanan Sehat',lives:true,timer:true,credit:'Terinspirasi Fruit Slicer · he-is-talha (MIT)'});
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener('resize',size);
function start(){G={items:[],halves:[],trail:[],splats:[],score:0,lives:3,run:true,time:60,next:30,benar:0,salah:0,combo:0,t:0};EDU.setScore(0);EDU.setLives(3);EDU.setTime(60);EDU.setQ('Potong yang SEHAT, hindari yang kurang sehat')}
function toss(){var n=EDU.rand(2,4);for(var i=0;i<n;i++){var ok=Math.random()<.68,d=ok?EDU.pick(SEHAT):EDU.pick(KURANG),sx=W*.15+Math.random()*W*.7;
  G.items.push({e:d[0],info:d[1],ok:ok,x:sx,y:H+60,vx:(W/2-sx)/90+(Math.random()-.5)*2,vy:-Math.sqrt(2*.22*(H+60)*(.5+Math.random()*.32)),r:Math.max(40,Math.min(W,H)*.075),rot:0,vr:(Math.random()-.5)*.1})}}
function slice(it){it.dead=true;var good=it.ok;for(var s=-1;s<=1;s+=2)G.halves.push({e:it.e,x:it.x,y:it.y,vx:it.vx+s*2.5,vy:it.vy-1,rot:it.rot,vr:s*.12,r:it.r,side:s,l:60});
  G.splats.push({x:it.x,y:it.y,r:it.r*1.3,c:good?'rgba(255,214,90,.35)':'rgba(40,40,40,.35)',l:90});
  if(good){G.combo++;var pts=10+(G.combo>2?5:0);G.score+=pts;G.benar++;EDU.setScore(G.score);EDU.sfx('ok');EDU.floatText(it.x,it.y-it.r,'+'+pts,true);if(Math.random()<.35)EDU.toast(it.e+' '+it.info,true)}
  else{G.combo=0;G.lives--;G.salah++;EDU.setLives(G.lives);EDU.sfx('bad');EDU.toast(it.e+' '+it.info,false);if(G.lives<=0)over()}}
function over(){if(!G.run)return;G.run=false;EDU.end({key:'potong',score:G.score,benar:G.benar,salah:G.salah,max:500,head:G.lives>0?'Waktu habis!':'Terlalu banyak makanan kurang sehat'},start)}
function segHit(a,b,it){var dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((it.x-a.x)*dx+(it.y-a.y)*dy)/l));return Math.hypot(a.x+dx*t-it.x,a.y+dy*t-it.y)<it.r*.85}
function update(){G.t++;if(G.t%60===0){G.time--;EDU.setTime(G.time);if(G.time<=0)return over()}
  if(--G.next<=0){toss();G.next=EDU.rand(40,65)}
  G.items.forEach(function(it){it.x+=it.vx;it.y+=it.vy;it.vy+=.22;it.rot+=it.vr});G.items=G.items.filter(function(it){return !it.dead&&it.y<H+120});
  G.halves.forEach(function(h){h.x+=h.vx;h.y+=h.vy;h.vy+=.3;h.rot+=h.vr;h.l--});G.halves=G.halves.filter(function(h){return h.l>0});
  G.splats.forEach(function(s){s.l--});G.splats=G.splats.filter(function(s){return s.l>0});
  for(var i=1;i<G.trail.length;i++){var a=G.trail[i-1],b=G.trail[i];G.items.forEach(function(it){if(!it.dead&&segHit(a,b,it))slice(it)})}
  G.trail=G.trail.filter(function(p){return Date.now()-p.t<140});if(EDU.demo)demo()}
function draw(){var g=x.createRadialGradient(W/2,H*.4,50,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#c0392b');g.addColorStop(1,'#5e1209');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,200,120,.06)';for(var i=0;i<14;i++){x.fillRect(0,i*H/14,W,2)}
  x.fillStyle='rgba(120,60,20,.55)';x.fillRect(0,H-40,W,40);x.fillStyle='#e0a050';x.fillRect(0,H-44,W,4);
  G.splats.forEach(function(s){x.globalAlpha=s.l/90;x.fillStyle=s.c;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();x.globalAlpha=1});
  x.textAlign='center';x.textBaseline='middle';
  G.items.forEach(function(it){x.save();x.translate(it.x,it.y);x.rotate(it.rot);x.font=Math.round(it.r*1.6)+'px serif';x.fillText(it.e,0,0);x.restore();
    if(!it.ok){x.strokeStyle='rgba(255,255,255,.0)'}});
  G.halves.forEach(function(h){x.save();x.translate(h.x,h.y);x.rotate(h.rot);x.beginPath();x.rect(h.side<0?-h.r*1.2:0,-h.r*1.2,h.r*1.2,h.r*2.4);x.clip();x.globalAlpha=Math.min(1,h.l/30);x.font=Math.round(h.r*1.6)+'px serif';x.fillText(h.e,0,0);x.restore()});
  if(G.trail.length>1){x.strokeStyle='rgba(255,255,255,.9)';x.lineCap='round';for(var k=1;k<G.trail.length;k++){x.lineWidth=k*1.2;x.beginPath();x.moveTo(G.trail[k-1].x,G.trail[k-1].y);x.lineTo(G.trail[k].x,G.trail[k].y);x.stroke()}}
  x.fillStyle='rgba(255,240,210,.9)';x.font='700 '+Math.max(14,W/70)+'px Space Grotesk';x.fillText('✅ Sehat: buah, sayur, telur, ikan, susu    ❌ Kurang sehat: permen, soda, gorengan',W/2,H-20)}
var down=false;cv.addEventListener('pointerdown',function(e){down=true;G.trail=[{x:e.clientX,y:e.clientY,t:Date.now()}]});cv.addEventListener('pointermove',function(e){if(down||e.pointerType==='mouse'&&e.buttons)G.trail.push({x:e.clientX,y:e.clientY,t:Date.now()})});addEventListener('pointerup',function(){down=false});
/* demo: sabetan melewati makanan sehat dekat puncak lemparan */
var cool=0;function demo(){if(--cool>0)return;var t=G.items.find(function(it){return it.ok&&!it.dead&&it.vy>-3&&it.y<H*.75&&!G.items.some(function(b){return !b.ok&&!b.dead&&Math.hypot(b.x-it.x,b.y-it.y)<it.r*3.2})});if(!t){var bad=G.items.find(function(it){return !it.ok&&it.vy>-1});if(bad&&Math.random()<.002){t=bad}else return}
  var a=Math.random()*Math.PI,len=t.r*2.2,s=Date.now();cool=18;var pts=[];for(var i=0;i<=8;i++){var f=i/8-.5;pts.push({x:t.x+Math.cos(a)*len*f,y:t.y+Math.sin(a)*len*f*.6+t.vy*2})}
  pts.forEach(function(p,i){setTimeout(function(){G.trail.push({x:p.x,y:p.y,t:Date.now()})},i*12)})}
function loop(){if(G.run)update();if(G.items)draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);window.__G=function(){return G};
EDU.title({key:'potong',title:'Potong Makanan Sehat',mapel:'PJOK / IPA · Gizi seimbang · TK – SD Kelas 4',desc:'Sabet makanan SEHAT yang dilempar ke atas. Jangan potong makanan yang kurang sehat!',how:['Geser mouse/jari untuk memotong.','Buah, sayur, telur, ikan, susu = +10 (berturut-turut = bonus).','Permen, soda, gorengan = nyawa berkurang. Waktu 60 detik.']},start);
</script></body></html>
