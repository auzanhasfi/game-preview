<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Tebak Kata</title><link rel="stylesheet" href="../_kit/edu.css">
<style>
body{background:#121213;color:#fff;display:grid;place-items:center}
.wrap{margin-top:62px;display:flex;flex-direction:column;align-items:center;gap:12px}
.hint{font-size:15px;color:#c9c9c9;min-height:22px;text-align:center;max-width:90vw}.hint b{color:#ffd166}
#grid{display:grid;grid-template-rows:repeat(6,1fr);gap:6px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.row.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.c{width:min(13vw,calc((100vh - 380px)/6),62px);aspect-ratio:1;border:2px solid #3a3a3c;display:grid;place-items:center;font:800 clamp(20px,4.6vw,32px) 'Space Grotesk';text-transform:uppercase}
.c.f{border-color:#565758;animation:pop .1s}@keyframes pop{50%{transform:scale(1.1)}}
.c.g{background:#538d4e;border-color:#538d4e}.c.y{background:#b59f3b;border-color:#b59f3b}.c.x{background:#3a3a3c;border-color:#3a3a3c}.c.flip{animation:fl .45s ease}@keyframes fl{50%{transform:rotateX(90deg)}}
#kb{display:grid;gap:6px;width:min(96vw,500px)}.kr{display:flex;gap:5px;justify-content:center}
.k{flex:1;max-width:44px;height:52px;border:0;border-radius:6px;background:#818384;color:#fff;font:700 15px 'Space Grotesk';cursor:pointer;text-transform:uppercase}.k.w{max-width:70px;font-size:12px}
.k.g{background:#538d4e}.k.y{background:#b59f3b}.k.x{background:#3a3a3c}.k.pr{filter:brightness(1.5)}
.tools{display:flex;gap:8px}.tools button{border:0;border-radius:999px;padding:6px 14px;font:700 13px 'Space Grotesk';background:#2a2a2c;color:#fff;cursor:pointer}
</style></head><body>
<div class="wrap"><div class="hint" id="hint">Tebak kata 5 huruf. Petunjuk: <b id="hb">…</b></div><div id="grid"></div><div class="tools"><button id="bh">💡 Huruf pertama</button><button id="bn">↻ Kata baru</button></div><div id="kb"></div></div>
<script src="../_kit/edu.js"></script>
<script>
/* Tebak Kata: terinspirasi Wordle (he-is-talha/html-css-javascript-games, MIT). Kode ditulis ulang untuk kosakata Bahasa Indonesia. */
var W=[['RUMAH','tempat tinggal keluarga'],['PINTU','tempat keluar masuk ruangan'],['MERAH','warna darah dan cabai'],['HIJAU','warna daun'],['BUNGA','bagian tumbuhan yang indah dan harum'],['POHON','tumbuhan besar berbatang kayu'],
  ['GAJAH','hewan berbelalai'],['SINGA','raja hutan'],['PASAR','tempat jual beli'],['SAWAH','lahan tempat menanam padi'],['BULAN','benda langit yang bersinar di malam hari'],['HUJAN','air yang turun dari awan'],['TANAH','tempat akar tumbuhan tertanam'],
  ['BATIK','kain bermotif khas Indonesia'],['ANGIN','udara yang bergerak'],['NANAS','buah bermahkota daun, rasanya asam manis'],['SALAK','buah bersisik seperti kulit ular'],['TEMPE','makanan dari kedelai'],['KATAK','hewan amfibi yang melompat'],
  ['KAPAL','kendaraan di laut'],['KURSI','tempat duduk'],['LAMPU','alat penerang'],['GELAS','wadah untuk minum'],['MURID','orang yang belajar di sekolah'],['KELAS','ruang belajar'],['JUJUR','berkata apa adanya, tidak bohong'],
  ['RAJIN','suka bekerja dan belajar'],['HUTAN','tempat banyak pohon tumbuh'],['DANAU','genangan air luas di daratan'],['PULAU','daratan yang dikelilingi air']];
var G={};
EDU.hud({title:'Tebak Kata',credit:'Terinspirasi Wordle · he-is-talha (MIT)'});
var KB=['QWERTYUIOP','ASDFGHJKL','⏎ZXCVBNM⌫'];
EDU.$('#kb').innerHTML=KB.map(function(r){return '<div class="kr">'+r.split('').map(function(k){return '<button class="k'+(k==='⏎'||k==='⌫'?' w':'')+'" data-k="'+k+'">'+(k==='⏎'?'ENTER':k)+'</button>'}).join('')+'</div>'}).join('');
EDU.$('#kb').onclick=function(e){var b=e.target.closest('[data-k]');if(b)key(b.dataset.k)};
document.addEventListener('keydown',function(e){if(e.key==='Enter')key('⏎');else if(e.key==='Backspace')key('⌫');else if(/^[a-z]$/i.test(e.key))key(e.key.toUpperCase())});
function grid(){var h='';for(var r=0;r<6;r++){h+='<div class="row">';for(var c=0;c<5;c++)h+='<div class="c" id="c'+r+c+'"></div>';h+='</div>'}EDU.$('#grid').innerHTML=h}
function newWord(){var pool=W.filter(function(w){return G.used.indexOf(w[0])<0});if(!pool.length){G.used=[];pool=W}G.w=EDU.pick(pool);G.used.push(G.w[0]);G.r=0;G.cur='';G.done=false;G.cand=W.map(function(w){return w[0]});grid();
  document.querySelectorAll('.k').forEach(function(k){k.className='k'+(k.dataset.k==='⏎'||k.dataset.k==='⌫'?' w':'')});EDU.$('#hb').textContent=G.w[1];EDU.setQ('Kata ke-'+(G.n+1)+': '+G.w[1])}
function key(k){if(G.done)return;var b=EDU.$('.k[data-k="'+k+'"]');if(b){b.classList.add('pr');setTimeout(function(){b.classList.remove('pr')},110)}
  if(k==='⌫'){G.cur=G.cur.slice(0,-1)}else if(k==='⏎'){if(G.cur.length<5){var rw=EDU.$('#grid').children[G.r];rw.classList.add('shake');setTimeout(function(){rw.classList.remove('shake')},400);EDU.toast('Kurang huruf');return}return submit()}else if(G.cur.length<5)G.cur+=k;
  for(var c=0;c<5;c++){var el=EDU.$('#c'+G.r+c);el.textContent=G.cur[c]||'';el.classList.toggle('f',!!G.cur[c])}}
function score(g,t){var res=['x','x','x','x','x'],left=t.split('');for(var i=0;i<5;i++)if(g[i]===t[i]){res[i]='g';left[i]=null}for(i=0;i<5;i++){if(res[i]==='g')continue;var j=left.indexOf(g[i]);if(j>=0){res[i]='y';left[j]=null}}return res}
function submit(){var g=G.cur,res=score(g,G.w[0]),r=G.r;G.done=true;
  res.forEach(function(s,i){setTimeout(function(){var el=EDU.$('#c'+r+i);el.classList.add('flip');setTimeout(function(){el.classList.add(s)},220);var kb=EDU.$('.k[data-k="'+g[i]+'"]');if(kb&&!kb.classList.contains('g')){kb.classList.remove('y','x');kb.classList.add(s==='g'?'g':s==='y'&&!kb.classList.contains('g')?'y':kb.classList.contains('y')?'y':s)}},i*230)});
  G.cand=G.cand.filter(function(w){return score(g,w).join()===res.join()});
  setTimeout(function(){if(g===G.w[0]){var pts=(6-r)*10+10;G.score+=pts;G.benar++;G.n++;EDU.setScore(G.score);EDU.sfx('win');EDU.toast('✔ '+G.w[0]+' = '+G.w[1]+' · +'+pts,true);setTimeout(roundEnd,1400)}
    else if(r===5){G.salah++;G.n++;EDU.sfx('bad');EDU.toast('Jawabannya: '+G.w[0]+' ('+G.w[1]+')',false);setTimeout(roundEnd,1800)}
    else{G.r++;G.cur='';G.done=false;EDU.sfx('tick');if(EDU.demo)setTimeout(auto,500)}},5*230+250)}
function roundEnd(){if(G.n>=5)return EDU.end({key:'tebakkata',score:G.score,benar:G.benar,salah:G.salah,max:250,head:'5 kata selesai!'},start);newWord();if(EDU.demo)setTimeout(auto,600)}
EDU.$('#bh').onclick=function(){if(G.done)return;G.score=Math.max(0,G.score-5);EDU.setScore(G.score);EDU.toast('Huruf pertama: '+G.w[0][0])};
EDU.$('#bn').onclick=function(){G.n++;roundEnd()};
function start(){G={used:[],score:0,benar:0,salah:0,n:0};EDU.setScore(0);newWord();if(EDU.demo)setTimeout(auto,700)}
/* demo: ketik tebakan yang masih cocok dengan petunjuk warna */
function auto(){if(G.done||document.querySelector('.edu-ov'))return;var guess=G.r===0?EDU.pick(['MERAH','PULAU','KATAK','SINGA'].filter(function(w){return w!==G.w[0]})):(G.cand.length?EDU.pick(G.cand):G.w[0]);
  var i=0;(function t(){if(i<5){key(guess[i++]);setTimeout(t,140)}else setTimeout(function(){key('⏎')},250)})()}
EDU.title({key:'tebakkata',title:'Tebak Kata',mapel:'Bahasa Indonesia · Kosakata · SD Kelas 3 – SMP',desc:'Tebak kata 5 huruf dari petunjuk artinya, dalam 6 kesempatan.',how:['Ketik kata 5 huruf lalu tekan ENTER.','Hijau = huruf & posisi benar. Kuning = huruf ada tapi posisi salah. Abu-abu = tidak ada.','5 kata per ronde. Makin cepat tertebak, makin besar skornya.']},start);
</script></body></html>
